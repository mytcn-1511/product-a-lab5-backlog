          mới được đặt cookie phiên; thử thách hết hạn sau 5 phút, không có trạng thái "đăng nhập nửa chừng". Phiên trên thiết bị dùng chung hạn 8 giờ
          (một ca), không gia hạn trượt, không ghi nhớ thiết bị; hạn 8 giờ áp cho mọi vai vì thiết bị chung không phân biệt vai.
          Mã sai đếm vào giới hạn tốc độ của X01-04.
        viec: |
