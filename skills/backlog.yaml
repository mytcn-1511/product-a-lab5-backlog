        boi_canh: |
          Chưa có bảng nào lưu quy tắc thông báo (D-03) và không một dòng mã nào ghi vào bảng thông báo (D-31). Thiết kế LAB-4 đề xuất bảng notification_rules:
          mỗi loại thông báo một dòng đang hiệu lực, mỗi lần lưu là một dòng mới trỏ về dòng cũ (không sửa đè, không xoá), lý do bắt buộc, chỉ vai quản trị hệ thống được sửa.
          Số lần thử lại tối đa 3 là trần của RFP. Giờ gửi là giờ trong ngày hiểu theo giờ Nhật, không phải thời điểm tuyệt đối.
