              Tìm mọi route trong src/app/api đang tự viết câu lỗi hoặc tự trả mã HTTP lỗi; thay bằng mã trong src/lib/error-codes.ts qua hàm của src/lib/api.ts. Mã nào chưa có trong bảng thì thêm vào docs/ma-loi.md trước.
