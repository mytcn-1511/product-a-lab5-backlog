          - src/app/api/jobs/send-notifications/route.ts (mới, đường job)
          - docs/job-lich-chay.md (thêm dòng)
        con:
          - key: T15-02.1-xep-hang-gui-va-job-gui-lan-dau
            title: "Xếp hàng gửi thông báo theo người nhận và kênh, job gửi lần đầu qua nhà cung cấp email cấu hình bằng biến môi trường"
            labels: [nguon:moi, doi:be]
            boi_canh: |
              Issue con của T15-02-gui-email-co-thu-lai-va-hang-doi-het-luot; đọc bối cảnh ở issue cha.
            viec: |
              Tạo migration bảng notification_deliveries với ràng buộc kiểm trạng thái, kênh, số lần thử lại từ 0 đến 3; chỉ mục theo trạng thái và thời điểm thử tiếp. Mở rộng hàm ghi thông báo của T15-01.2: sau khi ghi thông báo, tạo một dòng chờ gửi cho mỗi người nhận × kênh, ghi mã phiên bản quy tắc lúc xếp. Viết job gửi qua đường API nội bộ, lịch pg_cron mỗi phút: lấy dòng chờ gửi tới hạn; kênh trong ứng dụng thì đánh dấu đã gửi ngay; kênh email gọi nhà cung cấp cấu hình bằng biến môi trường. Dòng có cờ gửi thử bị loại khỏi mọi thống kê. Thêm dòng lịch job vào docs/job-lich-chay.md và cách cấu hình nhà cung cấp email.
            tieu_chi_xong:
              - "Ghi một thông báo loại tranh chấp mở với quy tắc 2 vai nhận, 2 kênh, dữ liệu mẫu có 3 người thuộc 2 vai: bảng log có 6 dòng chờ gửi, mỗi dòng ghi mã phiên bản quy tắc"
