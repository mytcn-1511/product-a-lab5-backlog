epics:
  - key: E-T02
    title: "Bảng điều khiển đầu ca: chỉ số theo vai trò, bấm là tới đúng màn, tự làm mới"
    labels: []
    body: |
      Epic gom việc của gói T-02 (màn SCR-02, bảng điều khiển mở suốt ca ở phòng điều hành). Prototype đã có 9 ô chỉ số và bảng 5 ngày
      nghiệp vụ gần nhất, nhưng mọi vai trò thấy cùng một bộ chỉ số (D-16), ô chỉ số không bấm được, số liệu đứng yên từ lúc mở màn,
      và ngưỡng "sắp hết hạn" 30 ngày viết cứng ở hai chỗ (D-18) nên số trên bảng điều khiển có thể lệch với danh sách hồ sơ (SCR-05).
      Tiền đề: PREMISE.md giữ nguyên LAB-4 cho gói này, không có D-xx mới. Bảng cấu hình ngưỡng hết hạn đặt ở epic này vì bảng điều khiển
      là nơi hai màn phải khớp số; API danh sách người tham gia (issue T04-05) đọc lại qua cùng một hàm.
      Giả định: không có giả định riêng; epic bám PREMISE.md và thiết kế LAB-4.
      Thứ tự làm: T02-01 → T02-02 → T02-03 → T02-04.
    issues:
      - key: T02-01-bang-cau-hinh-nguong-het-han
        title: "Bảng cấu hình ngưỡng cảnh báo sắp hết hạn và một hàm đọc dùng chung"
        labels: [nguon:chenh-lech, doi:be]
        boi_canh: |
          D-18: hằng số 30 ngày nằm ở hai chỗ (API bảng điều khiển và API danh sách người tham gia; API là đường gọi máy chủ), không đặt tên ở một chỗ.
          Hôm nay hai chỗ tình cờ khớp; đổi một bên mà quên bên kia thì bảng điều khiển nói "3 hồ sơ sắp hết hạn" còn bấm sang danh sách
          lại ra 4 dòng. Thiết kế LAB-4 chốt: ngưỡng đọc từ database, một giá trị cho toàn hệ thống, không theo loại người tham gia.
          許可 (giấy phép) và 承認 (giấy chấp thuận) là hai loại giấy tờ có ngày hết hạn mà ngưỡng này áp dụng.
          Việc đổi API danh sách người tham gia sang hàm này làm ở T04-05 (cùng file), issue này không chạm file đó.
        viec: |
          Tạo bảng cấu hình chung (khoá, giá trị, người sửa, thời điểm sửa) với khoá "participant.expiring_days", giá trị mặc định 30.
          Viết một hàm database expiring_until() tính "ngày cuối cửa sổ cảnh báo" = ngày hiện tại theo giờ Nhật cộng số ngày trong cấu hình.
          API bảng điều khiển gọi hàm này thay cho hằng số. Màn sửa giá trị thuộc gói cài đặt thông báo (T-15), không làm ở đây. Migration có bước quay lại.
        tieu_chi_xong:
          - Sau migration, giá trị cấu hình là 30 và số hồ sơ sắp hết hạn trên bảng điều khiển bằng số dòng danh sách lọc "sắp hết hạn" trên cùng dữ liệu mẫu
          - Đổi giá trị cấu hình thành 45 bằng lệnh database rồi gọi lại API bảng điều khiển thì số đổi theo, không cần triển khai lại mã
          - Hồ sơ hết hạn đúng ngày "hôm nay cộng 30" được đếm là sắp hết hạn; hồ sơ hết hạn ngày "hôm nay cộng 31" thì không
          - Máy chủ đặt múi giờ UTC, gọi lúc 02:31 giờ Nhật thì ngày hiện tại dùng để tính vẫn là ngày theo giờ Nhật
          - Không còn hằng số 30 trong file API bảng điều khiển (kiểm bằng lệnh grep)
          - Chạy bước quay lại migration thì bảng cấu hình và hàm biến mất, API bảng điều khiển vẫn chạy với mặc định 30
        file_cham:
          - supabase/schema.sql (bảng app_settings mới, hàm expiring_until mới)
          - src/app/api/dashboard/route.ts

      - key: T02-02-loc-chi-so-theo-vai-tro
        title: "API bảng điều khiển chỉ trả chỉ số mà vai trò đó hành động được"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T02-01-bang-cau-hinh-nguong-het-han]
        boi_canh: |
          D-16: thiết kế gốc nói "chỉ số theo vai trò", prototype trả 9 chỉ số giống hệt cho cả 8 vai trò. Vai xem thấy ô "tranh chấp đang mở"
          nhưng bấm vào là bị từ chối quyền. Nguyên tắc: một chỉ số chỉ hiện cho vai có màn đích để hành động trên nó. Chỉ số bằng 0 vẫn trả, không ẩn.
          Ma trận vai trò × chỉ số (9 chỉ số: lô chờ thẩm định, lô đang mở, giao hàng chưa xong, tranh chấp mở, điều chỉnh chờ duyệt,
          hồ sơ sắp hết hạn, hồ sơ đã hết hạn, phiên bản tỷ lệ nháp, thông báo chưa đọc; cộng bảng 5 ngày):
          · tiếp nhận (intake): lô chờ thẩm định, lô đang mở, sắp hết hạn, đã hết hạn, thông báo — 5 ô, không bảng 5 ngày
          · thẩm định (judge): lô chờ thẩm định, lô đang mở, thông báo — 3 ô, không bảng 5 ngày
          · giao dịch (trade): lô đang mở, giao hàng chưa xong, điều chỉnh chờ duyệt, thông báo — 4 ô, có bảng 5 ngày
          · giao hàng (delivery): giao hàng chưa xong, thông báo — 2 ô, có bảng 5 ngày
          · đối soát (settlement): giao hàng chưa xong, tranh chấp mở, điều chỉnh chờ duyệt, sắp hết hạn, đã hết hạn, tỷ lệ nháp, thông báo — 7 ô, có bảng 5 ngày
          · quản trị quy tắc (rule_admin): tỷ lệ nháp, thông báo — 2 ô, không bảng 5 ngày
          · quản trị hệ thống (sys_admin): đủ 9 ô, có bảng 5 ngày
          · xem (viewer): thông báo — 1 ô, có bảng 5 ngày
          Ngoài ra một trong 9 lượt đếm lỗi thì cả màn báo lỗi 500 vì dùng Promise.all.
        viec: |
          Trong API bảng điều khiển, đọc vai trò từ phiên và chỉ trả các khoá chỉ số có trong ma trận trên cho vai đó; lọc ở máy chủ, không lọc ở trình duyệt.
          Chạy 9 lượt đếm bằng Promise.allSettled: ô lỗi trả giá trị null kèm cờ lỗi, các ô khác vẫn có số. Ngày nghiệp vụ hiện hành vẫn là ngày đang
          mở gần nhất (giữ nguyên). Không ghi nhật ký vì là thao tác đọc.
        tieu_chi_xong:
          - Đăng nhập vai xem thì phản hồi API chỉ có khoá thông báo chưa đọc và bảng 5 ngày; vai đối soát có đúng 7 ô theo ma trận; vai quản trị hệ thống có đủ 9 ô
          - Vai tiếp nhận có 0 lô chờ thẩm định thì ô "lô chờ thẩm định" vẫn có trong phản hồi với giá trị 0
          - "Giả lập một lượt đếm lỗi (ví dụ đổi tên bảng tranh chấp trong môi trường thử): API trả 200, ô tranh chấp có cờ lỗi, 8 ô còn lại đúng số"
        file_cham:
          - src/app/api/dashboard/route.ts
          - src/lib/roles.ts (ma trận vai trò × chỉ số)

      - key: T02-03-man-bang-dieu-khien-link-va-tu-lam-moi
        title: "Màn bảng điều khiển: ô chỉ số là link lọc sẵn, tự làm mới mỗi 60 giây, giữ số cũ khi tải lại lỗi"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T02-02-loc-chi-so-theo-vai-tro, T03-01-rpc-doi-quyen-khoa-chan-admin-cuoi]
        boi_canh: |
          Thiết kế LAB-4 chốt: mọi chỉ số phải bấm được và dẫn tới màn đã lọc đúng tập dữ liệu đang đếm, kể cả ô bằng 0 (bấm vào ô "0 tranh chấp"
          ra màn rỗng có câu xác nhận là có giá trị). Prototype hiện ô chỉ số là chữ tĩnh. Màn đầu ca mở suốt 8 tiếng nhưng prototype chỉ tải
          một lần: mở lúc 02:00, đến 09:00 vẫn là số của 02:00; một lần tải lại lỗi thì xoá sạch số đang hiện. Chốt: tự làm mới 60 giây, dừng khi tab ẩn,
          có nhãn giờ chụp; kênh thời gian thực đã cân nhắc và bỏ. Số đổi giữa lúc xem và lúc bấm là chấp nhận được vì bảng điều khiển chỉ là ảnh chụp.
          Đã kiểm prototype: chưa màn đích nào đọc tham số lọc trên URL. Issue này chỉ phát link đúng tham số; việc màn đích đọc tham số thuộc
          issue của màn đó (danh sách người tham gia: T04-07; giao hàng: T08-07; các màn còn lại: T02-04).
          Chuyển về trang đăng nhập khi tài khoản bị khoá giữa ca cần T03-01 thu hồi phiên.
        viec: |
          Biến 9 ô thành link với tham số: lô chờ thẩm định và lô đang mở → /lots?day={ngày hiện hành}; giao hàng chưa xong → /deliveries?only=pending;
          tranh chấp → /settlement; điều chỉnh chờ duyệt → /corrections?status=pending; sắp hết hạn → /participants?filter=expiring;
          đã hết hạn → /participants?filter=expired; tỷ lệ nháp → /rules?status=draft; thông báo → /notifications. Mỗi dòng bảng 5 ngày →
          /settlement?day={ngày đó}. Ô có cờ lỗi hiện dấu gạch ngang kèm chú thích "Không đọc được". Bảng 5 ngày rỗng hiện dòng
          "Chưa có ngày nghiệp vụ nào, tạo ở màn đối soát". Thêm bộ hẹn giờ 60 giây gọi lại API, dừng khi tab ẩn, chạy lại khi tab hiện;
          dòng "Số liệu lúc HH:mm" (giờ Nhật) và nút "Làm mới". Tải lại lỗi thì giữ số cũ và hiện cảnh báo kèm giờ chụp; API trả 401 thì chuyển về đăng nhập.
        tieu_chi_xong:
          - Kiểm thuộc tính href của 9 ô và 5 dòng bảng đúng bảng tham số ở trên (kiểm bằng công cụ của trình duyệt)
          - Ô bằng 0 vẫn là link, không bị khoá
          - Xoá hết ngày nghiệp vụ trong dữ liệu thử thì bảng 5 ngày hiện dòng hướng dẫn, không hiện bảng trống
          - Mở màn, tạo thêm một tranh chấp ở tab khác, trong vòng 60 giây ô tranh chấp tự tăng mà không bấm gì
          - Ẩn tab 5 phút rồi quay lại thì có đúng một lần gọi API ngay khi tab hiện, không có 5 lần dồn (kiểm bằng tab Network)
          - "Tắt máy chủ API rồi chờ một chu kỳ: số cũ vẫn hiện kèm cảnh báo và giờ chụp; bật lại thì cảnh báo tự mất ở chu kỳ sau"
          - Khoá tài khoản đang xem từ màn quản trị, trong vòng 60 giây màn đó chuyển về trang đăng nhập
          - Bấm "Làm mới" hai lần nhanh chỉ tạo một lần gọi API
          - Toàn màn đọc được trong một màn hình không cuộn ở độ phân giải 1366 × 768
        file_cham:
          - src/app/(app)/dashboard/page.tsx

      - key: T02-04-man-dich-doc-tham-so-loc-tren-url
        title: "Tám màn đích đọc và giữ tham số lọc trên URL, thêm cột và bộ lọc mã phiên đấu giá"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T02-03-man-bang-dieu-khien-link-va-tu-lam-moi]
        boi_canh: |
          Thiết kế LAB-4 (hợp đồng tham số trên URL) quy định ?day= cho /lots /trades /seri /settlement, ?period= cho /incentives /reports, ?type= cho /trades,
          ?status= cho /corrections và /rules. Prototype chưa màn nào đọc các tham số này: bấm ô chỉ số trên bảng điều khiển (T02-03) ra màn chưa lọc, đổi ngày
          rồi bấm Back thì mất ngày đang chọn. Danh sách người tham gia và màn giao hàng đã có issue riêng (T04-07, T08-07); issue này làm tám màn còn lại.
          Mã phiên đấu giá (seri_session) đã có định dạng ở T06-07 nhưng chưa hiện trên bảng số dư và chưa lọc được.
        viec: |
          Ở tám màn /lots, /trades, /seri, /settlement, /corrections, /rules, /incentives, /reports: đọc tham số khi mở màn, đổi bộ lọc thì ghi lại lên URL
          (thay mục lịch sử, không thêm), giá trị sai thì bỏ qua và dùng mặc định của hợp đồng. Giữ ?day= và ?period= khi chuyển giữa các màn cùng tham số.
          Màn giao dịch: thêm cột mã phiên trên bảng số dư và ô lọc ?session= theo mã phiên.
        tieu_chi_xong:
          - "Bấm ô \"lô chờ thẩm định\", \"điều chỉnh chờ duyệt\", \"tỷ lệ nháp\" và một dòng bảng 5 ngày trên bảng điều khiển: màn đích mở đúng tập đã lọc, số dòng bằng số trên ô"
          - Đổi ngày ở /trades rồi bấm Back của trình duyệt thì quay về ngày trước; tải lại trang vẫn giữ ngày đang chọn
          - "/settlement?day=2026-13-40 không lỗi, mở ngày đang mở gần nhất; /incentives?period=abc mở kỳ mới nhất"
          - Từ /trades?day=X chuyển sang /settlement bằng menu thì vẫn là ngày X
          - Bảng số dư có cột mã phiên; /trades?type=seri&session=SERI-1021-A chỉ ra giao dịch của phiên đó
        file_cham:
          - src/app/(app)/lots/page.tsx
          - src/app/(app)/trades/trade-page.tsx
          - src/app/(app)/trades/trade-table.tsx
          - src/app/(app)/seri/ (trang nhập kết quả せり)
          - src/app/(app)/settlement/page.tsx
          - src/app/(app)/corrections/page.tsx
          - src/app/(app)/rules/page.tsx
          - src/app/(app)/incentives/page.tsx
          - src/app/(app)/reports/page.tsx

  - key: E-T03
    title: "Quản trị tài khoản nội bộ: đổi vai trò và khoá tài khoản có vết, không bao giờ mất quản trị viên cuối cùng"
    labels: []
    body: |
      Epic gom việc của gói T-03 (màn SCR-03, chỉ vai quản trị hệ thống dùng). Phần đăng nhập (gói T-01) đã gộp vào epic X-01, không làm ở đây.
      Prototype đã có đổi vai trò, khoá và mở tài khoản kèm lý do, nhưng có một lỗ hổng mức cao (S-07): hai quản trị viên khoá lẫn nhau cùng lúc
      thì không còn ai vào được, phải sửa tay trong database. Ngoài ra cập nhật và ghi nhật ký là hai lệnh rời (cùng mẫu B-20), lý do xin bằng
      hộp thoại mặc định của trình duyệt (D-12), và vai trò ban đầu suy từ địa chỉ email (D-09) chỉ hợp để demo.
      Tiền đề: PREMISE.md giữ nguyên LAB-4 cho gói này. Đề (RFP mục 02-08) xếp khoá/mở tài khoản vào nhóm thao tác nhạy cảm bắt buộc có vết.
      Cột bật/tắt xác thực 2 bước (mfa_enabled) trên màn này làm ở X02-03 (bảo mật), không ở đây.
      Giả định: không có giả định riêng; epic bám PREMISE.md và thiết kế LAB-4.
      Thứ tự làm: T03-01 → T03-02; T03-03 độc lập.
    issues:
      - key: T03-01-rpc-doi-quyen-khoa-chan-admin-cuoi
        title: "Đổi vai trò và khoá tài khoản chạy trong một hàm database, chặn khi sẽ không còn quản trị viên nào hoạt động"
        labels: [nguon:gia-co, doi:be]
        boi_canh: |
          S-07 (mức cao): API (đường gọi máy chủ) chỉ chặn tự khoá chính mình, không đếm số quản trị viên còn hoạt động. Hai quản trị viên A và B
          cùng bấm khoá người kia thì cả hai bị khoá. Đếm trước rồi cập nhật sau không đủ vì chính khoảng trống giữa hai lệnh là chỗ xảy ra lỗi;
          phải đếm trong cùng giao dịch database với lệnh cập nhật. Phương án giữ một tài khoản bất khả xâm phạm đã cân nhắc và bỏ.
          Cùng lúc, cập nhật và ghi nhật ký đang là hai lệnh rời: cập nhật xong mà nhật ký lỗi thì đổi quyền không có vết (B-20).
        viec: |
          Tạo hàm database update_profile_with_audit chạy trong một giao dịch: kiểm lý do bắt buộc, kiểm mỗi lần chỉ đổi một trong hai
          (vai trò hoặc trạng thái hoạt động), kiểm không tự khoá hoặc tự hạ quyền, đếm số quản trị hệ thống đang hoạt động sau khi áp thay đổi
          và từ chối nếu về 0, cập nhật, ghi nhật ký với giá trị trước và sau; nhật ký lỗi thì huỷ cả thao tác. API chỉ gọi hàm này.
          Sau khi khoá thành công, gọi API quản trị của Supabase thu hồi phiên của người bị khoá để đẩy ra ngay.
        tieu_chi_xong:
          - "Hai quản trị hệ thống A và B gửi lệnh khoá nhau cùng lúc (hai yêu cầu song song bằng script): đúng một lệnh thành công, lệnh kia trả 409 kèm câu \"Đây là quản trị viên đang hoạt động cuối cùng, cấp quyền cho người khác trước\""
          - Chỉ còn một quản trị hệ thống, người đó hạ một tài khoản vai đối soát xuống vai xem thì thành công
          - Gửi cả vai trò lẫn trạng thái trong một yêu cầu thì bị từ chối 422, không có dòng nhật ký nào
          - "Giả lập lỗi ghi nhật ký (khoá bảng nhật ký trong môi trường thử): vai trò không đổi, API trả lỗi"
          - Tài khoản vừa bị khoá gửi yêu cầu kế tiếp nhận 401 ngay, không cần chờ hết phiên
          - Thiếu lý do thì bị từ chối ở hàm database, kể cả khi gọi thẳng không qua màn
        file_cham:
          - supabase/schema.sql (hàm update_profile_with_audit mới)
          - src/app/api/admin/users/[id]/route.ts

      - key: T03-02-man-quan-tri-tai-khoan-hop-thoai-va-lich-su
        title: "Màn quản trị tài khoản: hộp thoại lý do của ứng dụng và bảng lịch sử đổi quyền đọc được bằng chữ"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T03-01-rpc-doi-quyen-khoa-chan-admin-cuoi, INC-10-hop-thoai-xac-nhan-that, T13-01-cot-ma-nghiep-vu-ten-nguoi-va-tu-vung]
        boi_canh: |
          D-12: prototype xin lý do bằng hộp thoại mặc định của trình duyệt (window.prompt), không hiện lại tài khoản sắp bị tác động, không khoá nút
          nên bấm hai lần sinh hai dòng nhật ký. Khi thao tác lỗi, lỗi hiện rồi bị xoá ngay vì màn tải lại dữ liệu. Bảng lịch sử đọc thẳng từ nhật ký
          (giữ, một nguồn sự thật) nhưng hiện mã thao tác thô (profile.role_change), mã tài khoản dạng UUID cắt 8 ký tự, không có tên người thực hiện
          và không thấy giá trị cũ sang mới. Tên người thực hiện chụp tại thời điểm thao tác do T13-01 thêm cột. Hộp thoại dùng chung do INC-10 tạo
          và phải nhận được nội dung tuỳ biến (khe chèn ô nhập); nếu INC-10 chưa đủ thì bổ sung tiêu chí vào INC-10.
        viec: |
          Thay hộp thoại trình duyệt bằng hộp thoại của ứng dụng: hiện email và vai trò hiện tại của tài khoản, giá trị mới, ô lý do bắt buộc; nút đổi thành
          "Đang lưu" và khoá sau khi bấm. Lỗi giữ trên màn cho tới thao tác thành công kế tiếp. API trả 403 vì vai trò đã đổi thì buộc tải lại trang.
          API lịch sử trả thêm tên người thực hiện (cột chụp sẵn), email tài khoản bị tác động, giá trị trước và sau đã rút gọn. Màn hiện cột "Thao tác"
          bằng chữ (Đổi vai trò / Khoá / Mở lại), "Tài khoản", "Cũ → Mới", "Lý do", và link "Xem đầy đủ" sang màn nhật ký đã lọc theo thực thể tài khoản.
          Bảng tài khoản rỗng và bảng lịch sử rỗng đều hiện dòng hướng dẫn.
        tieu_chi_xong:
          - Bấm "Khoá" thì hộp thoại hiện đúng email tài khoản sắp khoá; bỏ trống lý do thì lỗi hiện tại ô, không gọi API
          - Bấm "Xác nhận" hai lần nhanh chỉ tạo một dòng nhật ký
          - Thao tác bị từ chối 409 (quản trị viên cuối cùng) thì câu lỗi còn nguyên sau khi bảng tải lại; thao tác thành công kế tiếp mới xoá
          - "Tài khoản đang mở màn đối soát bị hạ xuống vai xem: bấm mục menu cũ thì trang tự tải lại và menu chỉ còn mục của vai xem"
          - Sau một lần đổi vai đối soát thành vai xem, bảng lịch sử có dòng "Đổi vai trò · email tài khoản · Đối soát → Xem · lý do", không có chuỗi profile.role_change hay UUID
          - Người thực hiện đã bị khoá tài khoản thì dòng lịch sử vẫn hiện tên đã chụp
          - Link "Xem đầy đủ" mở màn nhật ký với bộ lọc thực thể "tài khoản" đã chọn sẵn
          - Dòng tài khoản của chính mình không có nút khoá và ô chọn vai trò bị khoá
        file_cham:
          - src/app/(app)/admin/users/page.tsx
          - src/app/api/admin/users/route.ts
          - src/components/confirm-dialog.tsx (dùng chung, INC-10 tạo)

      - key: T03-03-vai-tro-mac-dinh-bo-suy-tu-email
        title: "Tài khoản mới luôn nhận vai xem, bỏ cách suy vai trò từ địa chỉ email"
        labels: [nguon:chenh-lech, doi:be]
        boi_canh: |
          D-09: trigger (bộ chặn tự động trong database) tạo hồ sơ khi có tài khoản mới đang suy vai trò từ địa chỉ email (địa chỉ bắt đầu bằng "admin@"
          thành quản trị hệ thống). Chỉ hợp để demo; ở môi trường thật, ai đăng ký được địa chỉ như vậy là thành quản trị mà không có vết.
          Thiết kế đích: mọi tài khoản mới nhận vai xem, việc cấp vai trò đi qua màn quản trị để có nhật ký và lý do.
        viec: |
          Sửa trigger tạo hồ sơ: đặt vai trò mặc định là vai xem cho mọi tài khoản mới, bỏ hàm suy từ email. Dữ liệu mẫu demo tạo sẵn các tài khoản
          với vai trò cấp tường minh bằng lệnh seed (ghi rõ trong README của seed), không dựa vào trigger. Giữ quy tắc đọc lại vai trò mỗi yêu cầu
          để vai mới có hiệu lực ngay.
        tieu_chi_xong:
          - Tạo tài khoản mới có email bắt đầu bằng "admin@" trên môi trường thử thì hồ sơ sinh ra có vai xem, không phải quản trị hệ thống
          - Hàm suy vai trò từ email không còn trong schema (kiểm bằng lệnh grep)
          - Đặt lại dữ liệu mẫu rồi đăng nhập bằng tài khoản demo quản trị vẫn vào được màn quản trị tài khoản
          - Cấp vai trò cho tài khoản mới từ màn quản trị thì nhật ký có dòng với giá trị trước "Xem" và giá trị sau
        file_cham:
          - supabase/schema.sql (trigger on_auth_user_created, bỏ role_from_email)
          - supabase/seed.sql

  - key: E-T04
    title: "Tư cách tham gia thị trường: bốn trạng thái, ba đường gỡ tạm ngưng theo loại, danh sách lọc được và an toàn"
    labels: []
    body: |
      Epic gom việc của gói T-04 (hai màn SCR-04 quản lý hồ sơ người tham gia và SCR-05 danh sách hồ sơ sắp hết hạn, cùng một đường dẫn).
      Prototype có một cờ "tạm dừng" và một nút "Mở lại" chung cho cả 4 loại người tham gia; thiết kế LAB-4 và đề (RFP mục 02-08, sơ đồ ba đường gỡ
      và sơ đồ bốn trạng thái tư cách) đòi bốn trạng thái và ba thủ tục gỡ tạm ngưng khác nhau theo loại, cộng ba đường thao tác: tạm ngưng, gỡ, quyết định xét lại.
      Tiền đề: PREMISE.md D-45 (review LAB-4) chốt bảng lịch sử tư cách phải đủ cột: 10 cột của sơ đồ đích cộng 3 cột màn SCR-04 đang dùng
      (condition_due, review_dossier, approved_by). D-21 và D-22 giữ LAB-4 nhưng là mục LAB-4 đánh dấu SỬA nên nhãn chênh lệch. D-23 (hạn mức tham gia)
      làm ở epic T-06 và câu hỏi khách X04-01, không ở đây. Thông báo "hồ sơ vào cửa sổ cảnh báo" (D-31) do epic T-15 sinh (T15-03 / T15-04), epic này không làm.
      Đường nộp lại hồ sơ sau khi hết hiệu lực (申請) chưa đủ bằng chứng trong RFP, không có issue; ghi nhận để hỏi khách khi X-04 mở thêm câu.
      Ngưỡng "sắp hết hạn" đọc từ bảng cấu hình do T02-01 tạo. Job (tác vụ chạy theo lịch) hết hạn gắn vào job mở ngày của lịch chợ (T09-02), epic này chỉ viết hàm.
      Bốn loại người tham gia trong bảng dữ liệu: wholesaler (卸売業者, nhà bán buôn), intermediary (仲卸, nhà buôn trung gian),
      trading_party (売買参加者, người tham gia mua bán), buyer (買出人, người mua lẻ).
      Giả định (chưa hỏi khách): người chuẩn y hồ sơ là vai tiếp nhận và phải khác người nhập, vì RFP không gắn vai cho "người có quyền chấp thuận"; hồ sơ đã quá hạn phải gia hạn trước rồi mới chuẩn y (T04-04).
      Thứ tự làm: T04-01 → T04-02 → T04-03 → T04-04 → T04-05 → T04-06; nhánh danh sách T04-07 → T04-08 sau T04-05.
    issues:
      - key: T04-01-cot-trang-thai-tu-cach-va-bang-lich-su
        title: "Cột trạng thái tư cách bốn giá trị và bảng lịch sử tư cách đủ 13 cột, có bộ chặn chuyển trạng thái sai"
        labels: [nguon:chenh-lech, doi:be]
        boi_canh: |
          D-22: prototype chỉ có cờ tạm dừng và hai cột ngày; trạng thái 失効 (hết hiệu lực) suy từ ngày, trạng thái 再審査 (xét lại) không tồn tại.
          D-45 (review LAB-4): bảng thiết kế dữ liệu sinh từ schema prototype nên lệch sơ đồ đích. Bốn trạng thái: 有効 (còn hiệu lực), 一時停止 (tạm ngưng),
          失効 (hết hiệu lực), 再審査 (xét lại). Bảng chuyển tiếp hợp lệ (từ → đến: tên chuyển tiếp):
          · 有効 → 一時停止: 違反 (vi phạm) · 一時停止 → 有効: 解除 (gỡ) · 有効 → 失効: 期限切れ (hết hạn) · 一時停止 → 失効: 期限切れ
          · 一時停止 → 再審査: 申請 (mở vòng xét lại) · 再審査 → 有効: 承認 (chấp thuận) · 再審査 → 失効: từ chối · 失効 → 再審査: 申請 (nộp lại, chưa có đường nhập)
          Mọi cặp khác bị cấm, ví dụ 再審査 → 一時停止, 失効 → 有効, 有効 → 再審査.
          Bảng lịch sử 13 cột: id, participant_id, from_status, to_status, transition, release_procedure, condition_note, decided_by, decided_at, reason
          (10 cột sơ đồ đích) cộng condition_due, review_dossier, approved_by. Không dùng ràng buộc "approved_by khác decided_by" trên cùng một dòng
          vì dòng chuẩn y có hai cột bằng nhau; việc so người chuẩn y với người mở vòng làm bằng trigger ở T04-04.
          Đồng bộ cột cũ is_suspended (hàm tạo giao dịch cũ đọc cột này): true khi 一時停止, 再審査, 失効; false khi 有効.
        viec: |
          Migration: thêm cột qualification_status với 4 giá trị; tạo bảng participant_status_history đủ 13 cột, khoá ngoại tới hồ sơ và tài khoản,
          index theo hồ sơ và thời điểm. Trigger (bộ chặn tự động trong database) trg_participant_status chỉ cho các chuyển tiếp trong bảng trên,
          sai thì lỗi mã INVALID_TRANSITION; mỗi lần đổi trạng thái phải có dòng lịch sử cùng giao dịch; sau mỗi lần đổi, đặt is_suspended theo bảng đồng bộ.
          Chuyển dữ liệu cũ: đang tạm dừng → 一時停止; hết hạn → 失効; còn lại → 有効. Bảng thiết kế dữ liệu đích do X01-02 sinh lại; issue này
          chỉ bảo đảm schema khớp 13 cột. Migration có bước quay lại.
        tieu_chi_xong:
          - Truy vấn information_schema.columns cho bảng participant_status_history trả đúng 13 tên cột liệt kê trong issue, không thừa không thiếu
          - Sau migration trên dữ liệu mẫu, mọi hồ sơ có đúng một trong 4 trạng thái và không có hồ sơ nào ở 再審査
          - Cập nhật thẳng 有効 → 再審査 và 再審査 → 一時停止 đều bị trigger từ chối với mã INVALID_TRANSITION
          - Đổi trạng thái sang 一時停止 mà không kèm dòng lịch sử bị từ chối
          - Đặt một hồ sơ sang 失効 thì is_suspended thành true và hàm tạo giao dịch chặn với mã PERMIT_INVALID; đặt về 有効 thì is_suspended thành false
          - Chạy bước quay lại migration thì bảng lịch sử và cột mới biến mất, dữ liệu hồ sơ không đổi
        file_cham:
          - supabase/schema.sql (cột qualification_status, bảng participant_status_history, trigger trg_participant_status)

      - key: T04-02-ham-tam-ngung-va-quet-het-han
        title: "Hàm tạm ngưng hồ sơ có lý do và hàm quét hết hạn, điều kiện quá hạn gọi từ job mở ngày"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T04-01-cot-trang-thai-tu-cach-va-bang-lich-su, T09-02-tu-mo-ngay-theo-lich-va-chan-ngoai-gio]
        boi_canh: |
          Prototype tạm dừng bằng một cập nhật cờ rời, không kiểm trạng thái hiện tại, cập nhật và nhật ký là hai lệnh rời (B-20), lỗi database lộ nguyên văn (S-02).
          Thiết kế đích: tạm ngưng là chuyển tiếp 違反 (vi phạm) từ 有効 (còn hiệu lực) sang 一時停止 (tạm ngưng), lý do bắt buộc, ghi lịch sử và nhật ký
          trong một giao dịch database. Hồ sơ là bên mua của giao dịch chưa giao xong vẫn tạm ngưng được (chỉ chặn giao dịch mới), nhưng hàm phải trả số giao dịch
          đang mở để màn báo hệ quả. Hai việc theo thời gian cũng ở đây: hồ sơ quá ngày hết hạn chuyển sang 失効 (hết hiệu lực) với chuyển tiếp 期限切れ;
          nhà buôn trung gian được gỡ có điều kiện mà hạn điều kiện qua chưa thoả thì quay về 一時停止 với 違反. Hai việc này gom vào một hàm, do job
          (tác vụ chạy theo lịch) mở ngày nghiệp vụ của T09-02 gọi lúc 02:00 giờ Nhật; epic này không tự dựng job.
        viec: |
          Hàm database suspend_participant(id, lý do) trong một giao dịch: khoá dòng, kiểm trạng thái 有効, ghi lịch sử 違反, ghi nhật ký participant.suspend,
          trả số giao dịch đang mở của hồ sơ; API POST /api/participants/[id]/suspend gọi hàm này, bỏ nhánh tạm dừng khỏi PATCH; lỗi database trả câu cố định.
          Hàm database sweep_qualifications(ngày nghiệp vụ): chuyển hồ sơ 有効 hoặc 一時停止 có valid_to nhỏ hơn ngày nghiệp vụ sang 失効 kèm lịch sử 期限切れ;
          chuyển hồ sơ có condition_due nhỏ hơn ngày nghiệp vụ và chưa đánh dấu thoả về 一時停止 kèm lịch sử 違反, lý do "Điều kiện gỡ quá hạn chưa thoả".
          Hàm chạy lặp lại không tạo dòng trùng. Thông báo cho vai tiếp nhận khi điều kiện quá hạn do epic T-15 (T15-03 / T15-04) sinh từ dòng lịch sử, không làm ở đây.
        tieu_chi_xong:
          - "Tạm ngưng hồ sơ 有効 kèm lý do: trạng thái thành 一時停止, có dòng lịch sử 違反 và dòng nhật ký; phản hồi có số giao dịch đang mở đúng với dữ liệu mẫu (ví dụ 2)"
          - Thiếu lý do bị từ chối 422 mã REASON_REQUIRED; tạm ngưng hồ sơ đang 一時停止 bị từ chối 409 INVALID_TRANSITION
          - "Hai người cùng tạm ngưng một hồ sơ: một thành công, một nhận 409"
          - "Hồ sơ valid_to là hôm qua theo giờ Nhật: gọi hàm quét với ngày nghiệp vụ hôm nay thì sang 失効, có lịch sử 期限切れ, is_suspended true, tạo giao dịch bị chặn PERMIT_INVALID"
          - Máy chủ đặt múi giờ UTC, job gọi hàm lúc 02:31 giờ Nhật thì ngày dùng để so vẫn là ngày nghiệp vụ theo giờ Nhật
          - "Hồ sơ có hạn điều kiện là hôm qua, chưa thoả: sau quét về 一時停止 với lịch sử 違反; gọi quét lần hai không thêm dòng nào"
          - Lỗi database bất kỳ trả "Không xử lý được, thử lại sau", không có tên bảng hay ràng buộc
        file_cham:
          - supabase/schema.sql (hàm suspend_participant, hàm sweep_qualifications)
          - src/app/api/participants/[id]/suspend/route.ts (mới)
          - src/app/api/participants/[id]/route.ts (bỏ nhánh tạm dừng khỏi PATCH)

      - key: T04-03-ham-go-tam-ngung-ba-nhanh
        title: "Hàm gỡ tạm ngưng chọn thủ tục theo loại người tham gia"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T04-01-cot-trang-thai-tu-cach-va-bang-lich-su]
        boi_canh: |
          D-21 (ưu tiên 1): đề cấm gộp 許可 (giấy phép) và 承認 (giấy chấp thuận) vào một luật chung; sơ đồ ba đường gỡ 一時停止 (tạm ngưng) trong RFP:
          nhà bán buôn gỡ thẳng bằng 承認 (chấp thuận); nhà buôn trung gian gỡ 条件付き (có điều kiện) kèm nội dung điều kiện và hạn theo dõi;
          người tham gia mua bán chỉ được mở vòng 再審査 (xét lại), không gỡ thẳng; người mua lẻ không có đường gỡ. Prototype chấp nhận "mở lại" cho mọi loại,
          không hỏi lý do ở chiều gỡ, không kiểm trạng thái hiện tại, cập nhật và nhật ký là bốn lệnh rời. Thủ tục do cột type quyết, không do người dùng chọn.
        viec: |
          Hàm database release_suspension(id, lý do, điều kiện, hạn, hồ sơ xét duyệt) trong một giao dịch: khoá dòng, kiểm trạng thái 一時停止, chọn nhánh theo type;
          lý do bắt buộc (REASON_REQUIRED); nhánh bán buôn → 有効 với release_procedure 承認 và nhật ký participant.release.approval; nhánh trung gian bắt buộc
          điều kiện và hạn (CONDITION_REQUIRED) → 有効 kèm condition_note, condition_due và nhật ký participant.release.conditional; nhánh mua bán từ chối gỡ thẳng
          (REVIEW_REQUIRED) và chỉ chuyển sang 再審査 kèm review_dossier, nhật ký participant.review.open; nhánh mua lẻ từ chối. Nhật ký lỗi thì huỷ cả.
          API (đường gọi máy chủ) POST /api/participants/[id]/release gọi hàm này. Lỗi database trả câu cố định (S-02).
        tieu_chi_xong:
          - "Nhà bán buôn đang 一時停止 gỡ kèm lý do: về 有効, is_suspended false, có dòng lịch sử release_procedure = 承認 và nhật ký participant.release.approval"
          - Nhà buôn trung gian gỡ thiếu hạn theo dõi bị từ chối 422 CONDITION_REQUIRED; đủ điều kiện và hạn thì về 有効 với condition_due được ghi
          - Người tham gia mua bán gọi gỡ thẳng bị 422 REVIEW_REQUIRED; mở vòng xét lại kèm hồ sơ thì sang 再審査, is_suspended vẫn true, tạo giao dịch vẫn bị chặn
          - Người mua lẻ gọi hàm gỡ bị từ chối 422; hồ sơ đang 有効 gọi gỡ bị 409 INVALID_TRANSITION
          - Thiếu lý do ở chiều gỡ bị 422 REASON_REQUIRED kể cả gọi thẳng API
          - "Giả lập lỗi ghi nhật ký: trạng thái không đổi, không có dòng lịch sử"
          - Lỗi database bất kỳ trả "Không xử lý được, thử lại sau"
        file_cham:
          - supabase/schema.sql (hàm release_suspension)
          - src/app/api/participants/[id]/release/route.ts (mới)

      - key: T04-04-ham-chuan-y-tu-choi-xet-lai
        title: "Hàm chuẩn y hoặc từ chối vòng xét lại, người chuẩn y phải khác người mở vòng"
        labels: [nguon:moi, doi:be]
        lam_sau: [T04-03-ham-go-tam-ngung-ba-nhanh]
        boi_canh: |
          Prototype không có 再審査 (xét lại) nên đây là thiết kế mới. Đề (RFP mục 02-08, 責任分離 nghĩa là tách trách nhiệm) đòi người chuẩn y khác người mở vòng.
          Chuẩn y → 有効 (còn hiệu lực), từ chối → 失効 (hết hiệu lực) và is_suspended giữ true nên không tạo được giao dịch. Hai bước là hai lần vào màn,
          hai người, hai dòng lịch sử. Giả định (RFP không gắn vai cho "người có quyền chấp thuận"): người chuẩn y là vai tiếp nhận (intake), bắt buộc khác
          người mở vòng; dữ liệu mẫu có hai tài khoản tiếp nhận. Giả định thứ hai: hồ sơ đã quá ngày hết hạn thì không chuẩn y được, phải gia hạn trước.
          Cả hai ghi vào câu hỏi khách khi X-04 mở thêm.
        viec: |
          Hàm database decide_reexamination(id, reviewId, quyết định, ghi chú) trong một giao dịch: khoá dòng hồ sơ, kiểm trạng thái 再審査 và dòng lịch sử mở vòng
          (reviewId) còn mở; trigger (bộ chặn tự động) so người quyết với decided_by của dòng mở vòng, trùng thì 403; hồ sơ quá valid_to thì 409 "Hồ sơ đã quá hạn,
          gia hạn trước khi chuẩn y"; ghi dòng lịch sử thứ hai với approved_by, chuyển trạng thái, ghi nhật ký participant.review.approve hoặc .reject kèm ghi chú
          bắt buộc; lỗi nhật ký thì huỷ cả. API (đường gọi máy chủ) POST /api/participants/[id]/review/[reviewId]/decide chỉ cho vai tiếp nhận.
        tieu_chi_xong:
          - Người mở vòng gọi chuẩn y bị 403 "Không được tự chuẩn y vòng xét duyệt do chính mình mở"; chèn thẳng dòng lịch sử chuẩn y cùng người cũng bị trigger chặn
          - "Tài khoản tiếp nhận thứ hai chuẩn y: hồ sơ về 有効, is_suspended false, có dòng lịch sử thứ hai với approved_by và nhật ký participant.review.approve"
          - "Từ chối kèm ghi chú: hồ sơ sang 失効, is_suspended vẫn true, tạo giao dịch bị chặn PERMIT_INVALID; thiếu ghi chú bị 422"
          - Vai xem hoặc vai đối soát gọi quyết định bị 403
          - "Hai người cùng chuẩn y một vòng: một thành công, một nhận 409 vì vòng đã đóng"
          - "Hồ sơ có valid_to đã qua: chuẩn y bị 409 với câu nêu rõ cần gia hạn; trạng thái vẫn 再審査"
          - Gọi quyết định trên hồ sơ không ở 再審査 bị 409 INVALID_TRANSITION
        file_cham:
          - supabase/schema.sql (hàm decide_reexamination, trigger trg_review_two_persons)
          - src/app/api/participants/[id]/review/[reviewId]/decide/route.ts (mới)

      - key: T04-05-api-danh-sach-tim-kiem-an-toan-va-du-lieu-dong
        title: "API danh sách người tham gia tìm kiếm bằng hàm có tham số, lọc theo trạng thái tư cách, trả đủ dữ liệu từng dòng"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T02-01-bang-cau-hinh-nguong-het-han, T04-01-cot-trang-thai-tu-cach-va-bang-lich-su, T04-04-ham-chuan-y-tu-choi-xet-lai]
        boi_canh: |
          S-01 (mức nghiêm trọng): ô tìm kiếm nhét thẳng chuỗi người dùng gõ vào bộ lọc của PostgREST; dấu phẩy tạo điều kiện lọc mới, dấu ngoặc làm hỏng cú pháp
          và lộ nguyên văn lỗi (S-02). Chốt LAB-4: bỏ hẳn chuỗi lọc, thay bằng hàm database nhận tham số. D-22: ba bộ lọc hiện có trộn hết hạn theo thời gian với
          tạm ngưng do người quyết; không có cách lọc ra "hồ sơ đang bị tạm ngưng". Chốt: giữ trục ?filter= (all / expiring / expired) để không phá link từ bảng
          điều khiển, thêm trục ?status= theo 4 trạng thái (有効 còn hiệu lực, 一時停止 tạm ngưng, 失効 hết hiệu lực, 再審査 xét lại), hai trục giao nhau.
          Màn hồ sơ (T04-06) cần mỗi dòng có trạng thái, hạn điều kiện, vòng xét lại đang mở (mã và người mở) để vẽ nút; API (đường gọi máy chủ) này trả, màn chỉ hiển thị.
          Ngưỡng sắp hết hạn đọc từ hàm do T02-01 tạo.
        viec: |
          Hàm database search_participants(filter, status, q, today, until) trả danh sách kèm qualification_status, condition_due, mã dòng lịch sử mở vòng đang mở và
          decided_by của dòng đó; API gọi hàm với q là tham số, không ghép chuỗi. Tham số status ngoài 4 giá trị thì 422. Phản hồi trả today, expiringUntil,
          expiringDays từ hàm cấu hình để màn không tự tính ngày. Bỏ hằng số 30 trong file. Lỗi database trả câu cố định, chi tiết ghi log máy chủ.
        tieu_chi_xong:
          - Gõ "a,is_suspended.eq.true" vào ô tìm thì kết quả chỉ là hồ sơ có mã, tên hoặc số giấy phép chứa chuỗi đó (0 dòng trên dữ liệu mẫu), không có điều kiện lọc thêm
          - Gõ "a)" không trả 500; phản hồi là danh sách rỗng hoặc bình thường, không có chữ "syntax" hay tên bảng
          - ?status=一時停止 trả đúng các hồ sơ đang tạm ngưng kể cả hồ sơ còn hạn xa; ?filter=expiring&status=有効 trả hồ sơ vừa còn hiệu lực vừa sắp hết hạn
          - ?status=abc bị 422; không truyền status thì không lọc theo trạng thái
          - Dòng hồ sơ đang 再審査 có mã vòng và người mở vòng; dòng nhà buôn trung gian gỡ có điều kiện có condition_due
          - Hồ sơ valid_to đúng hôm nay theo giờ Nhật nằm trong expiring, không trong expired; máy chủ đặt múi giờ UTC lúc 02:31 giờ Nhật vẫn đúng
          - Đổi cấu hình ngưỡng thành 45 thì expiringDays trả 45 và tập expiring đổi theo
          - Không còn lời gọi .or() ghép chuỗi và hằng số 30 trong file API (kiểm bằng lệnh grep)
        file_cham:
          - supabase/schema.sql (hàm search_participants)
          - src/app/api/participants/route.ts

      - key: T04-06-man-ho-so-nut-go-theo-loai-va-xet-lai
        title: "Màn hồ sơ người tham gia có nút gỡ tạm ngưng theo loại, hai bước xét lại và cột điều kiện theo dõi"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T04-02-ham-tam-ngung-va-quet-het-han, T04-03-ham-go-tam-ngung-ba-nhanh, T04-04-ham-chuan-y-tu-choi-xet-lai, T04-05-api-danh-sach-tim-kiem-an-toan-va-du-lieu-dong, INC-10-hop-thoai-xac-nhan-that, INC-11-man-ket-qua-thuong-gia-co]
        boi_canh: |
          Ba quy tắc giao diện bắt buộc của thiết kế LAB-4: nhãn nút đổi theo loại người tham gia; điều kiện của nhà buôn trung gian phải theo dõi được trên màn;
          vòng 再審査 (xét lại) không gộp hai bước vào một lần bấm. Prototype có một nút "Mở lại" chung và dùng hộp thoại mặc định của trình duyệt (D-12).
          Đây là màn khách Nhật tự thử nên nhãn trạng thái (有効 còn hiệu lực, 一時停止 tạm ngưng, 失効 hết hiệu lực, 再審査 xét lại) và thủ tục
          (承認 chấp thuận, 条件付き có điều kiện) theo bảng nhãn chung do INC-11 tạo. Hộp thoại dùng chung do INC-10 tạo và phải nhận nội dung tuỳ biến
          (ô điều kiện, ô hạn, ô hồ sơ xét duyệt); chưa đủ thì bổ sung tiêu chí vào INC-10. Mọi dữ liệu để vẽ nút (trạng thái, mã vòng, người mở, hạn điều kiện)
          lấy từ API T04-05; số giao dịch đang mở lấy từ phản hồi hàm tạm ngưng T04-02. Hạn mức tham gia (D-23) chỉ hiện dấu gạch ngang kèm chú thích "chờ khách xác nhận".
        viec: |
          Nút "Tạm ngưng" mở hộp thoại có lý do; sau khi gọi API, hiện "N giao dịch đang mở" từ phản hồi. Dòng hồ sơ đang 一時停止: nhà bán buôn thấy
          "Gỡ tạm ngưng (承認)"; nhà buôn trung gian thấy "Gỡ có điều kiện (条件付き)" với lý do, nội dung điều kiện, hạn theo dõi; người tham gia mua bán thấy
          "Mở vòng 再審査" với lý do và hồ sơ xét duyệt; người mua lẻ thấy chữ "Không có quy trình gỡ tạm ngưng". Dòng đang 再審査: nút "Chuẩn y" và "Từ chối" kèm
          ghi chú; nếu người đang xem là người mở vòng (so với trường API trả) thì thay nút bằng chữ "Bạn là người mở vòng này", không ẩn. Cột điều kiện đang theo dõi
          với nhãn đỏ "Điều kiện quá hạn" và cảnh báo vàng đầu bảng khi condition_due đã qua. Nút khoá và đổi thành "Đang lưu" sau khi bấm.
        tieu_chi_xong:
          - "Dữ liệu mẫu có 4 hồ sơ 一時停止, mỗi loại một hồ sơ: màn hiện đúng 3 nhãn nút khác nhau và một dòng chữ cho người mua lẻ"
          - "Tạm ngưng hồ sơ có 2 giao dịch chưa giao xong: sau khi xác nhận, màn hiện \"2 giao dịch đang mở\""
          - Gỡ có điều kiện bỏ trống hạn theo dõi thì lỗi hiện ngay tại ô, không gọi API
          - "Mở vòng xét lại bằng tài khoản tiếp nhận A rồi A xem lại: nút \"Chuẩn y\" thay bằng chữ; đăng nhập tài khoản tiếp nhận B thì thấy nút"
          - "Hồ sơ có condition_due là hôm qua: dòng có nhãn đỏ \"Điều kiện quá hạn\" và đầu bảng có cảnh báo vàng"
          - Bấm "Gỡ tạm ngưng (承認)" hai lần nhanh chỉ tạo một dòng lịch sử
          - Mọi nhãn trạng thái và thủ tục trên màn có trong bảng nhãn chung docs/nhan-tieng-nhat.md; không còn chuỗi "Tạm dừng/Mở lại"
        file_cham:
          - src/app/(app)/participants/page.tsx
          - src/app/(app)/participants/participant-types.ts (nhãn trạng thái theo qualification_status)
          - src/components/confirm-dialog.tsx (dùng chung, INC-10 tạo)

      - key: T04-07-man-danh-sach-bo-loc-len-url
        title: "Màn danh sách hồ sơ có bộ lọc hai trục lên URL, gõ tìm có trễ và thông điệp rỗng nói rõ"
        labels: [nguon:gia-co, doi:fe]
        lam_sau: [T04-05-api-danh-sach-tim-kiem-an-toan-va-du-lieu-dong]
        boi_canh: |
          Nhận xét LAB-3 của giảng viên: bộ lọc phải lên URL để bấm Back trên trình duyệt còn giữ; thông điệp rỗng phải nói vì sao rỗng và làm gì tiếp.
          Ô tìm kiếm bắn một yêu cầu mỗi ký tự, phản hồi về sai thứ tự thì bảng hiện kết quả cũ. Nhãn nút "sắp hết hạn" phải hiện số ngày thật từ phản hồi API
          (đường gọi máy chủ). Nhãn trạng thái phải tính bằng ngày "today" API trả, không bằng giờ máy, nếu không nhãn và bộ lọc chửi nhau khi máy đặt múi giờ khác.
        viec: |
          Đọc và ghi ?filter=, ?status=, ?q= vào URL; ô tìm có trễ 300 mili giây và huỷ yêu cầu cũ. Thêm cụm lọc trạng thái tư cách 4 giá trị (有効 còn hiệu lực,
          一時停止 tạm ngưng, 失効 hết hiệu lực, 再審査 xét lại) cạnh cụm lọc hiệu lực. Nhãn nút "Sắp hết hạn (N ngày)" lấy N từ phản hồi. Thông điệp rỗng ghi
          "Không có hồ sơ nào khớp, thử bỏ bộ lọc {nhãn} hoặc xoá ô tìm kiếm". Nhãn trạng thái dùng today từ phản hồi. Bảng đổi sang dạng thẻ trên điện thoại.
        tieu_chi_xong:
          - "Chọn lọc \"sắp hết hạn\" và trạng thái 有効, bấm vào một hồ sơ rồi bấm Back: bộ lọc và ô tìm còn nguyên, URL có đủ ba tham số"
          - "Gõ nhanh 5 ký tự: tab Network có nhiều nhất 2 yêu cầu còn sống, kết quả cuối là của chuỗi cuối"
          - Bộ lọc không khớp gì thì màn hiện câu có tên bộ lọc đang chọn
          - Đổi cấu hình ngưỡng thành 45 thì nhãn nút hiện "Sắp hết hạn (45 ngày)" mà không sửa mã
          - "Trình duyệt đặt múi giờ UTC lúc 02:31 giờ Nhật: hồ sơ hết hạn hôm nay hiện nhãn \"Sắp hết hạn\" và nằm trong bộ lọc \"sắp hết hạn\", hai bên khớp nhau"
          - "Màn rộng 390 px: không cuộn ngang, hai cụm lọc vẫn bấm được"
        file_cham:
          - src/app/(app)/participants/page.tsx
          - src/app/(app)/participants/participant-types.ts

      - key: T04-08-form-sua-ho-so-kiem-phien-ban
        title: "Form sửa hồ sơ kiểm phiên bản trước khi ghi, bắt lý do khi nới hạn hiệu lực, báo mã trùng rõ"
        labels: [nguon:gia-co, doi:fe]
        lam_sau: [T04-01-cot-trang-thai-tu-cach-va-bang-lich-su]
        boi_canh: |
          Form sửa hồ sơ luôn gửi đủ 8 trường nên hai người cùng sửa thì người sau ghi đè im lặng; chốt LAB-4: kiểm phiên bản bằng cột updated_at, lệch thì 409.
          Bỏ trống ngày hết hạn đang có giá trị là nới hiệu lực vô thời hạn, thao tác nhạy cảm mà không đòi lý do. Thông điệp mã trùng đang lộ tên ràng buộc (S-02).
          API (đường gọi máy chủ) PATCH chỉ còn sửa thông tin hồ sơ sau khi T04-02 và T04-03 tách nhánh tạm ngưng và gỡ.
        viec: |
          Form gửi kèm updated_at đã đọc; API so khớp, lệch thì 409 "Hồ sơ vừa được người khác sửa, tải lại rồi sửa tiếp". Bỏ trống ngày hết hạn đang có giá trị thì
          bắt lý do và ghi nhật ký với giá trị trước và sau. Mã trùng trả "Mã {code} đã tồn tại" neo vào ô mã (bắt lỗi 23505 trên cột code). Nút khoá và
          đổi thành "Đang lưu" sau khi bấm; ô mã và ô loại khoá khi sửa vì hai giá trị này bất biến.
        tieu_chi_xong:
          - Hai tab cùng mở form một hồ sơ, tab 1 lưu, tab 2 lưu sau thì nhận câu báo đã có người sửa và không ghi đè
          - "Xoá ngày hết hạn đang có giá trị rồi lưu: bắt buộc nhập lý do; nhật ký có dòng với giá trị trước là ngày cũ và sau là trống"
          - "Tạo hồ sơ trùng mã: lỗi hiện tại ô mã với câu \"Mã {code} đã tồn tại\", không có tên ràng buộc"
          - Ngày hết hạn đúng bằng ngày bắt đầu được chấp nhận; nhỏ hơn thì lỗi hiện tại ô
          - Bấm "Lưu" hai lần nhanh chỉ gọi API một lần
        file_cham:
          - src/app/(app)/participants/participant-form.tsx
          - src/app/api/participants/[id]/route.ts (so khớp updated_at, lý do khi nới valid_to, bắt lỗi 23505)

  - key: E-T05
    title: "Lô hàng: nhận lô, thẩm định (目利き) và công khai (公開) có chốt chặn thật"
    labels: []
    body: |
      Epic gom việc để chuỗi lô hàng chạy đúng sơ đồ trạng thái của khách: nhận lô → thẩm định → công khai → bán.
      Prototype đang cho bán ngay sau thẩm định, thiếu bước công khai, và bảng đánh giá lô không có bộ chặn ngày khoá
      nên người dùng có thể sửa căn cứ giá của một ngày đã chốt sổ.
      Tiền đề: PREMISE.md Bảng 1 (D-45), Bảng 3 (Q5 · D-29: công khai là bước riêng, bấm sau thẩm định).
      Chú giải: 目利き là bước thẩm định chất lượng lô do người có chuyên môn chấm hạng; 公開 là bước công khai lô để bên mua
      nhìn thấy; 業務日 là ngày nghiệp vụ của chợ tính theo giờ Nhật; B-17 là lỗi bảng đánh giá lô thiếu bộ chặn ngày khoá.
      Gói LAB-4 tương ứng: T-05 (màn SCR-06 nhận lô, SCR-07 thẩm định).
      Hai giả định của backlog (thay cho chữ "vai bán buôn" trong PREMISE, vì prototype không có vai này): người bấm công khai lô
      là vai giao dịch (ROLE-TRADE), không cần khác người thẩm định vì thẩm định là vai khác; không có đường thu hồi công khai,
      vì mục đích giữ lại lô xấu xảy ra trước khi công khai. Dữ liệu mẫu giữ vài lô ở trạng thái đã thẩm định để demo bước công khai.
      Mã lỗi mới của epic (đăng ký vào bảng mã lỗi chung X01-01): LOT_NOT_PUBLISHED (lô chưa công khai).
      Để ngoài epic, có chủ ở nơi khác: khoá ngày từ chối khi lô thiếu chứng từ (epic T-09); tra nhật ký theo mã lô (epic T-13);
      quyền vào màn (epic X-02). Mã lô dùng bộ đếm chung tạo ở T06-01.
      Thứ tự làm: T06-01 → T05-01 → T05-02; T05-03 → T05-04 song song; T05-05 sau T06-01.
    issues:
      - key: T05-01-trang-thai-cong-khai-lo
        title: "Lô hàng có trạng thái đã công khai và chỉ lô đã công khai mới bán được"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T06-01-ma-giao-dich-bang-bo-dem]
        boi_canh: |
          Sơ đồ trạng thái lô của khách có bước công khai (公開, bên mua nhìn thấy lô), prototype không có: lô vừa thẩm định xong
          là bán được ngay (D-29). PREMISE Bảng 3 chốt công khai là một bước riêng bấm sau khi thẩm định. D-45 (review LAB-4)
          yêu cầu lấy sơ đồ đích làm gốc: lô có trạng thái công khai và ràng buộc số lượng lớn hơn 0 ở database.
          Trạng thái lô trong prototype là cột chữ có ràng buộc kiểm (check), bốn giá trị: received (đã nhận), judged (đã thẩm định),
          sold_out (đã bán hết), closed (đã đóng). Hàm tạo giao dịch trong database hiện không kiểm trạng thái lô.
          Nút trên màn ở T05-02. Thứ tự sửa hàm tạo giao dịch: sau T06-01 (bộ đếm mã), trước T06-02a.
        viec: |
          Migration thêm giá trị published (đã công khai) vào ràng buộc trạng thái lô, luồng chuyển: received → judged → published → sold_out.
          Giữ ràng buộc số lượng ban đầu lớn hơn 0 và số lượng còn lại không âm theo sơ đồ đích. Tạo hàm database publish_lot: chỉ chuyển
          từ judged sang published, kiểm ngày nghiệp vụ chưa khoá, ghi nhật ký trong cùng giao dịch database. API POST công khai lô chỉ cho
          vai giao dịch gọi. Sửa hàm tạo giao dịch: lô chưa published thì từ chối với mã LOT_NOT_PUBLISHED (409). Dữ liệu mẫu: lô đang có
          giao dịch chuyển sang published, giữ ít nhất 2 lô ở judged để demo bước công khai. Migration có bước quay lại.
        tieu_chi_xong:
          - Lô đã thẩm định (judged) gọi tạo giao dịch bị từ chối với LOT_NOT_PUBLISHED; sau khi gọi công khai thì tạo được
          - Gọi công khai lô còn received bị từ chối, lỗi nêu rõ phải thẩm định trước
          - Gọi công khai lô thuộc ngày nghiệp vụ đã khoá bị BUSINESS_DAY_LOCKED, không có dòng nhật ký nào được ghi
          - Vai thẩm định hoặc vai đối soát gọi API công khai nhận lỗi quyền; vai giao dịch gọi được
          - Chèn thẳng vào database một lô có số lượng ban đầu bằng 0 bị ràng buộc từ chối
          - Đặt lại dữ liệu mẫu rồi tạo 1 giao dịch bán thoả thuận trên lô mẫu đã công khai vẫn chạy; màn danh sách có ít nhất 2 lô chờ công khai
          - Chạy bước quay lại migration thì giá trị published biến mất, lô mẫu về judged, giao dịch mẫu không đổi
        file_cham:
          - supabase/schema.sql (bảng lots, hàm publish_lot mới, hàm tạo giao dịch phần kiểm trạng thái lô)
          - supabase/seed.sql (lô mẫu)
          - src/app/api/lots/[id]/publish/route.ts (mới)

      - key: T05-02-nut-cong-khai-tren-man-lo
        title: "Nút công khai lô trên màn danh sách lô"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T05-01-trang-thai-cong-khai-lo]
        boi_canh: |
          Theo T05-01, công khai (公開, bên mua nhìn thấy lô) là bước riêng bấm sau thẩm định (D-29). Màn danh sách lô (SCR-06/07,
          đường dẫn /lots) hiện chỉ có nút nhận lô và nút ghi thẩm định. Người bấm là vai giao dịch (giả định ghi ở thân epic).
          Màn này là màn hiện trường (tay ướt, ngoài trời), thao tác phải ít bước.
        viec: |
          Trên dòng lô ở trạng thái judged (đã thẩm định), thêm nút "Công khai" chỉ hiện với vai giao dịch; bấm mở hộp xác nhận của ứng dụng
          hiện mã lô, loài, hạng thẩm định mới nhất và số lượng còn lại; xác nhận thì gọi API T05-01. Huy hiệu trạng thái lô hiện bằng chữ
          cho bốn trạng thái received, judged, published, sold_out. Thêm bộ lọc "Chờ công khai". Dòng thuộc ngày đã khoá không hiện nút.
          Sau khi công khai, dòng đổi huy hiệu ngay, không cần tải lại trang.
        tieu_chi_xong:
          - Vai giao dịch thấy nút trên lô judged; không thấy trên lô received hoặc sold_out; vai thẩm định không thấy nút
          - Lọc "Chờ công khai" chỉ ra lô có hạng thẩm định mà chưa công khai; đếm tay trên dữ liệu mẫu khớp số dòng
          - Lô thuộc ngày đã khoá không có nút công khai
          - Bấm xác nhận hai lần liên tiếp chỉ gọi API một lần; nút đổi thành "Đang công khai" và khoá
          - Huy hiệu hiện chữ theo bảng nhãn chung, không hiện mã thô như published hay sold_out
          - Trên màn rộng 390 px nút công khai bấm được, không cuộn ngang
        file_cham:
          - src/app/(app)/lots/page.tsx
          - src/app/(app)/lots/lot-types.ts
          - src/lib/client-api.ts

      - key: T05-03-ghi-tham-dinh-mot-ham-db
        title: "Ghi kết quả thẩm định bằng một hàm database có chặn ngày khoá"
        labels: [nguon:chenh-lech, doi:be]
        boi_canh: |
          B-17: bảng đánh giá lô không có bộ chặn ngày khoá, trong khi bảng lô có. Hiện trạng chạy hai lệnh rời: chèn bản đánh giá thành công,
          rồi đổi trạng thái lô bị bộ chặn từ chối; bản ghi đã lưu mà trạng thái lô không đổi, người dùng chỉ thấy lỗi 409. Nặng hơn: lô đã
          thẩm định (judged) ở ngày đã khoá vẫn ghi thêm được đánh giá, tức sửa được căn cứ giá của ngày đã chốt sổ. Thiết kế LAB-4 còn yêu cầu:
          chặn lô đã bán hết, lô không tồn tại trả 404 thay vì 500, có khoá chống gửi trùng khi mất mạng, nhận thời điểm bấm từ thiết bị
          (judged_at_client) cho ca làm việc ngoài trời mất sóng (D-15), nhật ký cùng giao dịch database.
        viec: |
          Tạo hàm database record_judgement chạy trong một giao dịch: kiểm lô tồn tại, ngày nghiệp vụ chưa khoá, lô chưa sold_out (đã bán hết),
          rồi mới chèn bản đánh giá và đổi trạng thái lô từ received (đã nhận) sang judged; lô đã judged chỉ thêm bản ghi; nhật ký cùng giao dịch,
          lỗi nhật ký thì huỷ cả. Gắn bộ chặn ngày khoá cho bảng đánh giá lô làm lớp cuối. API: lô không tồn tại trả 404; nhận tiêu đề
          Idempotency-Key (cùng khoá trong 24 giờ trả lại bản đã ghi); nhận judged_at_client và lưu cùng thời điểm máy chủ; độ tươi tối đa 200 ký tự.
          Bảng đánh giá vẫn chỉ thêm, không sửa, không xoá.
        tieu_chi_xong:
          - Lô còn received ở ngày đã khoá gọi ghi thẩm định nhận 409 BUSINESS_DAY_LOCKED và bảng đánh giá không có dòng mới
          - Lô đã judged ở ngày đã khoá gọi ghi thẩm định cũng bị từ chối (trước đây thành công)
          - Lô sold_out gọi ghi thẩm định nhận 409 M_LOT_SOLD_OUT; mã lô không tồn tại nhận 404, không phải 500
          - Gửi hai lần cùng Idempotency-Key trong 1 phút chỉ có một bản đánh giá
          - Ghi thành công có đúng một dòng nhật ký trong cùng giao dịch; giả lập lỗi ghi nhật ký thì bản đánh giá không được lưu
          - Độ tươi dài 201 ký tự bị 422; 200 ký tự được nhận
          - Gửi judged_at_client sớm hơn giờ máy chủ 10 phút thì bản ghi lưu cả hai thời điểm, hạng hiện hành vẫn chọn theo thời điểm máy chủ
          - Ghi thẩm định lần hai trên lô đã judged thì thêm bản ghi, trạng thái lô không đổi
        file_cham:
          - supabase/schema.sql (hàm record_judgement mới, trigger ngày khoá cho lot_judgements, cột judged_at_client, bảng idempotency_keys dùng chung với T06-07)
          - src/app/api/lots/[id]/judgement/route.ts

      - key: T05-04-man-tham-dinh-gia-co
        title: "Màn thẩm định có bộ lọc lô chờ, lịch sử đánh giá và hạng lấy từ bảng tra cứu"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T05-03-ghi-tham-dinh-mot-ham-db]
        boi_canh: |
          Màn SCR-07 (thẩm định 目利き, đường dẫn /lots) là màn hiện trường, người thẩm định chấm hàng chục lô liên tiếp lúc 03:00 giờ Nhật.
          Hiện trạng: không lọc được lô chưa thẩm định, không xem được lịch sử các lần đánh giá, danh sách hạng viết cứng trong mã nguồn,
          cảnh báo ngày khoá chưa dựng, hai bản đánh giá cùng thời điểm thì hạng hiển thị nhảy giữa hai lần tải, không có gợi ý nhanh cho ô độ tươi.
          Thiết kế LAB-4 liệt kê các việc này cho LAB-5. Nhận xét LAB-3 về nhãn Nhật và một kiểu ngày áp cho màn này.
        viec: |
          Tạo bảng tra cứu hạng (lot_grades: mã, nhãn Nhật, thứ tự) nạp sẵn năm hạng hiện có; API danh sách lô trả danh sách hạng từ bảng này
          và tên người chấm. Màn: bộ lọc "Chỉ lô chờ thẩm định"; panel lịch sử đánh giá theo lô (hạng, độ tươi, ghi chú, người chấm, thời điểm);
          ô chọn hạng đọc từ API; chip gợi ý độ tươi (ba câu thường dùng, bấm để điền); chọn hạng hiện hành theo thời điểm rồi theo id giảm dần;
          cảnh báo đỏ và khoá nút khi ngày đã khoá; sau khi lưu tự mở form lô chờ kế tiếp; form gửi judged_at_client (T05-03).
          Áp định nghĩa xong chung cho màn hình (script chép vào thân issue).
        tieu_chi_xong:
          - Bật lọc "Chỉ lô chờ thẩm định" thì mọi dòng hiện ra đều chưa có hạng; tắt lọc thì về danh sách đầy đủ
          - Lô có 3 lần đánh giá thì panel lịch sử hiện đủ 3 dòng theo thứ tự thời gian, có tên người chấm
          - Thêm một dòng vào bảng lot_grades rồi tải lại màn thì ô chọn hạng có hạng mới, không sửa mã nguồn
          - Bấm một chip gợi ý thì ô độ tươi được điền đúng câu đó, vẫn sửa tiếp được
          - Lọc sang ngày đã khoá thì nút lưu khoá và có cảnh báo đỏ nêu ngày nào đã khoá
          - Lưu xong lô A thì form tự chuyển sang lô chờ kế tiếp; hết lô chờ thì form đóng và có thông báo bằng chữ
          - Mọi ngày giờ trên màn cùng định dạng YYYY/MM/DD theo giờ Nhật
        file_cham:
          - supabase/schema.sql (bảng lot_grades mới)
          - src/app/(app)/lots/page.tsx
          - src/app/(app)/lots/lot-forms.tsx
          - src/app/(app)/lots/lot-types.ts
          - src/app/api/lots/route.ts (trả danh sách hạng và tên người chấm)

      - key: T05-05-man-nhan-lo-chung-tu-va-don-vi
        title: "Màn nhận lô có chứng từ nhận hàng và danh sách đơn vị đóng gói"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T06-01-ma-giao-dich-bang-bo-dem]
        boi_canh: |
          Màn SCR-06 (nhận lô, đường dẫn /lots) thiếu năm điểm so với thiết kế LAB-4: không có chứng từ nhận hàng (受入証憑, giấy tờ
          chứng minh đã nhận lô, D-17) dù RFP đòi; đơn vị đóng gói gõ tự do; số lượng 3 chữ số thập phân bị database tự làm tròn không báo;
          lỗi khoá ngoại trả 500; không có nút "Lưu và nhập tiếp" cho người nhập liên tục. Mã lô hiện sinh ở lớp ứng dụng bằng lấy số lớn
          nhất cộng một, chuyển sang bộ đếm chung của T06-01. Khoá ngày từ chối khi lô thiếu chứng từ thuộc epic T-09.
        viec: |
          Tạo bảng lot_attachments (lô, đường dẫn tệp, loại, kích thước, người tải, thời điểm) và bucket riêng không công khai; API tải chứng từ
          cho lô (pdf, jpg, png, heic; tối đa 10 MB; tối đa 3 tệp), đọc qua đường dẫn ký 15 phút. Đơn vị đóng gói thành danh sách đóng (kg, 箱, 尾, 枚)
          kiểm ở API và database. Số lượng quá 2 chữ số thập phân trả 422 ở API và chặn ở ô nhập. Lỗi khoá ngoại (nhà cung cấp không tồn tại)
          trả 422 có thông điệp. API tạo lô dùng hàm next_code của T06-01. Màn: ô tải chứng từ, ô chọn đơn vị, nút "Lưu và nhập tiếp" giữ ngày
          và nhà cung cấp vừa nhập.
        tieu_chi_xong:
          - Tải chứng từ 11 MB hoặc tệp .exe bị từ chối trước khi lưu; tệp thứ 4 bị từ chối; truy cập thẳng bucket bị từ chối
          - Gửi đơn vị "thùng" bị 422; chọn 箱 được nhận
          - Số lượng 10.555 bị chặn ngay tại ô và bị 422 nếu gọi thẳng API; 10.55 lưu đúng 10.55
          - Gửi mã nhà cung cấp không tồn tại nhận 422 có thông điệp, không phải 500
          - Bấm "Lưu và nhập tiếp" thì lô được tạo, form giữ ngày và nhà cung cấp, các ô khác trống
          - Đặt lại dữ liệu rồi tạo 3 lô liền không trùng mã lô mẫu
        file_cham:
          - supabase/schema.sql (bảng lot_attachments mới, ràng buộc đơn vị của lots)
          - src/app/api/lots/route.ts
          - src/app/api/lots/[id]/attachments/route.ts (mới)
          - src/app/(app)/lots/lot-forms.tsx

  - key: E-T06
    title: "Giao dịch: bán thoả thuận (相対取引) và đấu giá (せり) chạy ổn, có bước xác nhận kết quả đấu giá"
    labels: []
    body: |
      Epic gom gói T-06 (màn SCR-08 tạo giao dịch bán thoả thuận, SCR-09 huỷ giao dịch) và gói T-07 (màn SCR-10 ghi kết quả đấu giá),
      vì hai màn dùng chung một trang giao dịch. Ba việc lớn: cấp mã giao dịch bằng bộ đếm của database để hết lỗi 409 sau khi đặt lại
      dữ liệu (D-41); thêm trạng thái chờ xác nhận cho kết quả đấu giá, chỉ trừ tồn lô khi đã xác nhận (D-42); hạn mức tham gia của người
      tham gia mua bán (Q1 · D-23, giả định chờ khách, nhãn lam-ro-voi-khach, câu hỏi ở X04-01).
      Tiền đề: PREMISE.md Bảng 1 (D-41, D-42), Bảng 2 (Q1 · D-23). Chú giải: 相対取引 là bán thoả thuận giữa hai bên; せり là bán đấu giá;
      許可 / 承認 là hai cấp tư cách mua (giấy phép / giấy chấp thuận); 業務日 là ngày nghiệp vụ của chợ theo giờ Nhật; B-18 là lỗi nút huỷ
      hiện sai điều kiện.
      Giả định của backlog (thay cho chữ "vai bán buôn" trong PREMISE, vì prototype không có vai này): người xác nhận hoặc trả lại kết quả
      đấu giá là vai giao dịch (ROLE-TRADE) và bắt buộc khác người nhập; dữ liệu mẫu cần hai tài khoản vai giao dịch. Hạn mức chỉ áp cho
      loại người tham gia mua bán (trading_party), tính trên tổng thành tiền trong một ngày nghiệp vụ, cộng cả giao dịch chờ xác nhận.
      Mã lỗi mới của epic (đăng ký vào bảng mã lỗi chung X01-01): LIMIT_EXCEEDED, HAS_DELTA, SERI_RESULT_PENDING.
      Để ngoài epic, có chủ ở nơi khác: quyền vào màn SCR-08 (X02-01); lô phải công khai mới bán (T05-01); khoá ngày bị từ chối khi còn kết
      quả chờ xác nhận và cảnh báo lô chưa bán khi khoá ngày (T09-03; epic này chỉ bảo đảm số kết quả chờ tra được qua API); bản ghi phiên đấu giá
      riêng (câu hỏi khách X04-06); bộ lọc lên URL và cột, bộ lọc mã phiên (T02-04).
      Hàm tạo giao dịch trong database bị nhiều issue sửa, thứ tự bắt buộc: T06-01 → T05-01 → T06-02a → T06-04 → T06-07.
      Thứ tự làm còn lại: T06-02a → T06-02b; T06-03 → T06-04; T06-05 → T06-06.
    issues:
      - key: T06-01-ma-giao-dich-bang-bo-dem
        title: "Cấp mã giao dịch và mã lô bằng bộ đếm của database"
        labels: [nguon:gia-co, doi:be]
        boi_canh: |
          Nhận xét LAB-3 của giảng viên: tạo giao dịch báo lỗi 409 trùng mã sau khi đặt lại dữ liệu, làm luồng bán, đấu giá và giao hàng không
          chạy được. Đã xác minh trong hàm tạo giao dịch của database: mã sinh bằng đếm số bản ghi trong ngày cộng một, nên hai giao dịch cùng ngày
          tạo cùng lúc, hoặc có bản ghi mẫu chen số, là trùng mã. PREMISE D-41 chốt: cấp bằng bộ đếm (sequence) của database, không đếm, không lấy
          số lớn nhất cộng một. Mã lô cũng sinh kiểu lấy số lớn nhất cộng một; bộ đếm làm chung ở đây, phần đổi API tạo lô ở T05-05.
          Ca thử sau đặt lại dữ liệu là một phần của smoke test X03-01; issue này chạy tay và ghi kết quả.
        viec: |
          Tạo bảng bộ đếm theo ngày (ngày nghiệp vụ, loại thực thể, số kế tiếp) và hàm next_code: tạo dòng đầu ngày bằng INSERT ... ON CONFLICT
          rồi lấy số bằng một lệnh UPDATE ... RETURNING có khoá hàng, không phụ thuộc số bản ghi hiện có. Hàm tạo giao dịch gọi hàm này.
          Dữ liệu mẫu nạp xong thì đặt bộ đếm bằng số lớn nhất đã dùng của từng ngày và loại.
        tieu_chi_xong:
          - Đặt lại dữ liệu rồi tạo liền 3 giao dịch bán thoả thuận và 1 đấu giá trên bản deploy, không lỗi 409, mã nối tiếp đúng thứ tự
          - Hai yêu cầu tạo giao dịch trên hai lô khác nhau cùng ngày gửi đồng thời (script chạy song song) đều thành công, mã khác nhau
          - Ngày chưa có dòng bộ đếm thì giao dịch đầu tiên nhận số 0001, không lỗi
          - Giao dịch bị huỷ không làm mã bị dùng lại; tạo tiếp vẫn tăng
          - Hàm tạo giao dịch không còn phép đếm trên bảng giao dịch để sinh mã (kiểm bằng grep)
        file_cham:
          - supabase/schema.sql (bảng code_counters mới, hàm next_code mới, hàm tạo giao dịch phần sinh mã)
          - supabase/seed.sql (đặt bộ đếm sau khi nạp mẫu)

      - key: T06-02a-trang-thai-cho-xac-nhan-dau-gia
        title: "Kết quả đấu giá có trạng thái chờ xác nhận trong database"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T06-01-ma-giao-dich-bang-bo-dem, T05-01-trang-thai-cong-khai-lo]
        boi_canh: |
          D-42 (review LAB-4): sơ đồ trạng thái của khách có bước chờ xác nhận cho kết quả đấu giá (せり), prototype ghi thẳng là đã xác nhận
          (confirmed) và trừ tồn lô ngay. PREMISE chốt: người vận hành nhập kết quả, người có thẩm quyền xác nhận hoặc trả lại kèm lý do, rồi mới
          thành đã xác nhận và trừ tồn lô. Giả định ở thân epic: người xác nhận là vai giao dịch khác người nhập. Issue này chỉ làm cột, trạng thái
          và hàm database; API và màn ở T06-02b; hàm tính thưởng loại giao dịch chờ xác nhận làm ở INC-06 (epic E-INC).
          Thiết kế LAB-4 còn đòi một phiên đấu giá không ghi hai kết quả cho cùng lô và cùng bên mua.
        viec: |
          Migration: thêm pending_confirm (chờ xác nhận) và returned (đã trả lại) vào ràng buộc trạng thái giao dịch; cột người xác nhận, thời điểm
          xác nhận, lý do trả lại; chỉ mục duy nhất (mã phiên, lô, bên mua). Hàm tạo giao dịch với loại seri ghi pending_confirm và không trừ tồn lô
          (vẫn kiểm tồn đủ). Hàm confirm_seri_result: chỉ vai giao dịch khác người nhập, khoá lô, kiểm tồn lại, trừ tồn, chuyển sang confirmed, thời điểm
          lấy now() của database. Hàm return_seri_result: bắt buộc lý do, chuyển sang returned, không chạm tồn. Cả hai chặn ngày đã khoá và ghi nhật ký
          cùng giao dịch. Dữ liệu mẫu thêm tài khoản vai giao dịch thứ hai. Migration có bước quay lại.
        tieu_chi_xong:
          - Ghi kết quả đấu giá 100 kg trên lô còn 300 kg thì tồn lô vẫn 300 kg và giao dịch ở pending_confirm
          - Gọi confirm_seri_result thì tồn còn 200 kg, trạng thái confirmed, có người và thời điểm xác nhận theo giờ database
          - Gọi return_seri_result không có lý do bị từ chối; có lý do thì thành returned, tồn không đổi, nhật ký có lý do
          - Người nhập tự xác nhận nhận lỗi quyền; tài khoản vai giao dịch thứ hai trong dữ liệu mẫu xác nhận được
          - Hai kết quả chờ xác nhận cùng lô tổng 350 kg trên lô 300 kg thì cái xác nhận sau bị QTY_EXCEEDED với số tồn thật
          - Ghi hai kết quả cùng phiên, cùng lô, cùng bên mua thì cái thứ hai bị từ chối trùng
          - Xác nhận trên ngày nghiệp vụ đã khoá bị BUSINESS_DAY_LOCKED
          - Chạy bước quay lại migration thì giao dịch mẫu confirmed không đổi
        file_cham:
          - supabase/schema.sql (bảng trades, hàm tạo giao dịch nhánh seri, hàm confirm_seri_result và return_seri_result mới)
          - supabase/seed.sql (tài khoản vai giao dịch thứ hai)

      - key: T06-02b-api-va-man-xac-nhan-dau-gia
        title: "API và màn xác nhận hoặc trả lại kết quả đấu giá"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T06-02a-trang-thai-cho-xac-nhan-dau-gia, T08-02-ghi-dot-giao-an-toan-khi-dong-thoi]
        boi_canh: |
          Theo T06-02a. Màn SCR-10 (đường dẫn /seri) hiện chỉ có form ghi kết quả và bảng; cần thêm bước con người quyết, một trong bốn điểm
          con người quyết đã cam kết từ LAB-1. Giao dịch pending_confirm (chờ xác nhận) không được vào đối soát, không tạo được đợt giao, và màn
          khoá ngày (T09-03) cần biết số kết quả chờ theo ngày. Thiết kế LAB-4 còn đòi thông điệp vượt tồn của đấu giá chỉ đường sang
          màn tranh chấp SCR-19.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: T06-02b.1-api-xac-nhan-tra-lai-va-view-chi-doc-da-xac-nhan rồi T06-02b.2-nut-va-hop-thoai-xac-nhan-tren-man-giao-dich.
          Bối cảnh ở trên dùng chung cho hai issue con; tiêu chí xong của từng phần nằm ở issue con.
        tieu_chi_xong:
          - Hai issue con đã đóng, mọi tiêu chí xong của chúng đạt trên cùng một bản deploy
        file_cham:
          - src/app/api/trades/[id]/confirm/route.ts (mới)
          - src/app/api/trades/[id]/return/route.ts (mới)
