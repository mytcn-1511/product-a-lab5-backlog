        labels: [nguon:gia-co, doi:fe]
        boi_canh: |
          S-04 (đo ở LAB-4): tầng layout chỉ kiểm đã đăng nhập, bảng menu chỉ ẩn nút; vai chỉ xem (viewer) gõ thẳng /settlement hay /rules vẫn thấy
          trang, chỉ API mới chặn 403. Review LAB-4 yêu cầu thống nhất quyền vào ba màn SCR-08 (xác nhận giao dịch bán thoả thuận, /trades),
          SCR-15 (hoàn tất giao hàng, /deliveries), SCR-20 (kết quả thưởng thanh toán đủ hạn, /incentives) theo ma trận menu. Theo ma trận: /trades
          cho vai giao dịch, /deliveries cho vai giao hàng, /incentives cho vai đối soát.
          S-06 (mức cao): tham số next sau đăng nhập chỉ kiểm bắt đầu bằng dấu gạch chéo, nên giá trị dạng //ten-mien-khac đưa người dùng ra ngoài
          hệ thống; thiết kế LAB-4 chốt chỉ nhận đường dẫn có trong ma trận menu, chặn cả // và /api/. Cùng một danh sách nên gộp vào đây.
          Quyết định D-11 ghi ở thân epic. D-37 (vai đối soát có quyền đọc /participants nhưng không có lối vào) và D-38 (vai quản trị quy tắc với
          /reports) sửa trong cùng bảng. Layout của Next.js không chạy lại khi chuyển trang trong ứng dụng, nên phải kiểm ở từng trang.
        viec: |
          Viết hàm dùng chung requirePageRole(đường dẫn) đọc vai từ phiên và so với ma trận; gọi ở layout nhóm (app) và ở đầu mỗi trang. Không khớp thì
          trả trang 403 "Bạn không có quyền vào màn này", không chuyển về đăng nhập, không gọi API dữ liệu. Sửa ma trận: thêm /participants cho vai
