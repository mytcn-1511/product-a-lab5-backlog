        con:
          - key: T15-01.1-bang-quy-tac-co-phien-ban-va-api-luu
            title: "Bảng quy tắc thông báo có phiên bản, 6 quy tắc mặc định và API lưu quy tắc"
            labels: [nguon:moi, doi:be]
            boi_canh: |
              Issue con của T15-01-bang-quy-tac-va-ham-sinh-thong-bao; đọc bối cảnh ở issue cha.
            viec: |
              Tạo migration (có bước quay lại) bảng notification_rules: loại thông báo, bật/tắt, vai nhận, người nhận chỉ định, kênh (trong ứng dụng / email), ngưỡng và đơn vị, giờ gửi, ngày gửi trong tuần, số lần thử lại tối đa, hiệu lực từ ngày, người tạo, thời điểm, dòng thay thế. Ràng buộc kiểm ở database: loại thuộc 6 loại, kênh là tập con của hai kênh, số lần thử lại từ 1 đến 3, ngưỡng ngày từ 1 đến 365, giờ gửi trong 02:00–10:00 giờ Nhật (riêng lỗi xuất dữ liệu tới 11:30). Thêm ràng buộc kiểm cho cột loại và cột kênh của bảng thông báo. Dữ liệu mẫu đủ 6 quy tắc mặc định như mô tả issue cha. API GET trả 6 dòng hiệu lực kèm danh sách vai và người dùng còn hoạt động; API POST tạo phiên bản mới trong một giao dịch database, bắt lý do, từ chối khi dòng cơ sở đã bị thay thế, nhận khoá chống gửi trùng (Idempotency-Key, cùng khoá trong 5 phút chỉ tạo một dòng), ghi nhật ký; với loại hồ sơ sắp hết hạn thì ghi ngưỡng vào bảng cấu hình chung của T02-01.
            tieu_chi_xong:
              - "GET trả đúng 6 dòng sau khi đặt lại dữ liệu mẫu, mỗi loại một dòng, loại kỳ thưởng đã chốt có vai đối soát và quản trị quy tắc"
              - "Tạo quy tắc với số lần thử lại 4, ngưỡng 0 hoặc 366 ngày, loại thứ 7, kênh lạ: database từ chối từng ca; số lần thử lại 3 và ngưỡng 365 được nhận"
              - "Lưu quy tắc không có lý do bị từ chối; lưu hợp lệ thì có dòng mới, dòng cũ có cột thay thế bởi trỏ sang dòng mới, cả hai còn trong bảng"
              - "Hai người cùng lưu từ cùng một dòng cơ sở: người sau nhận lỗi đã có bản mới, không có hai dòng hiệu lực cho cùng loại; gửi lại cùng Idempotency-Key trong 5 phút chỉ tạo một dòng"
              - "Lưu ngưỡng hồ sơ sắp hết hạn 45: bảng cấu hình chung của T02-01 thành 45 trong cùng giao dịch; bộ lọc sắp hết hạn ở SCR-05 đổi theo"
              - "Vai đối soát gọi API POST nhận lỗi quyền; nhật ký có dòng với giá trị trước và sau và lý do"
            file_cham:
              - "supabase/schema.sql (bảng notification_rules, ràng buộc kiểm notifications.kind và channel)"
              - "supabase/seed.sql (6 quy tắc mặc định)"
              - "src/app/api/admin/notification-rules/route.ts (mới)"
          - key: T15-01.2-ham-ghi-thong-bao-dung-chung
            title: "Hàm ghi thông báo dùng chung theo quy tắc hiệu lực, mẫu câu tiếng Nhật và bảng link chuẩn"
            labels: [nguon:moi, doi:be]
            lam_sau: [T15-01.1-bang-quy-tac-co-phien-ban-va-api-luu]
            boi_canh: |
              Issue con của T15-01-bang-quy-tac-va-ham-sinh-thong-bao; đọc bối cảnh ở issue cha.
            viec: |
              Viết hàm ghi thông báo dùng chung: nhận loại, tham số, tự dựng tiêu đề và nội dung tiếng Nhật từ mẫu câu cố định, lấy link từ bảng link chuẩn (T16-01), lọc người nhận theo vai và người chỉ định của quy tắc hiệu lực, quy tắc tắt thì không ghi, ghi một dòng mỗi người nhận và trả về danh sách mã dòng.
            tieu_chi_xong:
              - "Gọi hàm ghi thông báo loại tranh chấp mở với dữ liệu mẫu có 3 người thuộc hai vai nhận: bảng thông báo có 3 dòng, link là /settlement kèm ngày đúng bảng link chuẩn; tắt quy tắc rồi gọi lại: 0 dòng"
              - "Quy tắc có một người chỉ định không thuộc vai nhận: người đó vẫn nhận đúng một dòng; người vừa thuộc vai vừa được chỉ định không nhận hai dòng"
              - "Tiêu đề và nội dung là câu tiếng Nhật dựng từ mẫu cố định, không chứa mã thô như UUID hay tên loại tiếng Anh"
            file_cham:
              - "src/lib/notifications/create.ts (mới, hàm ghi thông báo và mẫu câu)"

      - key: T15-02-gui-email-co-thu-lai-va-hang-doi-het-luot
        title: "Gửi email thật có thử lại tối đa 3 lần rồi chuyển vào hàng đợi cảnh báo"
        labels: [nguon:moi, doi:be]
        lam_sau: [T15-01-bang-quy-tac-va-ham-sinh-thong-bao, T14-06-tac-vu-bao-cao-ngay-va-giam-sat-han-11-gio]
        boi_canh: |
          Bảng thông báo chỉ ghi nội dung, không ghi việc gửi (D-31). Thiết kế LAB-4 đề xuất bảng notification_deliveries: một dòng cho mỗi cặp thông báo × kênh × người nhận,
          trạng thái chờ gửi / đã gửi / lỗi / hết lượt (dead_letter, tức đã thử đủ mà vẫn hỏng), số lần thử lại, thời điểm thử tiếp, mã lỗi chuẩn hoá, nguyên văn lỗi nhà cung cấp (chỉ quản trị thấy), cờ "gửi thử".
          Đếm thử lại: lần gửi đầu không tính; hỏng thì thử lại tối đa 3 lần (theo trần của phiên bản quy tắc lúc xếp hàng), cách lần hỏng trước 1, 5, 30 phút; hỏng ở lần thử lại cuối thì hết lượt.
          Chỗ tự quyết: nhà cung cấp email cấu hình qua biến môi trường, không ghi tên cố định; thiếu cấu hình thì dòng gửi thành lỗi có mã rõ, thao tác nghiệp vụ đã sinh thông báo không hỏng.
          Tác vụ theo lịch (job) dùng hàm kiểm khoá và tài liệu lịch chạy của T14-06.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: T15-02.1-xep-hang-gui-va-job-gui-lan-dau rồi T15-02.2-thu-lai-het-luot-va-dong-treo.
