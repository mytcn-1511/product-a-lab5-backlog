  - key: E-X03
    title: "X-03 Kiểm thử và triển khai: database thử, đặt lại dữ liệu kèm kiểm nhanh, test chốt chặn, máy kiểm tự động, điện thoại, kịch bản demo"
    labels: []
    body: |
      Epic gom lưới an toàn cho cả backlog. Nhận xét LAB-3 của giảng viên: lỗi 409 trùng mã lộ ra lúc chấm vì không có bước thử ngay sau khi đặt lại
      dữ liệu; dữ liệu demo lẫn dữ liệu test làm màn demo khó hiểu; nhiều bài không thử trên điện thoại.
      Bản 2 thêm X03-00 "dựng database thử bằng một lệnh" làm ở đầu Sprint 1: nó là chủ duy nhất của tests/README.md, các issue khác chỉ bổ sung mục;
      INC-13 (bộ test chuỗi thưởng), X03-02, X03-03, X02-02 làm sau X03-00. Bộ kiểm thử chuỗi thưởng đã có ở INC-13, epic này không lặp.
      Chú giải mã: smoke test là kiểm nhanh luồng chính, không tìm lỗi sâu; GitHub Actions là máy kiểm tự động của GitHub chạy mỗi khi đẩy mã;
      branch protection là khoá nhánh chính, không cho gộp khi kiểm đỏ; 相対取引 là giao dịch bán thoả thuận; せり là đấu giá; 業務日 là ngày nghiệp vụ
      theo giờ Nhật; D-25 là quyết định múi giờ Nhật cố định; D-40 là ba ca hoàn tất giao nhận; D-41 là cấp mã giao dịch bằng sequence (T06-01).
      Giả định: không có giả định riêng; epic bám PREMISE.md và thiết kế LAB-4.
      Thứ tự làm: X03-00 đầu Sprint 1; X03-03 ngay sau X01-03 và X03-01; X03-01 sau T06-01; X03-02 sau X03-00 và T08-03; X03-04 và X03-05 ở sprint cuối.
    issues:
      - key: X03-00-dung-database-thu-mot-lenh
        title: "Dựng database thử bằng một lệnh từ schema và dữ liệu mẫu test, dùng chung cho mọi bộ kiểm thử"
        labels: [nguon:moi, doi:qa]
        boi_canh: |
          Mọi kiểm thử chốt chặn (INC-13, X03-02, X02-02) đều cần một database Postgres thử dựng sạch rồi nạp schema và dữ liệu mẫu, nhưng chưa
          ai sở hữu việc này; INC-13 vốn tạo nó lại xếp cuối backlog. Issue này làm ở đầu Sprint 1, là chủ duy nhất của tests/README.md.
          Cách dựng không được phụ thuộc project Supabase thật để kiểm thử chạy được trên máy cá nhân và trên máy kiểm tự động.
        viec: |
          Viết lệnh npm run db:test: khởi động Postgres thử bằng Docker (hoặc dùng địa chỉ Postgres có sẵn qua biến môi trường), tạo database mới,
          nạp supabase/schema.sql rồi supabase/seed-test.sql (hiện là seed.sql; X03-01 sẽ tách), in địa chỉ kết nối cho kiểm thử. Lệnh npm run db:test:down
          dọn. Viết tests/README.md: cách dựng, cách chạy từng bộ, quy ước mỗi issue kiểm thử bổ sung một mục riêng, không sửa mục người khác.
          Thêm một kiểm thử mẫu đếm số bảng để chứng minh khung chạy.
        tieu_chi_xong:
          - Trên máy mới cài Docker, chạy npm run db:test rồi npm test; kiểm thử mẫu xanh; tổng thời gian dưới 3 phút
          - Chạy db:test hai lần liên tiếp cho database giống nhau (số dòng mỗi bảng bằng nhau); db:test:down dọn sạch
          - Cùng lệnh chạy được trong GitHub Actions với Postgres dạng dịch vụ (X03-03 dùng lại, không viết lại)
          - tests/README.md có mục "Cách dựng", "Cách chạy", "Quy ước thêm bộ kiểm thử"; người mới làm theo được không cần hỏi
        file_cham:
          - scripts/db-test.sh (mới)
          - tests/README.md (mới, chủ sở hữu)
          - tests/smoke-schema.test.ts (mới, kiểm thử mẫu)
          - package.json (lệnh db:test, db:test:down, test)

      - key: X03-01-dat-lai-du-lieu-mau-va-kiem-nhanh-luong-chinh
        title: "Script đặt lại dữ liệu mẫu an toàn kèm kiểm nhanh luồng chính chạy bằng một lệnh sau mỗi lần đặt lại và sau mỗi lần deploy"
        labels: [nguon:gia-co, doi:qa]
        lam_sau: [T06-01-ma-giao-dich-bang-bo-dem]
        boi_canh: |
          Nhận xét LAB-3: sau khi đặt lại dữ liệu, tạo giao dịch báo lỗi 409 trùng mã, làm luồng bán, đấu giá và giao hàng không chạy được lúc chấm;
          lỗi chỉ lộ ra khi giảng viên chấm vì không có bước thử ngay sau khi đặt lại và sau khi deploy. Gốc lỗi (mã sinh bằng đếm cộng một) sửa ở T06-01.
          Hiện chưa có script đặt lại; người làm chạy tay seed.sql, dễ chạy nhầm sang project khác. Script đặt lại và kiểm nhanh (smoke test, kiểm nhanh
          luồng chính) là một thứ bàn giao: đặt lại xong phải thử ngay.
          Lưu ý khi chạy kiểm nhanh: ngày chạy phải là ngày chợ mở (T09-02 chặn ngày nghỉ), tài khoản thử có hạn mức tham gia đủ lớn (T06-04);
          giao dịch tạo ra được đánh dấu nguồn "smoke" ở cột ghi chú, không xoá (giao dịch đã chốt không sửa đè).
        viec: |
          Viết scripts/dat-lai-du-lieu-mau.sh: in mã project Supabase đang trỏ tới và bắt gõ lại đúng mã mới xoá; xoá dữ liệu nghiệp vụ theo thứ tự
          khoá ngoại; nạp bộ được chọn (--test hoặc --demo); sau khi nạp, đặt sequence cấp mã lớn hơn mã lớn nhất trong dữ liệu mẫu. Tách seed.sql thành
          seed-test.sql (giữ ca lỗi) và seed-demo.sql (dữ liệu sạch, tên Nhật hư cấu, nội dung do X03-05 quy định). Viết tests/smoke.test.ts nhận địa chỉ
          bản deploy qua biến môi trường: đăng nhập vai giao dịch, tạo liền 3 giao dịch bán thoả thuận (相対取引) và 1 đấu giá (せり) trong cùng ngày
          nghiệp vụ, đăng xuất, mở phiên mới đọc lại thấy đủ 4 mã; lệnh npm run smoke; script đặt lại có tuỳ chọn --smoke gọi ngay sau khi nạp.
        tieu_chi_xong:
          - "Gõ sai mã project: không có dòng nào bị xoá, mã thoát khác 0"
          - Đặt lại với --test --smoke trên bản deploy vào ngày chợ mở; kiểm nhanh xanh, 4 giao dịch có ghi chú "smoke", mã không trùng; mã thoát 0
          - Chạy kiểm nhanh 3 lần liên tiếp không đặt lại; cả 3 xanh, 12 mã giao dịch khác nhau; thời gian mỗi lần dưới 2 phút
          - Nếu T06-01 chưa gộp mà chạy trên mã cũ, kiểm nhanh phải đỏ ở bước tạo giao dịch thứ hai và log nêu lỗi 409 (ca này chỉ kiểm trước khi T06-01 gộp)
          - Đặt lại với --demo cho database chỉ có dữ liệu của seed-demo.sql; với --test chỉ có seed-test.sql (kiểm bằng đếm dòng người tham gia)
          - Mục riêng trong tests/README.md ghi cách chạy, biến môi trường, cách chọn bộ dữ liệu
        file_cham:
          - scripts/dat-lai-du-lieu-mau.sh (mới)
          - supabase/seed-test.sql (tách từ seed.sql)
          - supabase/seed-demo.sql (mới, nội dung theo X03-05)
          - tests/smoke.test.ts (mới)
          - package.json (lệnh smoke)
          - tests/README.md (bổ sung mục)

      - key: X03-02-test-chot-chan-quan-trong
        title: "Kiểm thử tự động cho bốn chốt chặn: bán vượt tồn, giấy phép hết hạn theo ngày nghiệp vụ, ngày đã khoá không sửa, hoàn tất giao nhận ba ca"
        labels: [nguon:gia-co, doi:qa]
        lam_sau: [X03-00-dung-database-thu-mot-lenh, T08-03-hoan-tat-giao-nhan-khi-khop-so-luong]
        boi_canh: |
          Nhận xét LAB-3: có lưới kiểm thử tự động cho chốt chặn quan trọng thì lỗi lộ ra trước khi nộp. Bốn chốt chặn nằm trong database (hàm và
          trigger) nên thử trực tiếp trên database thử của X03-00 là đủ tin cậy. Các ca về thưởng đã ở INC-13, không lặp. Nhóm hoàn tất giao nhận
          cần hành vi của T08-03 nên làm sau T08-03.
          Theo D-25, mọi ca chạm ngày nghiệp vụ (業務日, theo giờ Nhật) có ca nhập lúc 02:31 giờ Nhật khi máy chủ đặt múi giờ UTC. Theo D-40, hoàn tất
          giao nhận có ba ca giao thiếu, giao vượt, trả lại. 許可 là giấy phép, một trong hai cấp tư cách mua.
        viec: |
          "Viết tests/guards.test.ts chạy trên database thử: (1) tạo giao dịch số lượng vượt tồn lô bị từ chối với mã QTY_EXCEEDED; (2) bên mua có giấy
          phép hết hạn đúng ngày nghiệp vụ bị từ chối, còn hạn tới hết ngày thì được, kèm ca 02:31 giờ Nhật trên máy chủ UTC; (3) sửa giao dịch, lô, đợt
          giao thuộc ngày đã khoá bị từ chối với mã BUSINESS_DAY_LOCKED; (4) hoàn tất giao nhận: giao thiếu không hoàn tất, giao vượt dừng ở trạng
          thái ngoại lệ, trả lại trừ khỏi số đã giao. Mỗi ca ghi số kỳ vọng trong mã kiểm thử."
        tieu_chi_xong:
          - Một lệnh chạy cả bốn nhóm trên database thử; mã thoát 0 khi đúng; ít nhất 10 ca, mỗi ca có số cụ thể (ví dụ tồn 100 kg, yêu cầu 120 kg)
          - Ca nhập lúc 02:31 giờ Nhật khi máy chủ đặt UTC cho ra ngày nghiệp vụ là ngày hôm đó theo giờ Nhật, không lùi một ngày
          - "Cố ý bỏ trigger khoá ngày trong database thử: nhóm (3) báo đỏ"
          - Mã lỗi trong kiểm thử khớp docs/ma-loi.md (X01-01)
          - Mục riêng trong tests/README.md liệt kê 4 nhóm và cách chạy riêng từng nhóm
        file_cham:
          - tests/guards.test.ts (mới)
          - tests/README.md (bổ sung mục)

      - key: X03-03-may-kiem-tu-dong-github-truoc-khi-gop-va-sau-deploy
        title: "Máy kiểm tự động của GitHub chạy kiểm kiểu dữ liệu, lint, kiểm thử trước khi gộp mã, và kiểm nhanh sau mỗi lần deploy"
        labels: [nguon:moi, doi:infra]
        lam_sau: [X03-00-dung-database-thu-mot-lenh, X01-03-kiem-bien-moi-truong-luc-build-va-khoi-dong, X03-01-dat-lai-du-lieu-mau-va-kiem-nhanh-luong-chinh]
        boi_canh: |
          Prototype không có kiểm tra tự động nào khi gộp mã; lỗi kiểu và lỗi kiểm thử chỉ lộ khi deploy. Backlog LAB-5 có nhiều người cùng sửa database
          và API, cần một cổng chung. GitHub Actions (máy kiểm tự động của GitHub) chạy mỗi pull request (yêu cầu gộp mã). Database thử dựng bằng lệnh
          của X03-00; kiểm biến môi trường của X01-03 chạy với giá trị giả; kiểm nhanh sau deploy dùng lệnh của X03-01.
          Khoá nhánh chính (branch protection, không cho gộp khi kiểm đỏ) có thể không bật được trên gói GitHub hiện tại.
        viec: |
          Viết workflow kiem-tra-truoc-khi-gop.yml chạy trên mỗi pull request: cài phụ thuộc, kiểm biến môi trường với giá trị giả, kiểm kiểu TypeScript,
          lint, dựng Postgres thử bằng dịch vụ trong workflow qua lệnh db:test, chạy toàn bộ kiểm thử. Workflow smoke-sau-deploy.yml chạy sau khi deploy
          xong: gọi npm run smoke trên địa chỉ bản deploy (địa chỉ và tài khoản thử lấy từ secrets của repo, không ghi trong mã). Bật khoá nhánh chính
          nếu gói GitHub cho phép; không thì ghi quy ước "không gộp khi kiểm đỏ" vào README của repo và kiểm bằng tay khi review.
        tieu_chi_xong:
          - "Mở pull request có lỗi kiểu cố ý: workflow đỏ trong vòng 10 phút, nêu đúng file và dòng"
          - "Pull request sạch: workflow xanh; thời gian chạy dưới 10 phút"
          - Workflow sau deploy chạy kiểm nhanh và đỏ khi kiểm nhanh đỏ; không có khoá hay mật khẩu nào trong file workflow (grep ra 0)
          - Khoá nhánh chính bật (chụp màn hình cài đặt vào mục riêng của tests/README.md) hoặc README của repo có mục quy ước không gộp khi kiểm đỏ
        file_cham:
          - .github/workflows/kiem-tra-truoc-khi-gop.yml (mới)
          - .github/workflows/smoke-sau-deploy.yml (mới)
          - package.json (lệnh typecheck, lint, test)
          - tests/README.md (bổ sung mục)

      - key: X03-04-kiem-thu-dien-thoai-390px-ba-luong-chinh
        title: "Kiểm thử trên màn điện thoại 390 px cho ba luồng chính: ghi đợt giao, tạo giao dịch bán thoả thuận, ghi kết quả thẩm định lô"
        labels: [nguon:gia-co, doi:qa]
        lam_sau: [T08-06-hop-thoai-va-khoa-nut-man-giao-hang, T06-06-man-giao-dich-gia-co, T05-04-man-tham-dinh-gia-co]
        boi_canh: |
          Định nghĩa xong chung cho issue màn hình (meta của backlog) đòi một luồng dùng được trên màn 390 px, không cuộn ngang. Người giao hàng và
          người thẩm định (目利き, đánh giá chất lượng lô) thao tác ngoài trời bằng điện thoại. Ba luồng chọn theo mức dùng điện thoại: ghi đợt giao và
          hoàn tất (SCR-15, T08-06), tạo giao dịch bán thoả thuận (SCR-08, T06-06), ghi kết quả thẩm định (SCR-07, T05-04).
          Playwright là công cụ điều khiển trình duyệt tự động. Nếu khi vào sprint ước quá 16 giờ, tách mỗi luồng một issue.
        viec: |
          Viết kiểm thử Playwright với khung nhìn 390×844: đi hết ba luồng; ở mỗi bước đo chiều rộng cuộn của trang không vượt 390, nút chính (Lưu, Hoàn
          tất, Xác nhận) nhìn thấy không cần cuộn, ô lỗi hiện tại ô nhập; chụp ảnh mỗi bước lưu vào thư mục bằng chứng. Lỗi tìm thấy ghi thành issue ở
          epic màn hình tương ứng kèm ảnh.
        tieu_chi_xong:
          - Ba luồng chạy xanh ở 390 px; mỗi luồng có ít nhất 3 ảnh chụp trong tests/evidence/mobile
          - "Mọi bước: chiều rộng cuộn của trang bằng 390 hoặc nhỏ hơn (đo bằng document.scrollWidth)"
          - Ở mỗi luồng, nút chính nhìn thấy trong khung nhìn ban đầu mà không cuộn
          - Lỗi tìm thấy có issue riêng ở epic màn hình với link trong bình luận issue này; nếu không có lỗi, bình luận ghi "không có lỗi" kèm ngày chạy
        file_cham:
          - tests/mobile-390.test.ts (mới)
          - tests/evidence/mobile/ (mới, ảnh chụp)
          - playwright.config.ts (mới, nếu chưa có)

      - key: X03-05-kich-ban-demo-theo-vai-du-lieu-ten-nhat-hu-cau
        title: "Kịch bản demo theo vai trên bộ dữ liệu demo sạch với tên Nhật hư cấu, tách khỏi dữ liệu test"
        labels: [nguon:gia-co, doi:qa]
        lam_sau: [X03-01-dat-lai-du-lieu-mau-va-kiem-nhanh-luong-chinh, X02-03-dang-ky-ma-hai-lop-va-bat-tat-o-man-tai-khoan]
        boi_canh: |
          Nhận xét LAB-3: dữ liệu demo lẫn với dữ liệu để thử ca lỗi (số âm, mã lạ, tên tiếng Việt) làm màn demo khó hiểu với người xem là khách Nhật.
          File seed-demo.sql do X03-01 tách; issue này quy định nội dung bộ demo và viết kịch bản. Ba vai bắt buộc xác thực hai lớp (quản trị hệ thống,
          đối soát, quản trị quy tắc) vào được demo nhờ tài khoản thử có mã gốc cố định của X02-03 ghi trong tests/README.md (không phải khoá thật).
          Tên người và công ty chỉ dùng dạng hư cấu rõ ràng (〇〇水産, 〇〇太郎), không dùng tên có thật; danh sách tên dùng ghi ở đầu file seed-demo.sql.
        viec: |
          Quy định nội dung seed-demo.sql (8 tài khoản theo 8 vai, 6 người tham gia tên Nhật hư cấu, 10 lô, 15 giao dịch gồm cả đấu giá, 1 kỳ thưởng đã
          chốt và 1 kỳ mở, 1 ngày nghiệp vụ đã khoá và 1 ngày mở) và nạp vào file đó. Viết docs/kich-ban-demo.md trong repo này: với mỗi vai, danh sách
          bước bấm, màn mong đợi, số liệu mong đợi, cách lấy mã hai lớp cho 3 vai bắt buộc; thời lượng mỗi vai dưới 5 phút; bước đầu là đặt lại với --demo.
        tieu_chi_xong:
          - "Đặt lại với --demo rồi đi hết kịch bản 8 vai theo docs/kich-ban-demo.md: không gặp lỗi, số liệu trên màn khớp số trong kịch bản; 3 vai bắt buộc vào được bằng mã thử"
          - seed-demo.sql không có số âm, không có mã dạng TEST-; danh sách tên ở đầu file chỉ gồm tên hư cấu dạng 〇〇; người rà ký xác nhận bằng bình luận trên issue
          - Bộ kiểm thử vẫn chạy xanh với seed-test.sql; kiểm nhanh X03-01 chạy xanh trên cả hai bộ
          - Kịch bản có cột thời gian, tổng dưới 40 phút cho 8 vai
        file_cham:
          - supabase/seed-demo.sql (nội dung)
          - docs/kich-ban-demo.md (mới, trong repo này)

  - key: E-X04
    title: "X-04 Làm rõ với khách: 10 câu hỏi hồ sơ mời thầu để ngỏ, mỗi câu một issue, không chấm điểm"
    labels: [lam-ro-voi-khach]
    body: |
      Epic không chấm điểm. Mỗi issue là một câu hỏi gửi khách, lấy từ PREMISE.md mục "Câu hỏi gửi khách" (7 câu) cộng 3 câu người điều phối thêm
      ngày 19/10 (B-08 cách đếm trần 4 lần một năm; mở lại ngày đã khoá; hạn xử lý tranh chấp và số người duyệt mở lại giao nhận), sẽ được ghi vào PREMISE.
      Mỗi issue ghi: vì sao hồ sơ mời thầu để ngỏ, phương án đang giả định trong backlog, hệ quả nếu khách chọn khác, và issue nào phải cập nhật khi có
      câu trả lời. Khi khách trả lời, ghi vào PREMISE.md và sửa issue phụ thuộc. Mọi issue X-04 gắn nguon:moi theo quy ước (câu hỏi, không phải việc sửa).
      Chú giải mã: 完納奨励金 là tiền thưởng thanh toán đủ hạn; 業務日 là ngày nghiệp vụ theo giờ Nhật; せり là đấu giá; 許可 và 承認 là hai cấp tư cách mua;
      締め再開 là mở lại thứ đã chốt (ngày hoặc kỳ). Ba câu D-08, D-39, D-44 chạm cách tính thưởng nên gắn constraint:kanno-shoreikin; D-30 chỉ chạm
      thời điểm phản ánh vào thưởng, không chạm cách tính, nên không gắn.
      Thứ tự gửi khách: D-08 và D-39 trước (rủi ro nhất), rồi D-23, D-30, D-10, D-42, D-44, B-08, mở lại ngày, hạn tranh chấp.
    issues:
      - key: X04-01-d23-han-muc-tham-gia
        title: "Hỏi khách về hạn mức tham gia của người tham gia mua bán: đơn vị, phạm vi, thời điểm áp dụng"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach]
        boi_canh: |
          Hồ sơ mời thầu nhắc "hạn mức tham gia" (参加上限) đúng một lần, trong bảng vai trò, cho loại người tham gia mua bán; không nói đơn vị (tiền hay
          số lượng), phạm vi (một ngày, một tháng, một lô) hay thời điểm áp (lúc tạo giao dịch hay lúc đối soát). PREMISE Bảng 2 (Q1 · D-23) chọn giả
          định: trần giá trị giao dịch trong một ngày nghiệp vụ, chặn ngay lúc tạo giao dịch; đây là một trong ba cách hiểu. Hai issue T06-03, T06-04
          đang làm theo giả định này.
        viec: |
          Gửi khách câu hỏi: "Hạn mức tham gia của người tham gia mua bán là số tiền hay số lượng? Tính trong một ngày, một tháng hay một phiên? Hệ
          thống chặn ngay khi tạo giao dịch hay chỉ cảnh báo?" (ý thứ ba là bổ sung ngoài PREMISE). Kèm phương án đang giả định và hệ quả: theo tháng
          hoặc theo số lượng thì T06-03, T06-04 phải sửa; khách bỏ hạn mức thì đóng hai issue đó, không ảnh hưởng chỗ khác.
        tieu_chi_xong:
          - Câu trả lời của khách ghi vào PREMISE.md Bảng 2 dòng Q1 · D-23 kèm ngày trả lời
          - T06-03, T06-04 được cập nhật hoặc đóng theo câu trả lời, link ghi trong bình luận issue này
        file_cham:
          - PREMISE.md

      - key: X04-02-d08-nguon-ngay-thanh-toan
        title: "Hỏi khách về cách ngày thanh toán vào hệ thống: file từ kế toán, nhập tay, hay kết nối trực tiếp"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach, constraint:kanno-shoreikin]
        boi_canh: |
          Hồ sơ mời thầu nói tiền thưởng thanh toán đủ hạn (完納奨励金) tính theo thanh toán đúng hạn nhưng không nói ngày thanh toán vào hệ thống bằng
          cách nào; LAB-4 ghi là chưa chốt (D-08). PREMISE Bảng 2 (Q2) chọn: file CSV do kế toán xuất theo kỳ là nguồn chính (INC-01 đặc tả, INC-02 API
          nhập và tạo bảng tiền về), nhập tay có phân quyền và lý do cho ngoại lệ (INC-03), cột nguồn và lọc nhật ký (INC-04). Bảng tiền về riêng
          (trade_payments) giữ trong mọi phương án vì giao dịch thuộc ngày đã khoá không sửa được. Đây là giả định rủi ro nhất của backlog.
        viec: |
          Gửi khách câu hỏi: "Ngày thanh toán của từng giao dịch sẽ đến từ đâu: kế toán xuất file theo kỳ, người đối soát nhập tay, hay kết nối thẳng với
          hệ thống kế toán? Nếu là file, có mẫu file sẵn không và bao lâu xuất một lần?" Kèm phương án đang giả định và hệ quả: khách chọn kết nối trực
          tiếp thì INC-01 bỏ, INC-02 đổi nguồn đọc từ file sang kết nối nhưng vẫn tạo bảng tiền về, INC-03 giữ; khách chọn chỉ nhập tay thì INC-01 bỏ,
          INC-02 rút còn phần migration bảng tiền về, INC-03 và INC-04 giữ.
        tieu_chi_xong:
          - Câu trả lời ghi vào PREMISE.md Bảng 2 dòng Q2 · D-08 kèm ngày; nếu khách gửi mẫu file thì docs/csv-ngay-thanh-toan.md (INC-01) cập nhật theo mẫu
          - INC-01 đến INC-04 được cập nhật hoặc đóng theo đúng hệ quả ở trên, link ghi trong bình luận issue này
        file_cham:
          - PREMISE.md

      - key: X04-03-d39-bang-ty-le-thuong-that
        title: "Hỏi khách về bảng tỷ lệ thưởng thật: theo loại bên mua, theo bậc số tiền, hay một tỷ lệ chung"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach, constraint:kanno-shoreikin]
        boi_canh: |
          Hồ sơ mời thầu chỉ cố định cách tính thưởng (nhân hệ số thuế 110/100, làm tròn xuống yên, quá hạn không thưởng, tỷ lệ có phiên bản và ngày
          hiệu lực 発効日); bảng tỷ lệ cụ thể không có và không có gói dữ liệu kèm theo (giảng viên xác nhận 17/10). PREMISE Bảng 2 (Q6 · D-39) giữ giả
          định bậc theo số tiền mua như LAB-4, thêm cột loại bên mua tuỳ chọn để khi có bảng thật chỉ đổi dữ liệu (INC-05, INC-06).
        viec: |
          Gửi khách câu hỏi: "Tỷ lệ thưởng hiện áp dụng là một con số chung, theo loại bên mua (bán buôn, nhà buôn trung gian, người tham gia mua bán,
          người mua lẻ), hay theo bậc số tiền? Xin bảng đang dùng kèm ngày hiệu lực gần nhất." Kèm phương án đang giả định và hệ quả: theo loại bên mua
          hoặc một tỷ lệ chung thì chỉ nhập lại dữ liệu bảng tỷ lệ; theo tiêu chí khác (ví dụ theo loài hàng) thì INC-05, INC-06 và màn quản trị T12-03
          phải thêm cột.
        tieu_chi_xong:
          - Câu trả lời và bảng tỷ lệ thật (nếu có) ghi vào PREMISE.md Bảng 2 dòng Q6 · D-39 kèm ngày
          - Dữ liệu mẫu phiên bản tỷ lệ (INC-05) nhập lại theo bảng thật; INC-05, INC-06 cập nhật nếu cần cột mới, link ghi trong bình luận issue này
        file_cham:
          - PREMISE.md

      - key: X04-04-d30-tran-so-dot-giao
        title: "Hỏi khách về trần số đợt giao của một giao dịch và người có quyền xác nhận đợt cuối"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach]
        boi_canh: |
          Hồ sơ mời thầu (phần giao hàng nhiều đợt) yêu cầu bên thầu tự đề xuất trần số lần chia đợt, quyền xác nhận và thời điểm phản ánh vào quyết toán
          và thưởng. PREMISE Bảng 2 (Q8 · D-30) đề xuất: trần cấu hình được, mặc định 3; chỉ đợt cuối tính vào quyết toán và thưởng; làm ở T08-04.
          Đây là đề xuất của đội, khách chưa xác nhận.
        viec: |
          Gửi khách đề xuất và câu hỏi: "Chúng tôi đề xuất tối đa 3 đợt giao cho một giao dịch, con số này chỉnh được trong cài đặt; chỉ khi đợt cuối được
          xác nhận thì giao dịch mới vào quyết toán và tính thưởng. Số 3 có phù hợp thực tế chợ không, và ai là người xác nhận đợt cuối: người giao hàng,
          bên mua, hay người đối soát?" Hệ quả nếu khác: trần khác chỉ đổi giá trị cấu hình ở T08-04; người xác nhận khác thì đổi vai ở T08-03 và màn SCR-15.
        tieu_chi_xong:
          - Câu trả lời ghi vào PREMISE.md Bảng 2 dòng Q8 · D-30 kèm ngày
          - T08-04 và T08-03 cập nhật giá trị mặc định và vai xác nhận, link ghi trong bình luận issue này
        file_cham:
          - PREMISE.md

      - key: X04-05-d10-khoa-ngay-khi-con-tranh-chap
        title: "Hỏi khách về việc khoá ngày nghiệp vụ khi còn tranh chấp đang mở"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach]
        boi_canh: |
          Hồ sơ mời thầu không nói. Luật "không khoá ngày nghiệp vụ (業務日) khi còn tranh chấp mở" là đội tự đặt từ LAB-3, và mâu thuẫn với quyết định cho
          ghi tranh chấp sau khi khoá (B-16). PREMISE Bảng 1 (Q4 · D-10) đổi sang chặn mềm: cho khoá, bắt buộc ghi lý do, ghi số tranh chấp đang mở vào
          nhật ký; làm ở T09-03 và T09-04. Rủi ro của chặn cứng: một tranh chấp nhỏ treo cả ngày nghiệp vụ.
        viec: |
          Gửi khách câu hỏi: "Khi cuối ngày còn tranh chấp chưa xử lý xong, người đối soát có được khoá ngày không? Chúng tôi đang làm theo hướng cho khoá
          nhưng bắt ghi lý do và lưu lại số tranh chấp còn mở." Hệ quả nếu khách chọn chặn cứng: T09-03 đổi thành từ chối khoá khi còn tranh chấp, và
          phải bỏ quyết định B-16 (T09-05) để tránh mâu thuẫn.
        tieu_chi_xong:
          - Câu trả lời ghi vào PREMISE.md Bảng 1 dòng Q4 · D-10 kèm ngày
          - T09-03, T09-04, T09-05 cập nhật theo câu trả lời, link ghi trong bình luận issue này
        file_cham:
          - PREMISE.md

      - key: X04-06-d42-ban-ghi-phien-dau-gia
        title: "Hỏi khách về việc quản lý phiên đấu giá thành bản ghi riêng hay chỉ là mã ghi kèm giao dịch"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach]
        boi_canh: |
          Review LAB-4 (PREMISE D-42) thêm trạng thái chờ xác nhận cho kết quả đấu giá (せり), làm ở T06-02a, T06-02b. Prototype lưu mã phiên là chữ tự do
          trên từng giao dịch, không có bảng phiên. Thiết kế LAB-4 ghi mô hình đích là bảng phiên riêng (mã phiên, ngày nghiệp vụ, giờ bắt đầu, giờ kết
          thúc, người điều hành) nhưng chưa chốt vì hồ sơ mời thầu không nói phiên là một thực thể hay chỉ là nhãn. Câu hỏi này khác với dòng D-42 hiện
          có trong PREMISE (nói về trạng thái chờ xác nhận), nên ghi thành dòng riêng.
        viec: |
          Gửi khách câu hỏi: "Một phiên đấu giá có cần hệ thống quản lý riêng (mã phiên, giờ bắt đầu và kết thúc, người điều hành, danh sách lô trong phiên)
          hay chỉ cần ghi mã phiên lên từng giao dịch để lọc và gộp?" Phương án đang giả định: giữ mã phiên trên giao dịch, chọn từ danh sách mã đã có trong
          ngày hoặc nhập mới; chưa tạo bảng phiên. Hệ quả nếu khách cần bản ghi riêng: thêm 2 issue ở epic T-06 (bảng phiên và màn quản lý phiên), T06-02b
          đổi sang xác nhận theo phiên.
        tieu_chi_xong:
          - Câu trả lời ghi vào PREMISE.md Bảng 1, dòng riêng "D-42 · bản ghi phiên" kèm ngày
          - "Nếu cần bảng phiên: 2 issue mới ở epic T-06 được tạo, link ghi trong bình luận issue này; nếu không: issue này đóng với ghi chú giữ nguyên"
        file_cham:
          - PREMISE.md

      - key: X04-07-d44-mo-lai-ky-thuong-da-chot
        title: "Hỏi khách về nhu cầu mở lại một kỳ thưởng đã chốt, hay mọi sửa đổi đều đi qua kỳ sau"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach, constraint:kanno-shoreikin]
        boi_canh: |
          Hồ sơ mời thầu (phần thao tác nhạy cảm phải có nhật ký) có nhắc "mở lại thứ đã chốt" (締め再開) nhưng không nói khi nào được mở lại và ai được mở.
          Prototype không có chức năng này. PREMISE Bảng 1 (D-44) chốt: không sửa kỳ đã chốt, dòng chênh lệch rơi vào kỳ đã chốt được đẩy sang kỳ mở gần
          nhất (INC-09a). Nếu khách cần mở lại kỳ thì đây là một luồng mới với phê duyệt riêng. Câu về mở lại ngày đã khoá ở X04-09.
        viec: |
          Gửi khách câu hỏi: "Trong thực tế có trường hợp nào phải mở lại một kỳ thưởng đã chốt để tính lại không (ví dụ phát hiện sai tỷ lệ sau khi đã trả
          thưởng)? Nếu có, ai được quyền mở lại và cần ai phê duyệt?" Phương án đang giả định: không mở lại, mọi chênh lệch đi vào kỳ mở gần nhất với cột
          kỳ gốc. Hệ quả nếu khách cần mở lại: thêm 2 đến 3 issue ở epic E-INC (hàm mở lại kỳ có phê duyệt tách người, nhật ký, màn); INC-09a giữ nguyên.
        tieu_chi_xong:
          - Câu trả lời ghi vào PREMISE.md Bảng 1 dòng D-44 kèm ngày
          - "Nếu cần mở lại: issue mới ở epic E-INC được tạo và link ghi trong bình luận issue này; nếu không: issue này đóng với ghi chú giữ nguyên"
        file_cham:
          - PREMISE.md

      - key: X04-08-b08-dem-tran-4-lan-nam-ban-thu-hoi
        title: "Hỏi khách về cách đếm trần 4 lần đổi quy tắc một năm khi có bản đã thu hồi"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach]
        boi_canh: |
          Hồ sơ mời thầu cố định trần 4 lần thay đổi quy tắc tỷ lệ trong một năm nhưng không nói bản đã thu hồi (thu hồi bản đã duyệt khi tỷ lệ sai) có
          tính vào trần không. Prototype tính cả bản thu hồi (B-08). Thiết kế LAB-4 chốt tạm, ghi rõ là giả định của đội chờ khách: bản thu hồi chỉ tính
          vào trần khi đã từng dùng để tính một kỳ; thu hồi bản chưa kỳ nào dùng thì trả lại lượt. Việc đếm ở T12-01. B-08 sẽ được người điều phối thêm
          vào PREMISE Bảng 2.
        viec: |
          Gửi khách câu hỏi: "Nếu một bản tỷ lệ được duyệt rồi thu hồi ngay vì nhập sai, chưa dùng để tính kỳ nào, thì có tính là một lần đổi quy tắc trong
          năm không?" Phương án đang giả định: không tính nếu chưa kỳ nào dùng, có tính nếu đã dùng. Hệ quả: khách chọn tính tất cả thì T12-01 đơn giản
          hơn (đếm mọi bản trừ bản bị từ chối); khách chọn không tính bản thu hồi dù đã dùng thì cần thêm cảnh báo vì kỳ đã tính bằng bản đó không tính lại.
        tieu_chi_xong:
          - Câu trả lời ghi vào PREMISE.md Bảng 2 dòng B-08 kèm ngày
          - T12-01 và T12-02 cập nhật quy tắc đếm và ca thử, link ghi trong bình luận issue này
        file_cham:
          - PREMISE.md

      - key: X04-09-mo-lai-ngay-da-khoa
        title: "Hỏi khách về việc mở lại một ngày nghiệp vụ đã khoá: khi nào, ai mở, ai duyệt"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach]
        boi_canh: |
          Hồ sơ mời thầu (phần thao tác nhạy cảm) nhắc "mở lại thứ đã chốt" (締め再開) nhưng không nói đó là mở lại ngày nghiệp vụ (業務日) đã khoá hay kỳ
          thưởng đã chốt, và không nói điều kiện. Backlog hiện giả định: ngày đã khoá không mở lại; mọi sửa đổi đi qua yêu cầu điều chỉnh có phê duyệt
          (T10-01, T10-02) và tranh chấp vẫn ghi được sau khoá (T09-05). Nếu khách cần mở lại ngày thì cần một luồng mới có phê duyệt tách người và
          nhật ký, đồng thời phải quy định số liệu đã báo cáo (T14-06) xử lý ra sao.
        viec: |
          Gửi khách câu hỏi: "Có trường hợp nào phải mở lại một ngày đã khoá để sửa trực tiếp, thay vì gửi yêu cầu điều chỉnh không? Nếu có, ai được mở,
          ai duyệt, và báo cáo ngày đã gửi đi có phải phát hành lại không?" Phương án đang giả định: không mở lại ngày, chỉ điều chỉnh có phê duyệt. Hệ quả
          nếu khách cần mở lại: thêm 2 issue ở epic T-09 (hàm mở lại ngày có phê duyệt tách người, màn và nhật ký) và 1 issue ở T-14 (phát hành lại báo cáo).
        tieu_chi_xong:
          - Câu trả lời ghi vào PREMISE.md, dòng mới "締め再開 · mở lại ngày đã khoá" kèm ngày
          - "Nếu cần mở lại: issue mới ở T-09 và T-14 được tạo, link ghi trong bình luận issue này; nếu không: issue này đóng với ghi chú giữ nguyên"
        file_cham:
          - PREMISE.md

      - key: X04-10-han-xu-ly-tranh-chap-va-so-nguoi-duyet-mo-lai-giao-nhan
        title: "Hỏi khách về ngưỡng hạn xử lý tranh chấp và số người duyệt khi mở lại giao nhận đã hoàn tất"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach]
        boi_canh: |
          Hai chỗ hồ sơ mời thầu không nêu số, backlog đang tự đặt. Một: báo cáo tranh chấp (T14-03) đánh dấu quá hạn theo ngưỡng 2 ngày nghiệp vụ, cấu hình
          được. Hai: mở lại giao dịch đã hoàn tất giao nhận để ghi trả hàng hoặc sửa nhầm (T08-05) chỉ cần một người (vai đối soát) kèm lý do, không cần
          người thứ hai duyệt. Cả hai là giả định của đội.
        viec: |
          Gửi khách hai câu: "Tranh chấp phải xử lý xong trong bao nhiêu ngày nghiệp vụ thì coi là đúng hạn? Chúng tôi tạm đặt 2 ngày và cho chỉnh trong cài
          đặt." và "Khi một giao dịch đã hoàn tất giao nhận mà cần mở lại để ghi trả hàng, một người đối soát ghi lý do là đủ, hay cần người thứ hai duyệt?"
          Hệ quả: ngưỡng khác chỉ đổi giá trị cấu hình ở T14-03; cần người thứ hai duyệt thì T08-05 thêm trạng thái chờ duyệt và ràng buộc hai người khác nhau.
        tieu_chi_xong:
          - Câu trả lời ghi vào PREMISE.md, hai dòng mới "hạn xử lý tranh chấp" và "duyệt mở lại giao nhận" kèm ngày
          - T14-03 và T08-05 cập nhật theo câu trả lời, link ghi trong bình luận issue này
        file_cham:
          - PREMISE.md

