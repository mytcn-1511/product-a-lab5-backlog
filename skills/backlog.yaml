# Backlog LAB-5 — Product A. File này là nguồn duy nhất để script tạo issue lên repo và Project.
# Cách đọc: mỗi epic có nhiều issue; mỗi issue có 4 khối cố định (boi_canh, viec, tieu_chi_xong, file_cham).
# "key" là mã khoá ghi vào thân issue để script chạy lại không tạo trùng. "lam_sau" ghi issue phải xong trước (script chép vào thân issue).
# "con": issue con (sub-issue) của một issue quá 16 giờ; issue cha giữ bối cảnh, issue con giữ việc và tiêu chí xong. Điểm SWP chấm ở issue con, cha lấy tổng.
# Nhãn: nguon:moi | nguon:chenh-lech | nguon:gia-co · doi:fe | doi:be | doi:qa | doi:infra (gắn theo lớp nặng nhất) · constraint:kanno-shoreikin · lam-ro-voi-khach
# Chú giải mã: D-xx / B-xx / Q-x theo PREMISE.md · T-xx gói việc LAB-4 · SCR-xx màn hình · DD-008 thiết kế chi tiết phần thưởng.
# Bản 2 ngày 19/10/2026: sửa theo rà soát độc lập (tách INC-08 thành 3, INC-09 thành 2, thêm ca thử đúng hạn, bảng tiền về riêng).

