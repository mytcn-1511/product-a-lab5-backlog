      - key: T06-03-cau-hinh-han-muc-tham-gia
        title: "Cấu hình hạn mức tham gia theo người tham gia mua bán"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach]
        boi_canh: |
          RFP nhắc "hạn mức tham gia" (参加上限) của người tham gia mua bán (trading_party, một trong bốn loại người tham gia) đúng một lần,
          không nói đơn vị, phạm vi hay thời điểm áp dụng (D-23). Đây không phải tính năng mới mà là giả định theo PREMISE Q1 để lấp chỗ RFP
          để ngỏ: trần giá trị giao dịch trong một ngày nghiệp vụ. Câu hỏi khách ở X04-01; sai cách hiểu thì bỏ issue này và T06-04.
          Bám sơ đồ dữ liệu LAB-4: bảng participation_limits, tối đa một dòng mỗi người tham gia, cột loại hạn mức và phạm vi; backlog điền
          loại hạn mức là "trần giá trị ngày". Quyền đặt hạn mức cho vai tiếp nhận (ROLE-INTAKE) cũng là giả định.
        viec: |
          Migration bảng participation_limits: người tham gia (duy nhất), loại hạn mức (daily_amount = trần giá trị ngày), giá trị trần (yên, số nguyên
          lớn hơn 0), người đặt, lý do, thời điểm; mỗi lần đổi ghi một dòng nhật ký có giá trị trước và sau. API đọc và đặt hạn mức cho vai tiếp nhận
          và quản trị hệ thống; từ chối người tham gia không phải trading_party. Không có dòng nghĩa là không giới hạn. Màn chi tiết người tham gia
          (SCR-05) thêm khối "Hạn mức tham gia" chỉ hiện với trading_party: hạn mức hiện tại, ô nhập, lý do bắt buộc, lịch sử đổi đọc từ nhật ký.
          Migration có bước quay lại.
        tieu_chi_xong:
          - Đặt hạn mức 5.000.000 yên cho một người tham gia mua bán thì đọc lại ra đúng số, lý do và người đặt
          - Đặt hạn mức cho người tham gia loại buyer hoặc wholesaler bị từ chối, lỗi nêu rõ chỉ áp cho trading_party
          - Đặt hạn mức 0 hoặc số âm bị từ chối; bỏ trống lý do thì lỗi hiện ngay tại ô
          - Đổi hạn mức từ 5.000.000 sang 7.000.000 thì bảng vẫn một dòng cho người đó, nhật ký có dòng giá trị trước 5.000.000 sau 7.000.000
          - Vai giao dịch gọi API đặt hạn mức nhận lỗi quyền; mở màn chỉ thấy số, không thấy ô nhập
          - Người tham gia loại buyer không có khối hạn mức trên màn
        file_cham:
          - supabase/schema.sql (bảng participation_limits mới)
          - src/app/api/participants/[id]/limit/route.ts (mới)
          - src/app/(app)/participants/[id]/page.tsx

      - key: T06-04-chan-han-muc-luc-tao-giao-dich
        title: "Chặn tạo giao dịch khi vượt hạn mức tham gia trong ngày"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach]
        lam_sau: [T06-03-cau-hinh-han-muc-tham-gia, T06-02a-trang-thai-cho-xac-nhan-dau-gia]
        boi_canh: |
          Theo T06-03 và giả định PREMISE Q1 · D-23: chặn ngay lúc tạo giao dịch, phạm vi một ngày nghiệp vụ (業務日) của lô, theo giờ Nhật (D-25).
          Tổng để so gồm giao dịch confirmed (đã xác nhận) và pending_confirm (chờ xác nhận, T06-02a) để không lách bằng kết quả đấu giá chưa
          xác nhận; giao dịch đã huỷ và đã trả lại không tính. Giả định chờ khách, giữ nhãn lam-ro-voi-khach.
        viec: |
          Trong hàm tạo giao dịch, sau khi khoá lô: nếu bên mua là trading_party và có hạn mức, tính tổng thành tiền các giao dịch confirmed và
          pending_confirm của bên mua trong ngày nghiệp vụ của lô cộng thành tiền giao dịch mới; vượt trần thì từ chối với LIMIT_EXCEEDED (422)
          kèm trần, đã dùng, còn lại. Khoá dòng người tham gia trong lúc kiểm. API trả thông điệp đọc được; màn SCR-08 và SCR-10 hiện lỗi tại ô số lượng.
        tieu_chi_xong:
          - Hạn mức 5.000.000 yên, đã có 4.000.000 yên trong ngày, tạo thêm 1.000.000 yên được nhận (đúng bằng trần là hợp lệ)
          - Cùng ca trên, tạo thêm 1.000.001 yên bị LIMIT_EXCEEDED, thông điệp nêu trần 5.000.000, đã dùng 4.000.000, còn 1.000.000
          - Giao dịch đã huỷ 2.000.000 yên không tính vào tổng đã dùng; kết quả đấu giá chờ xác nhận thì có tính
          - Hai giao dịch 600.000 yên gửi đồng thời khi còn lại 1.000.000 yên thì đúng một cái thành công
          - Bên mua loại intermediary hoặc buyer không bị chặn dù tổng lớn
          - Máy chủ đặt múi giờ UTC, nhập giao dịch lúc 02:31 giờ Nhật ngày D thì tổng tính vào ngày nghiệp vụ D của lô, không rơi sang ngày D trừ 1
        file_cham:
          - supabase/schema.sql (hàm tạo giao dịch phần kiểm hạn mức)
          - src/app/api/trades/route.ts (ánh xạ lỗi LIMIT_EXCEEDED)
          - src/app/(app)/trades/trade-form.tsx (hiện lỗi tại ô số lượng)

      - key: T06-05-ham-huy-giao-dich-hoan-ton-dung
        title: "Hàm huỷ giao dịch hoàn tồn đúng và trả lô về trạng thái đã công khai"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T06-02a-trang-thai-cho-xac-nhan-dau-gia]
        boi_canh: |
          Hàm huỷ giao dịch trong database có bốn lỗi so với thiết kế LAB-4. Một: huỷ xong lô từ sold_out (đã bán hết) về judged (đã thẩm định),
          sau T05-01 lô sẽ kẹt vì chưa công khai lại; phải về published (đã công khai). Hai: sau T06-02a, kết quả đấu giá chờ xác nhận chưa trừ tồn
          mà hàm huỷ vẫn hoàn tồn, tạo tồn ảo. Ba: giao dịch đã có dòng chênh lệch được duyệt vẫn huỷ được, để lại dòng chênh lệch trỏ vào giao dịch
          đã huỷ (gốc B-04). Bốn: trạng thái giao hàng giữ "chờ" sau khi huỷ, nhật ký ghi ngoài hàm và nuốt lỗi (B-20), không có cột người huỷ và
          thời điểm huỷ, mã giao dịch sai kiểu trả 500. Phần màn (nút, hộp thoại) ở T06-06.
        viec: |
          Sửa hàm cancel_trade: chỉ hoàn tồn khi giao dịch đang confirmed; pending_confirm huỷ thì chỉ đổi trạng thái; lô đang sold_out về published
          sau khi hoàn; chặn HAS_DELTA (409) khi đã có dòng chênh lệch; đặt trạng thái giao hàng thành cancelled (thêm giá trị vào ràng buộc, có bước
          quay lại); ghi người huỷ, thời điểm huỷ (now() của database) vào bảng giao dịch; nhật ký trong cùng giao dịch; thông điệp đọc được cho
          REASON_REQUIRED, ALREADY_CANCELLED, HAS_DELIVERY. API: mã giao dịch không đúng dạng trả 404, thân sai kiểu trả 422.
        tieu_chi_xong:
          - Lô 300 kg bán hết bằng một giao dịch 300 kg rồi huỷ thì tồn về 300 kg, lô ở published, tạo giao dịch mới trên lô thành công
          - Lô 300 kg có kết quả đấu giá chờ xác nhận 100 kg, huỷ kết quả đó thì tồn vẫn 300 kg, trạng thái cancelled
          - Giao dịch đã có dòng chênh lệch gọi huỷ nhận 409 HAS_DELTA, tồn lô không đổi
          - Huỷ thành công thì trạng thái giao hàng là cancelled, có người huỷ, thời điểm huỷ theo giờ database và đúng một dòng nhật ký
          - Giả lập lỗi ghi nhật ký thì giao dịch vẫn confirmed, tồn không đổi
          - Gọi API với mã giao dịch "abc" nhận 404; thân thiếu lý do nhận 422 với thông điệp đọc được
          - Chạy bước quay lại migration trên dữ liệu đã có giao dịch cancelled thì bước quay lại báo rõ phải đổi các dòng đó trước, không xoá im lặng
        file_cham:
          - supabase/schema.sql (hàm cancel_trade, ràng buộc delivery_status, cột cancelled_by và cancelled_at của trades)
          - src/app/api/trades/[id]/cancel/route.ts

      - key: T06-06-man-giao-dich-gia-co
        title: "Màn giao dịch gia cố nút huỷ, hộp thoại và nhãn tiếng Nhật"
        labels: [nguon:gia-co, doi:fe]
        lam_sau: [T06-05-ham-huy-giao-dich-hoan-ton-dung, INC-10-hop-thoai-xac-nhan-that, INC-11-man-ket-qua-thuong-gia-co]
        boi_canh: |
          Ba màn SCR-08, SCR-09, SCR-10 (đường dẫn /trades và /seri) dùng chung trang. Nhận xét LAB-3 của giảng viên: form cảnh báo ngay khi nhập đã
          tốt, giữ; thiếu nhãn tiếng Nhật, một kiểu ngày, thông báo thành công. B-18: nút huỷ hiện khi số đã giao bằng 0, nhưng hàm huỷ chặn khi có
          bất kỳ đợt giao nào kể cả đợt trả hàng, nên giao dịch chỉ có một đợt trả hàng vẫn hiện nút, bấm xong mới nhận 409; bảng không biết ngày nào
          đã khoá; hộp thoại huỷ dùng hộp mặc định của trình duyệt (D-12). Thông điệp lỗi tư cách mua gộp 許可 (giấy phép) và 承認 (giấy chấp thuận)
          làm một (D-21). Ô chọn lô chưa lọc theo ngày đang mở. Dùng hộp thoại chung của INC-10 và bảng nhãn chung của INC-11.
        viec: |
          Nút huỷ hiện khi số đợt giao bằng 0 (cột batches của view); dòng thuộc ngày đã khoá thay nút huỷ bằng đường dẫn sang màn yêu cầu điều chỉnh;
          hộp thoại huỷ hiện mã giao dịch, lô, số lượng hoàn và tồn lô trước và sau khi hoàn (với giao dịch chờ xác nhận thì ghi "không hoàn tồn"),
          ô lý do bắt buộc, nút đổi thành "Đang huỷ" và khoá. Ô chọn lô chỉ liệt kê lô thuộc ngày đang mở và đã công khai. Áp định nghĩa xong chung
          cho màn hình (script chép vào thân issue): nhãn Nhật cho cột, nút, trạng thái; một kiểu ngày; thông báo thành công bằng chữ sau tạo, xác nhận,
          huỷ; thông điệp tư cách mua tách rõ thiếu 許可 hay 承認 và hết hạn ngày nào; mã lỗi database không lộ ra màn.
        tieu_chi_xong:
          - Giao dịch chỉ có một đợt trả hàng không còn nút huỷ; giao dịch chưa có đợt nào có nút
          - Lọc sang ngày đã khoá thì dòng không có nút huỷ mà có đường dẫn sang màn điều chỉnh
          - Hộp thoại huỷ hiện tồn lô sau khi hoàn đúng bằng tồn hiện tại cộng số lượng (một ca số cụ thể); với dòng chờ xác nhận hộp ghi "không hoàn tồn"
          - Lý do trống thì nút xác nhận không bấm được; bấm hai lần chỉ gọi API một lần
          - Ô chọn lô không có lô thuộc ngày đã khoá hay lô chưa công khai
          - Bên mua thiếu 承認 nhưng còn 許可 thì thông điệp nói đúng thiếu 承認 và ngày hết hạn; ca ngược lại nói đúng thiếu 許可
          - Mọi tên cột, nút, trạng thái trên ba màn có trong bảng nhãn chung docs/nhan-tieng-nhat.md; không còn mã thô như aitai, seri, confirmed
          - Tạo giao dịch thành công có thông báo bằng chữ kèm mã giao dịch; mọi ngày cùng định dạng YYYY/MM/DD theo giờ Nhật
        file_cham:
          - src/app/(app)/trades/trade-form.tsx
          - src/app/(app)/trades/trade-table.tsx
          - src/app/(app)/trades/trade-page.tsx
          - src/components/confirm-dialog.tsx (dùng lại từ INC-10)
          - src/app/api/trades/route.ts (tách thông điệp 許可 / 承認, lọc lô theo ngày mở)
          - docs/nhan-tieng-nhat.md (bổ sung nhãn giao dịch, trong repo này)

      - key: T06-07-api-tao-giao-dich-gia-co
        title: "API tạo giao dịch gia cố nhật ký, chống gửi trùng và kiểm dữ liệu vào"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T06-04-chan-han-muc-luc-tao-giao-dich]
        boi_canh: |
          Thiết kế LAB-4 ghi sáu chỗ API tạo giao dịch lệch: nhật ký ghi sau khi tạo và lỗi bị nuốt (B-20); gửi lại sau lỗi mạng tạo bản thứ hai (D-15);
          số lượng quá 2 chữ số thập phân bị database tự làm tròn không báo; hạn thanh toán truyền thẳng không kiểm; thân yêu cầu sai kiểu trả 500;
          ba mã lỗi trả về trần không có câu đọc được. Mã phiên đấu giá gõ tay tự do nên một phiên vỡ thành nhiều mảnh; bản ghi phiên riêng là câu hỏi
          khách (X04-06), ở đây chỉ ép định dạng. Bảng giao dịch chưa phân trang, nhiều ngày thì nặng. Issue cuối trong chuỗi sửa hàm tạo giao dịch.
        viec: |
          Chuyển ghi nhật ký vào trong hàm tạo giao dịch (cùng giao dịch, lỗi thì huỷ cả) và bỏ lời gọi ở lớp ứng dụng. Nhận tiêu đề Idempotency-Key
          (dùng bảng của T05-03): cùng khoá trong 24 giờ trả lại giao dịch đã tạo. Ở API: số lượng quá 2 chữ số thập phân trả 422; hạn thanh toán phải là
          ngày hợp lệ không trước ngày nghiệp vụ; thân sai kiểu trả 422; mã phiên đấu giá theo dạng SERI-MMDD-X với MMDD khớp ngày nghiệp vụ của lô;
          LOT_NOT_FOUND, BUSINESS_DAY_LOCKED, BUYER_NOT_FOUND kèm câu đọc được. API danh sách phân trang 50 dòng, trả tổng số; bảng có nút trang.
        tieu_chi_xong:
          - Giả lập lỗi ghi nhật ký thì giao dịch không được tạo, tồn lô không đổi
          - Gửi hai lần cùng Idempotency-Key trong 1 phút chỉ có một giao dịch, lần hai trả cùng mã giao dịch
          - Số lượng 10.555 bị 422 nêu tối đa 2 chữ số thập phân; 10.55 được nhận
          - Hạn thanh toán trước ngày nghiệp vụ hoặc không phải ngày bị 422
          - Thân yêu cầu có số lượng là chuỗi chữ bị 422, không phải 500
          - Mã phiên seri-0923-a hoặc SERI-0924-A cho lô ngày 23/09 bị 422; SERI-0923-A được nhận
          - Dữ liệu 120 giao dịch thì trang một có 50 dòng, trang ba có 20 dòng, tổng số hiện 120
        file_cham:
          - supabase/schema.sql (hàm tạo giao dịch phần nhật ký)
          - src/app/api/trades/route.ts
          - src/lib/api.ts (xử lý thân sai kiểu)
          - src/app/(app)/trades/trade-page.tsx (nút trang)

  - key: E-T08
    title: "Giao nhận hàng nhiều đợt: ghi đợt, hoàn tất đúng số lượng, trần số đợt, mở lại sau hoàn tất"
    labels: []
    body: |
      Epic gom việc để chuỗi giao hàng nhiều đợt chạy đúng số lượng, thay vì chỉ cộng dồn như prototype.
      Hai quyết định tiền đề áp cho mọi issue (PREMISE.md Bảng 1): D-14 huỷ một phần được trừ khỏi phần phải giao, xử lý như trả hàng;
      D-40 chỉ hoàn tất khi tổng thực giao bằng số lượng giao dịch, giao vượt dừng ở trạng thái ngoại lệ, trả lại và huỷ một phần đều trừ.
      Giả định Q8 · D-30 (PREMISE Bảng 2): trần số đợt cấu hình được, mặc định 3, chỉ đợt cuối tính vào quyết toán và thưởng; khách chưa xác nhận.
      Nhận xét LAB-3 cho cả lớp: nhiều bài cho hoàn tất dù số lượng chưa khớp, nên issue hoàn tất phải có ba ca thử giao thiếu, giao vượt, trả lại.
      Chú giải mã dùng trong epic: SCR-14 màn theo dõi trạng thái giao hàng, SCR-15 màn ghi đợt giao và xác nhận hoàn tất, SCR-16 lịch sử đợt giao,
      SCR-17 màn đối soát ngày, SCR-12 màn yêu cầu điều chỉnh (chỉ sửa được số lượng và đơn giá, không sửa được trạng thái giao hàng).
      "Ngày nghiệp vụ" (業務日) là ngày làm việc của chợ tính theo giờ Nhật; ngày đã khoá thì mọi sửa đổi lô, giao dịch, đợt giao đều bị database từ chối.
      Giả định của đội trong epic (chờ khách, câu hỏi ở X-04): mở lại giao dịch đã hoàn tất chỉ cần một người đối soát kèm lý do (T08-05);
      loại ngoại lệ "điều chỉnh" (correction) được tính vào số đã giao như đợt thường (T08-01).
      Ngoài phạm vi: mở lại ngày nghiệp vụ đã khoá (epic T-09); báo cáo giao hàng (T-14).
      Thứ tự làm: T08-01 → T08-02 → T08-03 → T08-04 → T08-05 → T08-06 → T08-07.
    issues:
      - key: T08-01-cong-thuc-so-con-phai-giao
        title: "Sửa cách tính số còn phải giao khi có huỷ một phần và trả lại"
        labels: [nguon:chenh-lech, doi:be]
        boi_canh: |
          Prototype tính số đã giao bằng cách cộng mọi đợt trừ đợt trả lại, nên đợt "huỷ một phần" (bên mua không lấy phần đó nữa) cũng bị cộng
          như hàng đã giao (D-14). Ví dụ đơn 100 kg, huỷ 20, giao 80: prototype ghi đã giao 100 và cho hoàn tất; số đúng là đã giao 80 trên nghĩa vụ 80.
          PREMISE Q3 · D-14 chốt: huỷ một phần trừ khỏi phần phải giao; trả lại cộng ngược vào phần còn phải giao để giao bù.
          Đợt 0 kg hiện vẫn lọt và làm tăng số đợt (B-07). Thiết kế LAB-4 thêm loại ngoại lệ thứ năm "điều chỉnh" (correction, đợt ghi bù sau khi
          ghi nhầm) nhưng chưa nói cộng hay trừ; đội giả định tính như đợt thường, bắt ghi chú. Màn giao hàng và màn đối soát ngày đọc cùng một
          bảng tính này (view, bảng tính sẵn trong database) nên sửa một chỗ là đủ.
        viec: |
          Sửa bảng tính số dư giao hàng (view v_trade_balance): thêm cột số đã huỷ và số đã trả lại; số đã giao cộng đợt thường, thiếu, thừa và
          điều chỉnh; phần phải giao = số lượng giao dịch + chênh lệch đã duyệt − số đã huỷ; phần còn giao = phần phải giao − số đã giao + số đã trả lại;
          số đợt chỉ đếm đợt có số lượng lớn hơn 0. Thêm ràng buộc số lượng đợt giao lớn hơn 0 và cho phép giá trị "điều chỉnh" ở cột loại ngoại lệ.
          Màn giao hàng không được tự tính lại ở trình duyệt.
        tieu_chi_xong:
          - Đơn 100 kg, ghi huỷ một phần 20 rồi giao 80 thì số đã giao là 80, phần còn giao là 0, số đã huỷ là 20
          - Đơn 100 kg, giao 100 rồi ghi trả lại 30 thì phần còn giao là 30, số đã giao vẫn là 100, số đã trả lại là 30
          - Đơn 100 kg có điều chỉnh đã duyệt tăng 10 thì phần phải giao là 110 dù chưa giao thêm
          - Đơn 100 kg, giao 90 rồi ghi đợt loại điều chỉnh 10 kèm ghi chú thì số đã giao là 100, phần còn giao là 0
          - Ghi đợt 0 kg bị database từ chối; đợt 0 kg trong dữ liệu mẫu cũ (nếu có) không còn được đếm vào số đợt
          - Màn đối soát ngày (SCR-17) và màn giao hàng (SCR-14) hiện cùng một số còn giao cho cùng một giao dịch
        file_cham:
          - supabase/schema.sql (view v_trade_balance, ràng buộc deliveries.quantity lớn hơn 0, giá trị correction của exception_type)

      - key: T08-02-ghi-dot-giao-an-toan-khi-dong-thoi
        title: "Ghi đợt giao an toàn khi hai người cùng thao tác"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T08-01-cong-thuc-so-con-phai-giao]
        boi_canh: |
          Prototype ghi đợt giao bằng ba lệnh rời, không gói trong một giao dịch database: lỗi ở lệnh sau thì đợt đã ghi mà trạng thái giao dịch không đổi;
          hai người ghi cùng lúc có thể trùng số đợt vì số thứ tự lấy bằng "số lớn nhất cộng một" (cùng họ với D-41); lỗi ghi nhật ký bị nuốt;
          ngoại lệ (thiếu, thừa, trả lại, huỷ một phần, điều chỉnh) không bắt ghi chú nên không tra được lý do khi đối soát.
          Đợt giao thuộc ngày nghiệp vụ (業務日, ngày làm việc của chợ theo giờ Nhật) của giao dịch; mốc giờ ghi phải hiện theo giờ Nhật (D-25).
        viec: |
          Tạo hàm database record_delivery (hàm chạy trong database, một giao dịch): khoá dòng giao dịch, kiểm giao dịch đã xác nhận và chưa hoàn tất,
          kiểm số lượng lớn hơn 0 và không quá 2 chữ số thập phân, bắt ghi chú khi có loại ngoại lệ, cấp số thứ tự đợt ngay trong hàm,
          cập nhật trạng thái giao hàng (thường → đang giao; có ngoại lệ → ngoại lệ), ghi nhật ký cùng giao dịch; lỗi bất kỳ thì huỷ cả.
          API ghi đợt chỉ gọi hàm này và nhận khoá chống gửi trùng (Idempotency-Key, mã do màn sinh cho mỗi lần bấm) lưu ở cột idem_key;
          gửi lại cùng khoá trả về đợt đã ghi. Lỗi database được đổi thành thông điệp có nghĩa, không lộ lỗi thô.
        tieu_chi_xong:
          - Hai yêu cầu ghi đợt cùng lúc trên một giao dịch tạo đúng hai đợt với số thứ tự 1 và 2, không trùng, không lỗi 409
          - Gửi hai lần cùng một khoá chống trùng chỉ tạo một đợt; lần hai trả về đợt đã có
          - Ghi đợt loại ngoại lệ (kể cả loại điều chỉnh) mà bỏ trống ghi chú bị hàm database từ chối, không chỉ ở màn
          - Số lượng 0, số âm, hoặc 1,234 (3 chữ số thập phân) đều bị từ chối với mã lỗi rõ
          - Giả lập lỗi ghi nhật ký thì không có đợt nào được ghi và trạng thái giao dịch không đổi
          - Ghi đợt trên giao dịch thuộc ngày nghiệp vụ đã khoá bị từ chối, thông báo nêu ngày đã khoá
          - Máy chủ đặt múi giờ UTC, ghi đợt lúc 02:31 giờ Nhật thì mốc giờ hiện 02:31 cùng ngày lịch Nhật; ghi lúc 01:59 giờ Nhật hiện 01:59 cùng ngày lịch Nhật; đợt luôn gắn với ngày nghiệp vụ của giao dịch
        file_cham:
          - supabase/schema.sql (hàm record_delivery mới, cột deliveries.idem_key)
          - src/app/api/deliveries/route.ts

      - key: T08-03-hoan-tat-giao-nhan-khi-khop-so-luong
        title: "Chỉ cho hoàn tất giao nhận khi số đã giao khớp số lượng"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T08-01-cong-thuc-so-con-phai-giao]
        boi_canh: |
          PREMISE D-40: hoàn tất chỉ khi tổng thực giao bằng số lượng giao dịch (sau điều chỉnh đã duyệt); giao thiếu thì chưa hoàn tất;
          giao vượt dừng ở trạng thái ngoại lệ dù có lý do; trả lại và huỷ một phần đều trừ. Nhận xét LAB-3 cho cả lớp: nhiều bài cho hoàn tất dù số chưa khớp.
          Prototype xác nhận hoàn tất bằng hai lệnh rời, không khoá dòng, cập nhật không điều kiện, lỗi nhật ký bị nuốt, và luôn báo "đã giao thừa"
          kể cả khi còn thiếu. Hệ thống không được tự kết luận đã giao xong; người bấm mới chuyển trạng thái.
        viec: |
          Tạo hàm database complete_delivery chạy trong một giao dịch: khoá dòng giao dịch, đọc phần còn giao từ bảng tính số dư (T08-01),
          chỉ cho hoàn tất khi phần còn giao bằng 0 và trạng thái đang là "đang giao" hoặc "ngoại lệ"; từ chối với thông điệp riêng cho ca còn thiếu
          (nêu còn thiếu bao nhiêu) và ca giao vượt (nêu vượt bao nhiêu, phải ghi đợt trả lại hoặc mở yêu cầu điều chỉnh SCR-12);
          bắt ghi chú khi giao dịch đang ở trạng thái ngoại lệ; ghi nhật ký cùng giao dịch; giờ hoàn tất lấy từ database.
          API hoàn tất chỉ gọi hàm này; mã giao dịch sai dạng trả 404 thay vì lỗi 500.
        tieu_chi_xong:
          - Ca giao thiếu, đơn 100 kg đã giao 90, bấm hoàn tất bị từ chối, thông báo nêu còn thiếu 10 kg
          - Ca giao vượt, đơn 100 kg đã giao 110 (đợt thừa có lý do), bấm hoàn tất bị từ chối, giao dịch vẫn ở trạng thái ngoại lệ, thông báo nêu vượt 10 kg
          - Ca trả lại, đơn 100 kg giao 100 rồi trả lại 30, bấm hoàn tất bị từ chối vì còn giao 30; giao bù 30 rồi bấm lại thì hoàn tất
          - Ca huỷ một phần, đơn 100 kg huỷ 20 giao 80, bấm hoàn tất thành công, số đã giao ghi 80
          - Giao dịch đang ở trạng thái ngoại lệ mà bỏ trống ghi chú thì hàm database từ chối
          - Hai yêu cầu hoàn tất cùng lúc chỉ ghi một dòng nhật ký, lần sau báo đã hoàn tất
          - Mã giao dịch không đúng dạng trả 404, không trả lỗi 500
        file_cham:
          - supabase/schema.sql (hàm complete_delivery mới)
          - src/app/api/deliveries/[tradeId]/complete/route.ts

      - key: T08-04-tran-so-dot-giao-mac-dinh-3
        title: "Giới hạn số đợt giao, mặc định 3, có đường nâng trần"
        labels: [nguon:moi, doi:be, constraint:kanno-shoreikin, lam-ro-voi-khach]
        lam_sau: [T08-02-ghi-dot-giao-an-toan-khi-dong-thoi]
        boi_canh: |
          Đề yêu cầu bên làm tự đề xuất trần số lần chia đợt, ai được xác nhận và thời điểm phản ánh vào quyết toán và thưởng (D-30).
          PREMISE Q8 · D-30 chọn trần mặc định 3; thiết kế LAB-4 cho vai đối soát nâng trần tới tối đa 20 kèm lý do, trần lưu trong bảng cấu hình, không ghi cứng.
          Thời điểm phản ánh: chỉ lúc xác nhận hoàn tất (đợt cuối) giao dịch mới được coi là "đã giao xong" ở đối soát ngày và đủ điều kiện xét thưởng
          thanh toán đủ hạn (完納奨励金, tiền thưởng khi bên mua trả đủ và đúng hạn); tổng tiền ngày vẫn tính theo giao dịch đã xác nhận, không đổi theo đợt.
          Đây là giả định, khách chưa xác nhận (câu hỏi D-30 ở X-04). Prototype không có trần nào.
        viec: |
          Tạo bảng cấu hình chính sách giao hàng (delivery_policy) với trần mặc định 3 và trần tối đa khi nâng 20, kèm dữ liệu mẫu.
          Hàm ghi đợt (T08-02) kiểm số đợt hiện có so với trần của giao dịch (trần riêng nếu đã nâng, không thì trần mặc định); vượt thì từ chối
          với mã lỗi BATCH_LIMIT_EXCEEDED và thông điệp nêu đã ghi đủ mấy đợt. Thêm API nâng trần cho một giao dịch: chỉ vai đối soát, bắt lý do,
          không quá trần tối đa, ghi nhật ký. Ghi trong tài liệu API rằng ô "chưa giao xong", ô "ngoại lệ" của đối soát và điều kiện thưởng chỉ đọc
          trạng thái hoàn tất, không đọc từng đợt.
        tieu_chi_xong:
          - Giao dịch đã có 3 đợt, ghi đợt thứ 4 bị từ chối với mã BATCH_LIMIT_EXCEEDED; đổi trần mặc định thành 5 trong bảng cấu hình thì ghi được
          - Vai đối soát nâng trần giao dịch lên 6 kèm lý do thì ghi được tới đợt 6; nâng lên 21 (quá trần tối đa 20) bị từ chối
          - Vai giao hàng gọi API nâng trần nhận lỗi quyền; nâng trần không có lý do bị từ chối
          - Giao dịch có 2 đợt chưa hoàn tất vẫn đếm vào "chưa giao xong" của đối soát ngày; sau khi hoàn tất đợt cuối mới ra khỏi ô đó; tổng tiền ngày không đổi giữa hai lúc
          - Nhật ký có dòng nâng trần ghi trần cũ, trần mới, lý do, người nâng
        file_cham:
          - supabase/schema.sql (bảng delivery_policy mới, cột trades.batch_limit, kiểm trần trong hàm record_delivery)
          - src/app/api/deliveries/[tradeId]/batch-limit/route.ts (mới)

      - key: T08-05-mo-lai-giao-dich-da-hoan-tat
        title: "Mở lại giao dịch đã hoàn tất để ghi trả hàng"
        labels: [nguon:moi, doi:be, lam-ro-voi-khach]
        lam_sau: [T08-03-hoan-tat-giao-nhan-khi-khop-so-luong]
        boi_canh: |
          Trạng thái "hoàn tất" trong prototype là ngõ cụt: không ghi thêm được đợt nào, kể cả trả lại, và yêu cầu điều chỉnh (SCR-12) chỉ sửa được
          số lượng và đơn giá, không sửa được trạng thái giao hàng. Công thức mới ở T08-01 chỉ có ích ở ca trả lại sau hoàn tất nếu có đường mở lại.
          Thiết kế LAB-4 chỉ nêu quyền đối soát, lý do bắt buộc, ghi nhật ký, chặn ngày đã khoá. Giả định của đội: một người đối soát mở lại được,
          không cần người thứ hai duyệt, được mở lại nhiều lần, mỗi lần một dòng nhật ký.
          Câu hỏi gửi khách (ở X-04): mở lại giao dịch đã hoàn tất cần một người đối soát hay hai người như mở lại ngày đã khoá?
        viec: |
          Tạo hàm database reopen_delivery và API POST /api/deliveries/[tradeId]/reopen: chỉ vai đối soát; chỉ nhận giao dịch đang "hoàn tất";
          bắt lý do; đưa trạng thái về "đang giao", giữ nguyên mọi đợt đã ghi; ghi nhật ký loại delivery.reopen với trạng thái trước và sau,
          giờ hoàn tất cũ; ngày nghiệp vụ đã khoá thì từ chối với thông báo nêu ngày. Trên màn giao hàng thêm nút "Mở lại" chỉ vai đối soát thấy,
          hộp xác nhận hiện mã giao dịch, số đã giao, ô lý do bắt buộc.
        tieu_chi_xong:
          - Giao dịch đã hoàn tất, vai đối soát mở lại kèm lý do thì trạng thái về đang giao, các đợt cũ còn nguyên, nhật ký có dòng delivery.reopen
          - Sau khi mở lại, ghi được đợt trả lại 30 kg và phần còn giao hiện 30; hoàn tất lại rồi mở lại lần hai vẫn được, nhật ký có hai dòng mở lại
          - Hai yêu cầu mở lại cùng lúc chỉ một thành công, lần kia báo giao dịch không ở trạng thái hoàn tất
          - Vai giao hàng và vai bán buôn không thấy nút, gọi thẳng API nhận lỗi quyền
          - Bỏ trống lý do thì bị từ chối ở hàm database; mở lại giao dịch đang ở trạng thái đang giao bị từ chối
          - Giao dịch thuộc ngày nghiệp vụ đã khoá thì mở lại bị từ chối, thông báo nêu ngày đã khoá; máy chủ đặt múi giờ UTC, gọi lúc 02:31 giờ Nhật vẫn xét đúng ngày theo giờ Nhật
        file_cham:
          - supabase/schema.sql (hàm reopen_delivery mới)
          - src/app/api/deliveries/[tradeId]/reopen/route.ts (mới)
          - src/app/(app)/deliveries/page.tsx (nút Mở lại)

      - key: T08-06-hop-thoai-va-khoa-nut-man-giao-hang
        title: "Hộp thoại xác nhận thật và khoá nút trên màn giao hàng"
        labels: [nguon:gia-co, doi:fe]
        lam_sau: [T08-04-tran-so-dot-giao-mac-dinh-3, T08-05-mo-lai-giao-dich-da-hoan-tat, INC-10-hop-thoai-xac-nhan-that]
        boi_canh: |
          Màn SCR-15 dùng hộp thoại mặc định của trình duyệt cho ghi đợt và hoàn tất (D-12), không hiện số liệu, không có chỗ ghi chú;
          nút hoàn tất vẫn bấm được khi chưa có đợt nào, khi mất mạng, hoặc khi ngày đã khoá, rồi mới nhận lỗi. Màn dùng ngoài trời, tay ướt, nút phải đủ to.
          Quy tắc chặn đã nằm ở T08-02 đến T08-05; issue này chỉ lo thao tác và hộp thoại, dùng lại thành phần hộp thoại chung do INC-10 tạo.
        viec: |
          Thay hộp thoại trình duyệt bằng hộp thoại của ứng dụng cho ghi đợt, hoàn tất, mở lại: khi mở, đọc lại từ máy chủ mã giao dịch, số đã giao,
          phần còn giao, số đợt trên trần; ô ghi chú bắt buộc khi chọn loại ngoại lệ; ô số lượng gợi ý theo loại ngoại lệ (trả lại gợi ý số đã giao,
          thiếu gợi ý phần còn giao). Khoá nút ghi và hoàn tất khi ngày đã khoá (kèm lý do), khi mất mạng, khi chưa có đợt nào, và khi đang gửi.
          Nút thao tác tối thiểu 44 x 44 điểm ảnh.
        tieu_chi_xong:
          - Hộp thoại hoàn tất hiện phần còn giao đọc lại từ máy chủ lúc mở, không phải số đang hiện trên bảng
          - Chọn loại ngoại lệ mà bỏ trống ghi chú thì lỗi hiện tại ô, không gửi được
          - Giao dịch chưa có đợt nào thì nút Hoàn tất bị khoá; ngày đã khoá thì nút Ghi và Hoàn tất bị khoá kèm dòng nêu ngày đã khoá
          - Tắt mạng (chế độ offline của trình duyệt) thì nút ghi bị khoá, bật lại thì mở
          - Bấm ghi đợt hai lần liên tiếp chỉ gọi API một lần (nút đổi thành Đang lưu)
          - Mọi nút thao tác trên màn rộng 390 px đo được tối thiểu 44 x 44 điểm ảnh
        file_cham:
          - src/app/(app)/deliveries/page.tsx
          - src/components/delivery-form.tsx (dự kiến)

      - key: T08-07-loc-lich-su-canh-bao-man-giao-hang
        title: "Bộ lọc, lịch sử đợt và cảnh báo trên màn giao hàng"
        labels: [nguon:gia-co, doi:fe]
        lam_sau: [T08-06-hop-thoai-va-khoa-nut-man-giao-hang]
        boi_canh: |
          Màn SCR-14 giữ bộ lọc ngày và "chỉ chưa giao" trong bộ nhớ trang nên chuyển màn rồi quay lại phải chọn lại; danh sách không phân trang,
          không tự làm mới; đổi ngày nhanh có thể hiện nhầm kết quả ngày cũ. Lịch sử đợt (SCR-16) thiếu cột luỹ kế, còn lại, đóng góp, người ghi,
          không cảnh báo khi số đợt gần trần hoặc khi số đợt trên bảng lệch số đợt thật, không hiện ghi chú khi đợt có ghi chú mà thiếu loại ngoại lệ.
          Dữ liệu cũ có thể vượt trần sau khi hạ mặc định xuống 3, phải hiện đủ, không ẩn.
        viec: |
          Đẩy bộ lọc ngày và "chỉ chưa giao" lên đường dẫn (?day=&only=) và đọc lại khi mở trang; phân trang 50 dòng; tự làm mới mỗi 60 giây giữ
          dữ liệu cũ khi tải lỗi; huỷ yêu cầu tải cũ khi đổi ngày (AbortController, cơ chế huỷ yêu cầu đang chạy của trình duyệt). Lịch sử đợt thêm cột
          luỹ kế, còn lại sau đợt, đóng góp (cộng, trừ, hay 0), người ghi; tô đỏ đợt trả lại và huỷ một phần, tô riêng đợt điều chỉnh; hiện ghi chú kể cả
          khi thiếu loại. Cảnh báo "n/trần đợt" khi còn một đợt, cảnh báo đỏ khi vượt trần, cảnh báo khi trạng thái là "chờ" mà đã có đợt.
          Thêm link từ mã giao dịch sang màn đối soát đúng ngày. Vùng mở rộng giữ nguyên sau khi tự làm mới.
        tieu_chi_xong:
          - Chọn ngày và bật "chỉ chưa giao", sang màn đối soát rồi bấm Back, bộ lọc còn nguyên và đường dẫn chứa ?day=&only=
          - Ngày có 120 giao dịch hiện 50 dòng trang 1; đổi nhanh từ ngày 24 sang 25 thì bảng cuối cùng là của ngày 25
          - Đợi 60 giây, bảng tự cập nhật đợt mới ghi ở tab khác; vùng mở rộng đang mở vẫn mở
          - Giao dịch có 3 đợt hiện đúng luỹ kế sau từng đợt, dòng trả lại tô đỏ với đóng góp trừ, dòng điều chỉnh tô riêng
          - Giao dịch cũ có 5 đợt với trần 3 vẫn hiện đủ 5 đợt kèm cảnh báo vượt trần; giao dịch 2 đợt trần 3 hiện "2/3 đợt"
          - Giao dịch trạng thái chờ mà có 1 đợt hiện cảnh báo lệch; màn rộng 390 px không cuộn ngang
        file_cham:
          - src/app/(app)/deliveries/page.tsx
          - src/lib/delivery-types.ts (dự kiến)

  - key: E-T09
    title: "Đối soát ngày, khoá ngày nghiệp vụ, tranh chấp và lịch chợ"
    labels: []
    body: |
      Epic gom việc để ngày nghiệp vụ (業務日, ngày làm việc của chợ theo giờ Nhật) được mở theo lịch chợ, đối soát đúng số,
      khoá có lý do và có vết, còn tranh chấp vẫn ghi được sau khoá.
      Tiền đề: PREMISE Bảng 1 (Q4 · D-10 chặn mềm khi khoá còn tranh chấp; D-43 bảng lịch chợ, job mở và đóng ngày theo lịch 02:00–10:00 giờ Nhật,
      ngày nghỉ không tạo giao dịch), Bảng 3 (B-16 cho ghi tranh chấp sau khoá; D-25 múi giờ Asia/Tokyo cố định). D-35: tổng tiền ngày phải cộng cả
      dòng chênh lệch đã duyệt. Ngày nghiệp vụ giữ hai trạng thái mở và đã khoá; "đóng" lúc 10:00 chỉ là chặn tạo giao dịch theo giờ của lịch chợ,
      không phải trạng thái mới.
      Sự thật đã kiểm trên prototype: sửa lô, giao dịch, đợt giao thuộc ngày đã khoá đều bị bộ chặn tự động (trigger) của database từ chối;
      bảng lịch chợ chưa tồn tại, ngày nghiệp vụ đang chọn tay; chặn ghi tranh chấp sau khoá chỉ nằm ở màn hình; số tiền chênh lệch lưu nguyên yên,
      đã làm tròn về 0 lúc duyệt điều chỉnh.
      Mọi issue chạm ngày nghiệp vụ có ca thử "máy chủ đặt múi giờ UTC, nhập lúc 02:31 giờ Nhật".
      Chú giải mã: SCR-17 màn đối soát ngày, SCR-18 màn khoá ngày, SCR-19 bảng tranh chấp, SCR-12 màn yêu cầu điều chỉnh; 休市日 là ngày nghỉ chợ;
      締め再開 là mở lại ngày đã khoá.
      Ngoài phạm vi LAB-5: mở lại ngày đã khoá (締め再開) cần màn riêng và người thứ hai duyệt, chưa có thiết kế chi tiết.
      Câu hỏi gửi khách (ở X-04): khi khoá nhầm ngày, khách muốn có thao tác mở lại ngày có hai người duyệt, hay mọi sửa đổi đều đi qua
      yêu cầu điều chỉnh từng giao dịch? Thông báo tranh chấp thuộc T-15/T-16.
      Giả định (chờ khách, câu hỏi ở X-04): khoá ngày khi còn tranh chấp mở thì chặn mềm, cho khoá kèm lý do (D-10, T09-03); chưa làm thao tác mở lại ngày đã khoá ở giai đoạn này (D-46).
      Thứ tự làm: T09-01 → T09-02; T09-03 → T09-04 → T09-06 → T09-07 → T09-08 (bốn issue cuối cùng sửa một trang, làm lần lượt); T09-05 trước T09-06.
    issues:
      - key: T09-01-bang-lich-cho-va-man-quan-tri
        title: "Bảng lịch chợ và màn quản trị lịch theo tháng"
        labels: [nguon:moi, doi:fe]
        boi_canh: |
          Review LAB-4 (PREMISE D-43): lịch chợ mới chỉ có tên bảng, chưa có cột; prototype chưa có bảng này, ngày nghiệp vụ đang chọn tay.
          Lịch chợ là căn cứ để mở ngày nghiệp vụ tự động và chặn tạo giao dịch ngoài giờ hoặc vào ngày nghỉ chợ (休市日) ở T09-02.
          Mọi giờ trong lịch tính theo giờ Nhật (D-25); mặc định mở 02:00, đóng 10:00. Lớp nặng nhất là màn lưới tháng; bảng và API đi kèm.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: T09-01.1-bang-lich-cho-va-api rồi T09-01.2-man-luoi-thang-lich-cho.
          Bối cảnh ở trên dùng chung cho hai issue con; tiêu chí xong của từng phần nằm ở issue con.
        tieu_chi_xong:
          - Hai issue con đã đóng, mọi tiêu chí xong của chúng đạt trên cùng một bản deploy
        file_cham:
          - supabase/schema.sql (bảng market_calendar mới)
          - src/app/api/settlement/calendar/route.ts (mới)
          - src/app/(app)/settlement/calendar/page.tsx (mới, dự kiến)
          - src/lib/roles.ts (mục menu, dự kiến)
        con:
          - key: T09-01.1-bang-lich-cho-va-api
            title: "Bảng lịch chợ và API đọc theo tháng, ghi một ngày, tạo lịch mặc định"
            labels: [nguon:moi, doi:be]
            boi_canh: |
              Issue con của T09-01-bang-lich-cho-va-man-quan-tri; đọc bối cảnh ở issue cha.
            viec: |
              Migration (có bước quay lại) tạo bảng market_calendar: ngày (duy nhất), loại ngày (mở / nghỉ), giờ mở, giờ đóng, ghi chú, người sửa, thời điểm sửa; ràng buộc giờ mở nhỏ hơn giờ đóng. API đọc theo tháng, ghi một ngày, và tạo lịch mặc định cho một tháng (thứ Hai đến thứ Bảy mở, Chủ nhật nghỉ); chỉ vai quản trị hệ thống và vai đối soát ghi được; mỗi lần ghi một dòng nhật ký giá trị trước và sau; không cho đổi ngày đã khoá, không cho đổi sang nghỉ ngày đã có giao dịch. Dữ liệu mẫu có lịch 2 tháng.
            tieu_chi_xong:
              - "Tạo lịch mặc định tháng 2026-11 tạo đúng 30 dòng, Chủ nhật là nghỉ; bấm lại lần hai không tạo trùng"
              - "Đổi một ngày đã có 3 giao dịch sang nghỉ bị từ chối, thông báo nêu ngày đã có giao dịch; đổi ngày đã khoá bị từ chối"
              - "Chạy bước quay lại migration thì bảng biến mất, bảng ngày nghiệp vụ không đổi"
              - "API ghi một ngày có giờ mở 10:00 và giờ đóng 02:00 bị từ chối"
              - "Vai không phải quản trị hệ thống hay đối soát gọi API ghi nhận lỗi quyền; mỗi lần ghi hợp lệ có một dòng nhật ký giá trị trước và sau"
            file_cham:
              - "supabase/schema.sql (bảng market_calendar mới)"
              - "src/app/api/settlement/calendar/route.ts (mới)"
          - key: T09-01.2-man-luoi-thang-lich-cho
            title: "Màn lưới tháng quản trị lịch chợ trong khu đối soát"
            labels: [nguon:moi, doi:fe]
            lam_sau: [T09-01.1-bang-lich-cho-va-api]
            boi_canh: |
              Issue con của T09-01-bang-lich-cho-va-man-quan-tri; đọc bối cảnh ở issue cha.
            viec: |
              Màn lưới tháng trong khu đối soát: mỗi ô hiện loại ngày, giờ, dấu đã khoá; bấm ô mở hộp sửa; nút tạo lịch mặc định; tháng nằm trên đường dẫn (?month=). Thêm mục menu. Gọi các API của T09-01.1.
            tieu_chi_xong:
              - "Nhập giờ mở 10:00 và giờ đóng 02:00 thì lỗi hiện ngay tại ô và API cũng từ chối"
              - "Vai bán buôn gõ thẳng đường dẫn bị chuyển về trang chính, gọi API ghi nhận lỗi quyền"
              - "Bấm Back sau khi đổi tháng thì quay đúng tháng trước đó; lưới tháng dùng được trên màn 390 px, không cuộn ngang"
            file_cham:
              - "src/app/(app)/settlement/calendar/page.tsx (mới, dự kiến)"
              - "src/lib/roles.ts (mục menu, dự kiến)"

      - key: T09-02-tu-mo-ngay-theo-lich-va-chan-ngoai-gio
        title: "Tự mở ngày nghiệp vụ theo lịch và chặn giao dịch ngoài giờ chợ"
        labels: [nguon:moi, doi:be]
        lam_sau: [T09-01-bang-lich-cho-va-man-quan-tri]
        boi_canh: |
          PREMISE D-43 và D-25: cửa sổ giao dịch 02:00 đến 10:00 giờ Nhật, tuần 6 ngày, trừ ngày nghỉ chợ (休市日). Prototype không có job nào,
          ngày nghiệp vụ (業務日) được tạo tay. Nhận xét LAB-3 cho cả lớp: nhiều bài lệch ngày nghiệp vụ vì tính theo giờ máy.
          Ngày nghiệp vụ giữ hai trạng thái mở và đã khoá. Ngày nghỉ chợ vẫn có dòng ngày nghiệp vụ để người đối soát khoá được, giữ mốc thời gian liên tục;
          sau giờ đóng, tạo giao dịch bị từ chối theo giờ của lịch, còn ghi đợt giao và đối soát vẫn được. Job chạy bằng pg_cron (bộ hẹn giờ trong database)
          hoặc tác vụ hẹn giờ của nền tảng; chọn lúc triển khai, ghi vào tài liệu.
        viec: |
          Tạo hàm database open_business_days_by_calendar: tới giờ mở của ngày trong lịch (kể cả ngày nghỉ) thì tạo dòng ngày nghiệp vụ trạng thái mở nếu chưa có,
          ghi nhật ký người thực hiện là "hệ thống"; chạy lại không tạo trùng. Đặt job chạy mỗi 5 phút theo giờ Nhật (giờ mở thật có thể trễ tối đa 5 phút).
          Hàm tạo giao dịch kiểm theo lịch chợ: ngày loại nghỉ thì từ chối với mã lỗi nêu ngày nghỉ; ngoài khung giờ mở–đóng theo giờ Nhật thì từ chối với mã lỗi
          nêu khung giờ; ngày chưa có dòng mở thì từ chối. Mọi phép tính ngày giờ dùng múi giờ Asia/Tokyo tường minh. Thêm biến môi trường cho bản demo
          bỏ kiểm khung giờ (không bỏ kiểm ngày nghỉ), mặc định tắt, ghi trong tài liệu demo.
        tieu_chi_xong:
          - Đặt lịch ngày mai mở 02:00; job thật tạo dòng ngày nghiệp vụ trong vòng 5 phút sau 02:00 giờ Nhật; chạy hàm thêm 3 lần không tạo trùng
          - Ngày loại nghỉ vẫn có dòng ngày nghiệp vụ; tạo giao dịch vào ngày đó bị từ chối với mã lỗi nêu ngày nghỉ chợ; người đối soát khoá được ngày đó
          - Ngày nghỉ chưa khoá thì chốt kỳ thưởng tháng đó bị chặn như ngày thường (INC-08b), khoá xong thì chốt được
          - Máy chủ đặt múi giờ UTC, tạo giao dịch lúc 02:31 giờ Nhật được nhận và thuộc ngày lịch Nhật hôm đó; tạo lúc 01:59 giờ Nhật bị từ chối vì ngoài khung giờ; tạo lúc 10:01 giờ Nhật bị từ chối, ghi đợt giao lúc 10:01 vẫn được
          - Bật biến môi trường demo thì tạo được giao dịch lúc 15:00 giờ Nhật vào ngày mở, vẫn không tạo được vào ngày nghỉ; tắt thì bị từ chối
          - Nhật ký có dòng mở ngày với người thực hiện là hệ thống
        file_cham:
          - supabase/schema.sql (hàm open_business_days_by_calendar mới, kiểm lịch trong hàm create_trade, lịch pg_cron)
          - src/app/api/trades/route.ts (đọc biến môi trường demo)

      - key: T09-03-khoa-ngay-co-ly-do-chan-mem
        title: "Khoá ngày nghiệp vụ có lý do, cho khoá khi còn tranh chấp"
        labels: [nguon:chenh-lech, doi:be, lam-ro-voi-khach]
        lam_sau: [T06-02a-trang-thai-cho-xac-nhan-dau-gia]
        boi_canh: |
          Prototype khoá ngày bằng bốn lệnh rời, không khoá dòng, cập nhật không điều kiện, ghi chú tuỳ chọn trái với chính chú thích trong mã (B-09),
          giờ khoá lấy từ máy ứng dụng, lỗi ghi nhật ký bị nuốt, và chặn cứng khi còn tranh chấp mở; không chặn khoá ngày trong tương lai.
          PREMISE Q4 · D-10 chốt chặn mềm: cho khoá khi còn tranh chấp, bắt ghi lý do, ghi số tranh chấp đang mở vào nhật ký; đây là giả định, khách chưa trả lời
          (câu hỏi D-10 ở X-04). Từ D-42 (epic T-06), kết quả đấu giá có trạng thái chờ xác nhận; ngày còn kết quả chờ thì chưa khoá được vì tồn lô chưa chốt.
          Ngày nghiệp vụ (業務日) so theo giờ Nhật (D-25).
        viec: |
          Tạo hàm database lock_business_day chạy trong một giao dịch: khoá dòng ngày với điều kiện đang mở, từ chối ngày sau hôm nay theo giờ Nhật,
          từ chối khi còn kết quả đấu giá chờ xác nhận (lỗi nêu số lượng), từ chối khi còn lô của ngày thiếu chứng từ (lỗi nêu mã lô; quy tắc của T05-05),
          trả kèm số lô chưa bán (lô đã công khai mà chưa có giao dịch) để hộp thoại cảnh báo nhưng không chặn, bắt lý do (cột lock_note mới), đếm tranh chấp đang mở ngay trong hàm và ghi số đó
          cùng danh sách mã vào nhật ký, giờ khoá bằng now() của database; lỗi nhật ký thì huỷ cả. Thêm bộ chặn tự động lớp hai (trigger) trên bảng ngày:
          chỉ cho đổi sang đã khoá khi trạng thái cũ là mở, chặn mọi đường ghi khác. API khoá chỉ gọi hàm này; ngày sai dạng trả 404.
          Bảng tổng hợp ngày trả thêm giờ khoá, người khoá, lý do khoá.
        tieu_chi_xong:
          - Khoá ngày còn 2 tranh chấp mở kèm lý do thì thành công, nhật ký ghi số 2 và hai mã tranh chấp; sau khoá ô tranh chấp mở của ngày vẫn hiện 2
          - Khoá không có lý do bị từ chối ở hàm database, không chỉ ở màn
          - Ngày còn 3 kết quả đấu giá chờ xác nhận thì khoá bị từ chối, lỗi nêu số 3; xác nhận hết rồi khoá được
          - Ngày còn 1 lô thiếu chứng từ thì khoá bị từ chối, lỗi nêu mã lô; bổ sung chứng từ rồi khoá được
          - Ngày có 2 lô đã công khai chưa có giao dịch thì khoá vẫn được, phản hồi và nhật ký ghi số lô chưa bán là 2
          - Khoá ngày mai theo giờ Nhật bị từ chối; máy chủ đặt múi giờ UTC, gọi lúc 02:31 giờ Nhật thì "hôm nay" vẫn là ngày theo giờ Nhật
          - Hai yêu cầu khoá cùng lúc, một thành công, một báo ngày đã khoá; chỉ có một dòng nhật ký
          - Cập nhật thẳng bảng ngày từ đã khoá về mở bị trigger từ chối; sau khoá, sửa số lượng giao dịch của ngày đó bị database từ chối (ca hồi quy)
        file_cham:
          - supabase/schema.sql (hàm lock_business_day mới, trigger trên business_days, cột business_days.lock_note, view v_daily_settlement thêm locked_at, locked_by, lock_note)
          - src/app/api/settlement/[day]/lock/route.ts

      - key: T09-04-hop-thoai-khoa-ngay
        title: "Hộp thoại khoá ngày hiện tóm tắt ngày và cảnh báo"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T09-03-khoa-ngay-co-ly-do-chan-mem, INC-10-hop-thoai-xac-nhan-that]
        boi_canh: |
          Màn SCR-18 dùng hộp thoại mặc định của trình duyệt (D-12), số tranh chấp mở nằm cuối trang nên người dùng bấm khoá rồi mới biết, và không có chỗ nhập lý do.
          Sau quyết định chặn mềm (T09-03) và cho ghi tranh chấp sau khoá (T09-05), màn phải hiện được cặp trạng thái "đã khoá, còn n tranh chấp mở"
          mà người đọc không tưởng hệ thống sai. Chưa có đường mở lại ngày đã khoá (締め再開), hộp thoại phải nói thẳng điều đó.
        viec: |
          Dùng thành phần hộp thoại chung (INC-10) cho thao tác khoá: khi mở, đọc lại tóm tắt ngày từ máy chủ (số giao dịch, tổng tiền gốc và hiệu lực,
          chưa giao xong, kết quả đấu giá chờ, lô chưa bán, tranh chấp mở); ô lý do bắt buộc; khối cảnh báo vàng khi còn lô chưa bán; khối cảnh báo đỏ khi còn tranh chấp mở nêu rõ đây là quy tắc nội bộ chờ khách;
          cảnh báo khi ngày cách hôm nay quá 7 ngày; câu cố định "chưa có thao tác mở lại, sai thì đi đường yêu cầu điều chỉnh SCR-12". Số tranh chấp mở hiện cạnh
          nút khoá, bấm cuộn tới bảng tranh chấp; nút Tải lại cạnh đó. Sau khoá, khối trạng thái hiện giờ khoá, người khoá, lý do, và "n tranh chấp mở phát sinh sau chốt".
        tieu_chi_xong:
          - Người khác đóng tranh chấp cuối ở tab khác, mở hộp thoại ở tab này thì số tranh chấp mở trong hộp là 0 (đọc lại lúc mở)
          - Bỏ trống lý do thì nút Khoá không bấm được, lỗi hiện tại ô; bấm hai lần chỉ gọi API một lần
          - Ngày cách hôm nay 8 ngày hiện cảnh báo số ngày; ngày 7 ngày thì không
          - Sau khi khoá ngày còn 1 tranh chấp mở, khối trạng thái hiện "đã khoá" và "1 tranh chấp mở phát sinh sau chốt" cùng lúc, không hiện lỗi
          - Thông báo chặn khi còn kết quả đấu giá chờ hoặc khoá ngày tương lai hiện đúng câu của API, không lộ mã thô
          - Ngày còn 2 lô chưa bán thì hộp thoại hiện cảnh báo vàng nêu số 2 và vẫn cho khoá; ngày không còn lô chưa bán thì không hiện khối này
        file_cham:
          - src/app/(app)/settlement/page.tsx

      - key: T09-05-tranh-chap-sau-khoa-o-may-chu
        title: "Tranh chấp ghi và đóng được sau khoá ngày, quy tắc đặt ở máy chủ"
        labels: [nguon:chenh-lech, doi:be]
        boi_canh: |
          PREMISE B-16 giữ: cho ghi và đóng tranh chấp sau khi khoá ngày, vì khiếu nại phát hiện sau chốt sổ là tình huống thật và là căn cứ mở yêu cầu điều chỉnh (SCR-12).
          Prototype chặn chỉ ở màn hình, còn API và database không kiểm, nên quy tắc là giả; API cập nhật tranh chấp không có điều kiện trạng thái,
          người xử lý là chữ tự do (không truy được ai), hạn xử lý không sửa được tại chỗ, không có khoá chống gửi trùng, lỗi khoá ngoại rơi thành 500.
          Quy tắc đích nằm ở máy chủ: tranh chấp ghi được bất kể ngày đã khoá; số liệu (lô, giao dịch, đợt giao) vẫn bị database chặn như cũ.
        viec: |
          Migration: thêm cột owner_id tham chiếu bảng người dùng (giữ owner_name làm lịch sử), resolution_note, closed_at, closed_by.
          Tạo hàm database close_dispute chạy trong một giao dịch: cập nhật với điều kiện đang mở, ghi chú đóng bắt buộc, ghi nhật ký; lỗi thì huỷ cả.
          API ghi nhận tranh chấp nhận Idempotency-Key (khoá chống gửi trùng do màn sinh); API cập nhật cho sửa tại chỗ người xử lý và hạn khi đang mở,
          mỗi lần sửa một dòng nhật ký giá trị trước và sau; cả hai không kiểm trạng thái khoá của ngày, chỉ kiểm ngày nghiệp vụ tồn tại và giao dịch (nếu có)
          thuộc ngày đó; lỗi khoá ngoại đổi thành 422 có nghĩa. Không có API mở lại tranh chấp đã đóng.
        tieu_chi_xong:
          - Ghi tranh chấp trên ngày đã khoá qua API thành công, ô tranh chấp mở của ngày tăng 1
          - Hai yêu cầu đóng cùng lúc, một thành công, một báo đã đóng; chỉ một dòng nhật ký
          - Đóng không có ghi chú bị hàm database từ chối; gửi trạng thái "mở" cho tranh chấp đã đóng bị từ chối
          - Sửa hạn xử lý từ 2026-08-26 sang 2026-08-28 khi đang mở thì nhật ký có dòng giá trị trước và sau; sửa khi đã đóng bị từ chối
          - Gửi hai lần cùng khoá chống trùng chỉ tạo một tranh chấp
          - Người xử lý gửi mã tài khoản không tồn tại trả 422 nêu rõ trường sai, không trả 500; dòng cũ chỉ có owner_name vẫn đọc được kèm cờ "chưa liên kết"
        file_cham:
          - supabase/schema.sql (cột mới của disputes, hàm close_dispute mới)
          - src/app/api/disputes/route.ts
          - src/app/api/disputes/[id]/route.ts

      - key: T09-06-bang-tranh-chap-gia-co
        title: "Bảng tranh chấp với người xử lý thật và cột quá hạn"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T09-05-tranh-chap-sau-khoa-o-may-chu, T09-04-hop-thoai-khoa-ngay, INC-10-hop-thoai-xac-nhan-that]
        boi_canh: |
          Theo T09-05. Bảng tranh chấp SCR-19 hiện khoá nút ghi khi ngày đã khoá, người xử lý gõ tay, hạn không sửa được tại chỗ, đóng bằng hộp thoại trình duyệt,
          không có cột quá hạn, không sắp tranh chấp đang mở lên trước, ô chọn giao dịch còn lẫn giao dịch đã huỷ.
          Quá hạn tính theo ngày lịch giờ Nhật, hạn 2026-08-26 nghĩa là hết ngày 26 theo giờ Nhật (D-25).
        viec: |
          Bỏ điều kiện chặn theo trạng thái khoá ở bảng tranh chấp; khi ngày đã khoá hiện banner thông tin "ghi và đóng vẫn được, sửa số liệu phải đi qua yêu cầu
          điều chỉnh SCR-12" kèm link. Người xử lý chọn từ danh sách tài khoản vai đối soát đang hoạt động, sửa tại chỗ cùng hạn xử lý; dòng cũ chưa liên kết hiện
          tên cũ kèm nhãn xám. Hộp thoại đóng dùng thành phần chung, ô ghi chú đóng bắt buộc. Cột hạn với nhãn "đến hạn" (hôm nay hoặc còn 1 ngày) và
          "quá hạn n ngày" theo ngày lịch giờ Nhật; tranh chấp đang mở lên trước; ô chọn giao dịch chỉ hiện giao dịch đã xác nhận. Sau khi đóng tranh chấp cuối,
          tải lại cả màn để nút khoá ngày đọc số mới.
        tieu_chi_xong:
          - Ngày đã khoá vẫn ghi được tranh chấp từ màn, banner thông tin hiện và có link tới màn yêu cầu điều chỉnh
          - Máy chủ đặt múi giờ UTC, hạn 2026-08-26, xem lúc 23:30 ngày 26 giờ Nhật chưa hiện quá hạn; xem lúc 00:10 ngày 27 giờ Nhật hiện quá hạn 1 ngày
          - Sửa hạn tại chỗ rồi tải lại trang, hạn mới còn nguyên; sửa trên tranh chấp đã đóng không có ô sửa
          - Đóng tranh chấp bỏ trống ghi chú thì lỗi hiện tại ô, không gửi; bấm hai lần chỉ gọi API một lần
          - Danh sách người xử lý chỉ có tài khoản vai đối soát đang hoạt động; dòng cũ hiện tên kèm nhãn "chưa liên kết"
          - Ô chọn giao dịch không có giao dịch đã huỷ; đóng tranh chấp cuối thì số cạnh nút khoá đổi về 0 mà không cần tải lại tay
        file_cham:
          - src/app/(app)/settlement/page.tsx
          - src/components/dispute-panel.tsx (dự kiến)

      - key: T09-07-tong-tien-hieu-luc-ngay
        title: "Tổng tiền ngày cộng cả điều chỉnh đã duyệt"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T08-01-cong-thuc-so-con-phai-giao, T09-06-bang-tranh-chap-gia-co]
        boi_canh: |
          PREMISE D-35: tổng tiền ngày của prototype chỉ cộng số gốc, bỏ qua mọi điều chỉnh đã duyệt, trong khi bảng chi tiết ngay dưới hiện chênh lệch từng dòng;
          hai con số trên cùng màn mâu thuẫn nhau. Thiết kế LAB-4 giữ tổng gốc làm căn cứ đối chiếu với bản giấy và thêm tổng hiệu lực.
          Số tiền chênh lệch lưu nguyên yên (đã làm tròn về 0 lúc duyệt điều chỉnh, ví dụ −333,4 lưu −333), tiền gốc đã làm tròn xuống từng dòng,
          nên tổng chỉ được cộng thẳng các số đã lưu, không làm tròn lại ở tầng tổng. Màn còn thiếu ô tranh chấp mở, số dòng chênh lệch, giờ và người giao, phân trang.
        viec: |
          Sửa bảng tính tổng hợp ngày (view v_daily_settlement): thêm total_effective_amount = tổng (tiền gốc + chênh lệch đã lưu) của giao dịch đã xác nhận,
          cộng thẳng; thêm delta_count. Bảng tính số dư (v_trade_balance, cùng view T08-01 sửa) trả thêm giờ giao và người giao của đợt cuối.
          API bảng đối soát phân trang 50 dòng. Màn hiện ô Tổng tiền hai dòng (gốc, hiệu lực), ô thứ 5 Tranh chấp đang mở, ô Ngoại lệ ghi nhãn phụ
          "đã tính trong ô chưa giao xong", dòng có chênh lệch khác 0 hiện tiền hiệu lực đậm ở dòng phụ, tô dòng cần chú ý (ngoại lệ, chênh lệch, tranh chấp)
          và nút lọc "chỉ dòng cần chú ý".
        tieu_chi_xong:
          - Ngày có 3 giao dịch 1.000 yên và một điều chỉnh giảm đã lưu −333 yên thì tổng gốc 3.000, tổng hiệu lực 2.667
          - Ngày có hai điều chỉnh giảm đã lưu −333 và −333 trên tổng gốc 3.000 thì tổng hiệu lực 2.334 (cộng thẳng, không thành 2.333)
          - Ngày không có điều chỉnh thì hai tổng bằng nhau và dòng phụ không hiện
          - Ngày có 2 tranh chấp mở sau khoá thì ô thứ 5 hiện 2 cùng trạng thái đã khoá
          - Ngày có 120 giao dịch trả 50 dòng trang 1, trang 3 có 20 dòng; tổng ở ô trên vẫn là của cả ngày
          - Bật lọc "chỉ dòng cần chú ý" thì chỉ còn dòng ngoại lệ, có chênh lệch, hoặc có tranh chấp
        file_cham:
          - supabase/schema.sql (view v_daily_settlement, view v_trade_balance thêm delivered_at, delivered_by)
          - src/app/api/settlement/route.ts
          - src/app/(app)/settlement/page.tsx

      - key: T09-08-sua-thuoc-tinh-lo-tu-doi-soat
        title: "Sửa thuộc tính lô từ màn đối soát không ghi đè nhau"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T09-07-tong-tien-hieu-luc-ngay, INC-10-hop-thoai-xac-nhan-that]
        boi_canh: |
          Màn đối soát SCR-17 cho sửa ba thuộc tính lô (loài, xuất xứ, đơn vị; không sửa số lượng vì đã ràng với giao dịch, D-13). Prototype sửa bằng hộp thoại
          trình duyệt từng ô một, không bắt lý do, hai người sửa cùng lúc thì người sau ghi đè người trước mà không biết, cập nhật và nhật ký là hai lệnh rời,
          và link sửa bị ẩn hẳn khi ngày đã khoá nên người dùng không hiểu vì sao.
        viec: |
          Thêm cột updated_at cho bảng lô và hàm database update_lot_attributes gộp cập nhật + nhật ký trong một giao dịch, nhận updated_at người dùng đã thấy
          (khoá lạc quan: lệch thì từ chối với mã lỗi "đã có người sửa"). Hộp thoại sửa dùng thành phần chung: ba ô thuộc tính, ô lý do bắt buộc, hiện giá trị hiện tại.
          Link sửa khi ngày đã khoá đổi từ ẩn sang mờ kèm tooltip (chú thích khi rê chuột) nêu ngày đã khoá. Khi đổi ngày đang xem, huỷ yêu cầu tải cũ
          để bảng không hiện nhầm ngày.
        tieu_chi_xong:
          - Hai tab cùng mở hộp sửa một lô, tab A lưu xong, tab B lưu bị từ chối với thông báo đã có người sửa và nút tải lại
          - Hai yêu cầu lưu cùng lúc với cùng updated_at, đúng một thành công; nhật ký có đúng một dòng
          - Bỏ trống lý do thì lỗi hiện tại ô; lưu thành công thì nhật ký có một dòng với giá trị trước và sau, lý do
          - Ngày đã khoá thì link sửa hiện mờ, rê chuột thấy ngày đã khoá; gọi thẳng API bị database từ chối
          - Đổi nhanh từ ngày 24 sang ngày 25 thì bảng cuối cùng là của ngày 25, không bị kết quả ngày 24 về sau ghi đè
        file_cham:
          - supabase/schema.sql (cột lots.updated_at, hàm update_lot_attributes mới)
          - src/app/api/lots/[id]/route.ts
          - src/app/(app)/settlement/page.tsx

  - key: E-T10
    title: "Yêu cầu điều chỉnh sau khoá sổ chỉ nhận sau khi khoá ngày và duyệt trong một giao dịch database"
    labels: []
    body: |
      Epic gom gói T-10 (màn SCR-12 gửi yêu cầu điều chỉnh, SCR-13 duyệt yêu cầu). Yêu cầu điều chỉnh là đường sửa duy nhất cho giao dịch thuộc
      ngày nghiệp vụ đã khoá; duyệt xong sinh dòng chênh lệch riêng, không sửa đè bản gốc (nguyên tắc "giao dịch đã chốt không sửa đè, mọi thay
      đổi ghi thành dòng chênh lệch", trong LAB-4 gọi là ADR-002).
      Tiền đề: PREMISE.md Bảng 3 (B-05: chỉ cho điều chỉnh sau khi khoá ngày, giữ LAB-4). D-19: yêu cầu điều chỉnh không loại giao dịch đấu giá
      (せり), đường sửa せり có thật và phải có ca thử. Người duyệt tách khỏi người đề nghị đã đúng, giữ.
      Quy tắc tiền: tiền chênh lệch lúc duyệt là số nguyên yên, làm tròn về 0 (bỏ phần lẻ, không đổi dấu); kỳ áp dụng là tháng liền sau tháng
      của ngày giao dịch. Việc đẩy dòng chênh lệch rơi vào kỳ thưởng đã chốt sang kỳ mở đã có ở epic E-INC (INC-09a), không lặp; bộ lọc tra lịch sử
      sửa せり (SCR-11) thuộc epic T-13 (T13-02). Chú giải: 業務日 là ngày nghiệp vụ của chợ theo giờ Nhật; B-01 là ngõ cụt trạng thái cần bổ sung;
      B-04 là lỗi duyệt tăng số lượng không kiểm tồn; B-10 là lỗi duyệt chạy hai lệnh rời; D-07 là chứng cứ đính kèm chỉ lưu tên tệp.
      Giả định: không có giả định riêng; epic bám PREMISE.md (B-05 chọn chỉ điều chỉnh sau khi khoá ngày).
      Thứ tự làm: T06-01 → T10-01 → T10-02 → T10-03 → T10-04.
    issues:
      - key: T10-01-chi-nhan-yeu-cau-sau-khi-khoa-ngay
        title: "Chỉ nhận yêu cầu điều chỉnh cho giao dịch thuộc ngày đã khoá"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T06-01-ma-giao-dich-bang-bo-dem]
        boi_canh: |
          B-05, PREMISE Bảng 3 chốt: điều chỉnh chỉ dành cho sau khi khoá ngày; ngày còn mở thì huỷ và tạo lại ở màn giao dịch. Hiện trạng API gửi
          yêu cầu không kiểm ngày khoá ở đâu cả, nên một giao dịch có hai đường sửa song song và nhật ký khó đọc. Thêm: chỉ chặn trùng khi đã có yêu cầu
          pending (đang chờ duyệt), không chặn khi need_info (cần bổ sung, ngõ cụt B-01, T10-02 mở đường quay về); số lượng quá 2 chữ số thập phân bị
          database tự làm tròn không báo; giao dịch đã huỷ sau khi gửi vẫn nhận. Giao dịch đấu giá được gửi yêu cầu bình thường (D-19).
          Mã yêu cầu dùng bộ đếm next_code của T06-01. Trạng thái draft (nháp) do T10-04 thêm, không tính là yêu cầu mở.
        viec: |
          Ở API gửi yêu cầu: kiểm ngày nghiệp vụ của giao dịch đã khoá, chưa khoá thì 409 kèm thông điệp chỉ sang màn giao dịch; kiểm giao dịch đang
          confirmed (đã xác nhận); chặn khi đã có yêu cầu pending hoặc need_info trên cùng giao dịch (409 kèm mã yêu cầu cũ), có chỉ mục duy nhất một phần
          ở database làm lớp cuối; số lượng mới quá 2 chữ số thập phân trả 422; mã yêu cầu lấy từ next_code. Danh sách giao dịch trả cho form chỉ gồm
          giao dịch thuộc ngày đã khoá, đọc từ view số dư để có số hiệu lực.
        tieu_chi_xong:
          - Gửi yêu cầu cho giao dịch thuộc ngày còn mở nhận 409, thông điệp nêu ngày nào chưa khoá và chỉ sang màn giao dịch
          - Gửi yêu cầu cho giao dịch đấu giá thuộc ngày đã khoá được nhận bình thường
          - Gửi yêu cầu cho giao dịch đã huỷ hoặc đã trả lại nhận 409
          - Đã có yêu cầu pending thì gửi tiếp nhận 409 kèm mã yêu cầu cũ; đã có need_info cũng 409 với hướng dẫn bổ sung vào yêu cầu đó
          - Hai yêu cầu gửi đồng thời cho cùng giao dịch thì đúng một cái được ghi
          - Số lượng mới 118.555 bị 422; 118.55 được nhận và lưu đúng 118.55
          - Đặt lại dữ liệu rồi gửi 3 yêu cầu liền không trùng mã
          - Danh sách giao dịch trả cho form không có giao dịch nào thuộc ngày còn mở
        file_cham:
          - src/app/api/corrections/route.ts
          - supabase/schema.sql (chỉ mục duy nhất một phần trên correction_requests theo giao dịch và trạng thái mở)

      - key: T10-02-duyet-va-mo-lai-yeu-cau-bang-ham-db
        title: "Duyệt và mở lại yêu cầu điều chỉnh bằng hàm database"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
        lam_sau: [T10-01-chi-nhan-yeu-cau-sau-khi-khoa-ngay]
        boi_canh: |
          B-10: duyệt chạy hai lệnh rời (ghi quyết định, rồi sinh dòng chênh lệch); lệnh sau hỏng thì yêu cầu đã approved (đã duyệt) mà không có dòng
          chênh lệch, gửi lại bị 409 vĩnh viễn; hai người duyệt đồng thời cùng lọt vì lệnh ghi không có điều kiện trạng thái. B-04: duyệt tăng số lượng
          không kiểm tồn lô. Tiền chênh lệch tính bằng số thực của JavaScript nên sai 1 yên ở ca số lẻ âm; cột lưu là số nguyên yên. Thời điểm quyết
          định lấy giờ máy ứng dụng. B-01: need_info (cần bổ sung) là ngõ cụt, không có đường về pending. Dòng chênh lệch là đầu vào của thưởng thanh
          toán đủ hạn (完納奨励金), nên quy tắc làm tròn và kỳ áp dụng phải ghi rõ; việc đẩy sang kỳ mở do INC-09a lo. Người duyệt khác người gửi đã có
          ba lớp chặn, giữ nguyên. Chênh lệch luôn tính từ giá trị gốc của giao dịch, không từ giá trị hiệu lực.
        viec: |
          Hàm decide_correction trong một giao dịch: lệnh ghi quyết định có điều kiện trạng thái pending (không khớp thì 409 nêu trạng thái hiện tại);
          kiểm giao dịch gốc còn confirmed; duyệt tăng số lượng thì khoá lô và kiểm tồn đủ (QTY_EXCEEDED 422), không trừ tồn; chênh lệch tính bằng kiểu
          numeric trong database từ giá trị gốc, tiền làm tròn về 0 thành số nguyên yên; kỳ áp dụng là tháng liền sau tháng của ngày giao dịch; thời điểm
          quyết định là now() của database; ghi chú bắt buộc khi từ chối hoặc cần bổ sung; nhật ký cùng giao dịch. Hàm reopen_correction: chỉ người gửi
          ban đầu, chỉ khi need_info, bắt buộc nội dung bổ sung, đưa về pending, giữ ghi chú người duyệt, nối nội dung bổ sung vào lý do, nhật ký
          correction.reopen. Hai API duyệt và mở lại chỉ gọi hai hàm này; API xem trước trả số chênh lệch do database tính cho T10-03.
        tieu_chi_xong:
          - Hai người duyệt đồng thời cùng một yêu cầu thì đúng một người thành công, người kia nhận 409, chỉ có một dòng chênh lệch
          - Giả lập lỗi sinh dòng chênh lệch thì yêu cầu vẫn pending, duyệt lại được
          - Giao dịch 100,3 kg giá 1.000 yên, sửa về 100,1 kg thì chênh lệch tiền là âm 200 yên (làm tròn về 0, không phải âm 201)
          - Giao dịch 100 kg sửa về 110 kg khi lô còn 5 kg bị QTY_EXCEEDED; lô còn 20 kg thì duyệt được và tồn lô không đổi
          - Giao dịch ngày 20/12/2026 duyệt thì kỳ áp dụng là 2027-01; ngày 15/10/2026 thì 2026-11
          - Giao dịch gốc bị huỷ sau khi gửi thì duyệt nhận 409; yêu cầu trên giao dịch đấu giá duyệt được bình thường
          - Từ chối không ghi chú bị từ chối ở hàm database; thời điểm quyết định bằng giờ database, hiện theo giờ Nhật
          - Người gửi mở lại yêu cầu need_info kèm nội dung thì về pending, ghi chú người duyệt còn nguyên, nhật ký có correction.reopen; người khác mở lại nhận 403; mở lại yêu cầu pending nhận 409
        file_cham:
          - supabase/schema.sql (hàm decide_correction và reopen_correction mới)
          - src/app/api/corrections/[id]/decide/route.ts
          - src/app/api/corrections/[id]/reopen/route.ts (mới)
          - src/app/api/corrections/[id]/preview/route.ts (mới)

      - key: T10-03-form-ba-so-va-tim-theo-ma
        title: "Form yêu cầu điều chỉnh hiện ba số và tìm giao dịch theo mã"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T10-02-duyet-va-mo-lai-yeu-cau-bang-ham-db]
        boi_canh: |
          Chênh lệch luôn tính từ giá trị gốc của giao dịch, không từ giá trị hiệu lực sau các lần điều chỉnh trước. Form SCR-12 hiện chỉ ghi "Giá trị
          hiện tại" lấy số gốc, người gửi tưởng là số đang hiệu lực và gõ sai. Ô chọn giao dịch chỉ liệt kê 200 mã gần nhất, giao dịch cũ hơn không có
          và không báo. Giảm số lượng về 0 bị chặn mà thông điệp không chỉ đường đi (mở tranh chấp ở SCR-19). Bảng duyệt SCR-13 cần hiện cùng ba số và
          số tiền dự kiến lấy từ API xem trước của T10-02, không tính lại ở trình duyệt. Yêu cầu need_info (cần bổ sung) cần nút bổ sung gọi API mở lại.
        viec: |
          Form gửi: ô tìm theo mã giao dịch (chỉ giao dịch thuộc ngày đã khoá); ba ô chỉ đọc "Giá trị gốc" (kèm chú thích đã có n điều chỉnh), "Chênh lệch
          đã duyệt", "Giá trị hiệu lực hiện tại"; ô "Giá trị mới" ghi rõ so với gốc; cảnh báo tại ô khi vượt tồn lô; thông điệp khi nhập 0 chỉ đường sang
          màn tranh chấp. Bảng duyệt: cột gốc, chênh lệch đã duyệt, hiệu lực, số tiền chênh lệch dự kiến từ API xem trước. Dòng need_info hiện ghi chú
          người duyệt và nút "Bổ sung" cho người gửi với ô nội dung bắt buộc. Áp định nghĩa xong chung cho màn hình (script chép vào thân issue).
        tieu_chi_xong:
          - Giao dịch 100 kg đã có điều chỉnh duyệt +10 kg thì form hiện gốc 100, chênh lệch đã duyệt +10, hiệu lực 110 và chú thích "đã có 1 điều chỉnh"
          - Gõ mã giao dịch của ngày còn mở thì không tìm thấy và có thông điệp nêu lý do; mã của ngày đã khoá tìm thấy dù cũ hơn 200 giao dịch gần nhất
          - Nhập giá trị mới 0 thì lỗi tại ô nêu đường đi là mở tranh chấp ở màn SCR-19
          - Số tiền dự kiến trên bảng duyệt cho ca 100,3 kg về 100,1 kg giá 1.000 yên là âm 200, khớp số sau khi duyệt
          - Nhập số lượng mới vượt tồn lô thì cảnh báo tại ô ngay khi gõ, trước khi gửi
          - Người gửi thấy nút "Bổ sung" trên dòng need_info; vai đối soát không thấy; nội dung trống thì lỗi tại ô
          - Trên màn rộng 390 px ba số hiện đủ, không cuộn ngang
        file_cham:
          - src/app/(app)/corrections/correction-form.tsx
          - src/app/(app)/corrections/correction-types.ts
          - src/app/(app)/corrections/page.tsx

      - key: T10-04-chung-cu-dinh-kem-that
        title: "Chứng cứ đính kèm thật cho yêu cầu điều chỉnh theo luồng nháp rồi gửi"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T10-03-form-ba-so-va-tim-theo-ma]
        boi_canh: |
          D-07: prototype chỉ lưu tên tệp gõ tay, người duyệt không mở được; một chứng cứ không mở được thì không phải chứng cứ. Thiết kế LAB-4: bắt buộc
          tệp khi sửa số lượng (sự kiện vật lý đã đo), tuỳ chọn khi sửa đơn giá. Vì tệp cần gắn vào một mã yêu cầu, luồng đổi thành ba bước: tạo yêu cầu
          ở trạng thái draft (nháp), tải tệp theo mã yêu cầu, rồi bấm gửi duyệt mới chuyển sang pending (đang chờ) và mới đòi tệp. Nháp không tính là yêu
          cầu mở trong kiểm trùng của T10-01.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: T10-04.1-nhap-tai-tep-gui-duyet-va-don-nhap rồi T10-04.2-form-ba-buoc-va-mo-tep-tu-bang-duyet.
          Bối cảnh ở trên dùng chung cho hai issue con; tiêu chí xong của từng phần nằm ở issue con.
        tieu_chi_xong:
          - Hai issue con đã đóng, mọi tiêu chí xong của chúng đạt trên cùng một bản deploy
        file_cham:
          - supabase/schema.sql (trạng thái draft, bảng correction_attachments mới, hàm dọn nháp)
          - src/app/api/corrections/route.ts (tạo nháp)
          - src/app/api/corrections/[id]/submit/route.ts (mới)
          - src/app/api/corrections/[id]/attachments/route.ts (mới)
          - src/app/(app)/corrections/correction-form.tsx
          - src/app/(app)/corrections/page.tsx
        con:
          - key: T10-04.1-nhap-tai-tep-gui-duyet-va-don-nhap
            title: "Máy chủ: yêu cầu điều chỉnh dạng nháp, tải tệp chứng cứ vào kho riêng, gửi duyệt và dọn nháp quá hạn"
            labels: [nguon:chenh-lech, doi:be]
            boi_canh: |
              Issue con của T10-04-chung-cu-dinh-kem-that; đọc bối cảnh ở issue cha.
            viec: |
              Thêm trạng thái draft; API tạo nháp (kiểm như T10-01 trừ kiểm trùng và tệp); bucket riêng không công khai và bảng correction_attachments (yêu cầu, đường dẫn tệp, loại, kích thước, người tải, thời điểm); API tải tệp theo mã yêu cầu chỉ khi draft hoặc need_info, chỉ người gửi, pdf, jpg, png, heic, tối đa 10 MB, tối đa 5 tệp; API gửi duyệt chuyển draft sang pending, từ chối khi sửa số lượng mà chưa có tệp, lúc này mới kiểm trùng; API đọc tệp trả đường dẫn ký 15 phút cho người gửi, vai đối soát, quản trị hệ thống; job dọn nháp quá 24 giờ chưa gửi cùng tệp của nó.
            tieu_chi_xong:
              - "Tạo nháp sửa số lượng rồi gửi duyệt khi chưa có tệp bị 422; tải một tệp rồi gửi thì thành pending; nháp sửa đơn giá gửi không tệp được nhận"
              - "Tệp 11 MB hoặc tệp .exe bị từ chối trước khi lưu; tệp thứ 6 bị từ chối; tải tệp vào yêu cầu đang pending bị 409"
              - "Hai nháp cùng giao dịch tạo được; gửi duyệt cái thứ hai khi cái thứ nhất đã pending bị 409"
              - "Nháp quá 24 giờ bị job dọn cùng tệp; nháp 23 giờ còn nguyên"
              - "Truy cập thẳng đường dẫn bucket không qua API bị từ chối"
              - "Đường dẫn đọc tệp sau 16 phút không còn mở được; vai giao dịch khác người gửi gọi đọc tệp nhận 403"
            file_cham:
              - "supabase/schema.sql (trạng thái draft, bảng correction_attachments mới, hàm dọn nháp)"
              - "src/app/api/corrections/route.ts (tạo nháp)"
              - "src/app/api/corrections/[id]/submit/route.ts (mới)"
              - "src/app/api/corrections/[id]/attachments/route.ts (mới)"
          - key: T10-04.2-form-ba-buoc-va-mo-tep-tu-bang-duyet
            title: "Form yêu cầu điều chỉnh ba bước (lưu nháp, tải tệp, gửi duyệt) và mở tệp từ bảng duyệt"
            labels: [nguon:chenh-lech, doi:fe]
            lam_sau: [T10-04.1-nhap-tai-tep-gui-duyet-va-don-nhap]
            boi_canh: |
              Issue con của T10-04-chung-cu-dinh-kem-that; đọc bối cảnh ở issue cha.
            viec: |
              Form ba bước trên một màn: lưu nháp, tải tệp, gửi duyệt, gọi các API của T10-04.1. Bảng duyệt hiện đường dẫn mở tệp. Bỏ ô gõ tên tệp cũ.
            tieu_chi_xong:
              - "Người duyệt bấm đường dẫn trong bảng duyệt thì mở được tệp"
              - "Trên form làm đủ ba bước lưu nháp, tải tệp, gửi duyệt trên một màn; ô gõ tên tệp cũ không còn"
              - "Tệp bị từ chối (quá 10 MB, sai loại, quá 5 tệp) hiện lỗi bằng chữ ngay tại ô tải, không lộ mã thô"
            file_cham:
              - "src/app/(app)/corrections/correction-form.tsx"
              - "src/app/(app)/corrections/page.tsx"

  - key: E-INC
    title: "Thưởng thanh toán đủ hạn (完納奨励金): ngày thanh toán, bảng tỷ lệ, tính và chốt kỳ"
    labels: [constraint:kanno-shoreikin]
    body: |
      Epic gom toàn bộ việc để chuỗi thưởng thanh toán đủ hạn chạy thật, thay vì chỉ chạy nhờ dữ liệu mẫu như prototype.
      Quy tắc cố định của đề áp cho mọi issue (chi tiết ở PREMISE.md Bảng 2, dòng Q6): hệ số thuế, làm tròn xuống yên, không ân hạn,
      tỷ lệ có phiên bản và ngày hiệu lực, ngày nghiệp vụ theo giờ Nhật.
      Tiền đề: PREMISE.md Bảng 1 (D-39, D-44), Bảng 2 (Q2 · D-08, Q6 · D-39), Bảng 3 (Q7). Câu hỏi khách về bảng tỷ lệ thật nằm ở epic X-04.
      Chú giải mã dùng trong epic: ADR-002 là quyết định "giao dịch đã chốt không sửa đè, mọi thay đổi ghi thành dòng chênh lệch";
      T-11, T-12 là hai gói việc LAB-4 (màn kết quả thưởng SCR-20, màn quản trị tỷ lệ SCR-21). Gói T-11 gộp vào epic này;
      phần quản trị phiên bản (duyệt, thu hồi, trần 4 lần/năm) của T-12 vẫn ở epic T-12.
      Giả định (chờ khách, câu hỏi ở X-04): ngày thanh toán vào bằng tệp CSV kế toán theo đặc tả đội tự viết, cộng nhập tay cho ngoại lệ (D-08); bảng tỷ lệ chia bậc theo số tiền, cột loại bên mua tuỳ chọn (D-39); dòng chênh lệch rơi vào kỳ đã chốt được đẩy sang kỳ mở gần nhất, không mở lại kỳ đã chốt (D-44).
      Thứ tự làm: INC-05 → INC-06 → INC-08a → INC-08b → INC-08c → INC-09a → INC-09b → INC-07 → INC-10 → INC-11; nhánh ngày thanh toán INC-01 → INC-02 → INC-03 → INC-04 song song; INC-12 và INC-13 cuối.
    issues:
      - key: INC-01-dac-ta-csv-tien-ve
        title: "Đặc tả file CSV ngày thanh toán do kế toán xuất theo kỳ"
        labels: [nguon:moi, doi:be, constraint:kanno-shoreikin]
        boi_canh: |
          Prototype không có đường nào ghi ngày thanh toán, nên thưởng luôn bằng 0 ngoài dữ liệu mẫu (D-08).
          PREMISE Q2 chọn nguồn chính là file CSV do kế toán xuất theo kỳ; đây là giả định, khách chưa xác nhận (câu hỏi ở X-04).
          Ngày thanh toán là kiểu ngày (không có giờ), tính theo giờ Nhật; trả đúng ngày hạn vẫn là trong hạn.
        viec: |
          Viết tài liệu đặc tả file CSV: cột bắt buộc (mã giao dịch, ngày thanh toán dạng YYYY-MM-DD theo giờ Nhật, số tiền đã trả,
          mã tham chiếu kế toán), mã hoá UTF-8, dòng tiêu đề, giới hạn 5.000 dòng và 2 MB một file, cách đánh dấu dòng lỗi,
          ví dụ 10 dòng hợp lệ và 5 dòng lỗi. Đặt tại docs/csv-ngay-thanh-toan.md trong repo này.
        tieu_chi_xong:
          - Tài liệu có bảng cột với kiểu dữ liệu, bắt buộc hay không, ví dụ giá trị; ngày ghi rõ là kiểu ngày theo giờ Nhật
          - Có ví dụ file hợp lệ và file lỗi (mã giao dịch không tồn tại, ngày sai định dạng, trùng dòng, quá 5.000 dòng)
          - "Nêu rõ quy tắc khi một giao dịch xuất hiện hai lần trong cùng file: cả file bị từ chối, báo số dòng"
          - Người viết INC-02 đọc tài liệu này và viết được API mà không cần hỏi lại; nếu phải hỏi, câu hỏi được bổ sung vào tài liệu
        file_cham:
          - docs/csv-ngay-thanh-toan.md (mới, trong repo này)

      - key: INC-02-api-nhap-csv-tien-ve
        title: "API nhập file CSV ngày thanh toán vào bảng tiền về, kiểm trùng, ghi kèm nguồn"
        labels: [nguon:moi, doi:be, constraint:kanno-shoreikin]
        lam_sau: [INC-01-dac-ta-csv-tien-ve]
        boi_canh: |
          Theo INC-01. Bảng giao dịch có bộ chặn: mọi sửa đổi trên giao dịch thuộc ngày nghiệp vụ đã khoá đều bị từ chối (hàm guard_locked_day),
          mà ngày thanh toán luôn đến sau khi ngày giao dịch đã khoá. Vì vậy ngày thanh toán ghi vào bảng riêng "tiền về" (trade_payments),
          không ghi vào cột paid_at của bảng giao dịch. Cột paid_at cũ giữ lại chỉ để đọc dữ liệu mẫu, hàm tính sẽ đọc bảng mới (INC-06).
        viec: |
          Tạo migration bảng tiền về: mã giao dịch, ngày thanh toán (kiểu ngày), số tiền, nguồn (ke_toan / nhap_tay), người ghi, lý do, thời điểm ghi;
          mỗi giao dịch tối đa một dòng nguồn kế toán. Tạo API nhận file CSV, kiểm từng dòng theo đặc tả; có bất kỳ dòng lỗi nào
          (kể cả giao dịch đã có dòng nhập tay, coi là xung đột) thì từ chối cả file và trả danh sách lỗi theo số dòng.
          Nhập lại cùng file không tạo trùng. Mỗi lần nhập ghi một dòng nhật ký: ai, lúc nào, bao nhiêu dòng, kỳ nào. Migration có bước quay lại.
        tieu_chi_xong:
          - Nhập file 10 dòng hợp lệ thì bảng tiền về có 10 dòng nguồn "kế toán", giao dịch thuộc ngày đã khoá vẫn ghi được
          - Nhập file có 1 dòng lỗi (mã sai, ngày sai, trùng, hoặc xung đột với dòng nhập tay) thì không dòng nào được ghi, phản hồi chỉ đúng số dòng lỗi
          - "Nhập lại cùng file lần hai: kết quả không đổi, không có dòng nhật ký \"ghi đè\""
          - File quá 5.000 dòng hoặc quá 2 MB bị từ chối trước khi đọc nội dung
          - Chỉ vai đối soát gọi được; vai khác nhận lỗi quyền
          - Chạy bước quay lại migration thì bảng tiền về biến mất, dữ liệu giao dịch không đổi
        file_cham:
          - supabase/schema.sql (bảng trade_payments mới, không gắn bộ chặn ngày khoá)
          - src/app/api/incentives/import-payments/route.ts (mới)

      - key: INC-03-man-nhap-tay-tien-ve
        title: "Màn nhập tay ngày thanh toán cho ngoại lệ, có phân quyền và lý do bắt buộc"
        labels: [nguon:moi, doi:fe, constraint:kanno-shoreikin]
        lam_sau: [INC-02-api-nhap-csv-tien-ve]
        boi_canh: |
          PREMISE Q2: nhập tay chỉ dành cho ngoại lệ (kế toán gửi muộn, một giao dịch lẻ). Phải bắt lý do để tra lại khi có tranh chấp.
          Ghi vào bảng tiền về (INC-02) với nguồn "nhập tay". Lớp nặng nhất là màn hình; API ghi một dòng đi kèm.
        viec: |
          Thêm thao tác "Ghi ngày thanh toán" trên chi tiết giao dịch: ô ngày theo giờ Nhật, ô lý do bắt buộc, hộp xác nhận hiện lại
          mã giao dịch, thành tiền, hạn thanh toán. Chỉ vai đối soát thấy nút. API ghi dòng nguồn "nhập tay", từ chối nếu đã có dòng kế toán.
          Sau khi ghi, màn hiện nguồn và người ghi.
        tieu_chi_xong:
          - Vai bán buôn hoặc bên mua không thấy nút; vai đối soát thấy
          - Bỏ trống lý do thì lỗi hiện ngay tại ô, không gửi được
          - Ghi ngày sau hạn thanh toán thì màn cảnh báo "sẽ không được thưởng" trước khi xác nhận; ghi đúng ngày hạn thì không cảnh báo
          - Nhấn xác nhận hai lần liên tiếp chỉ tạo một dòng
          - Giao dịch đã có dòng kế toán thì API từ chối, màn báo lý do
          - Nhật ký thao tác có dòng với giá trị trước (trống) và sau (ngày vừa ghi), kèm lý do
        file_cham:
          - src/app/(app)/trades/[id]/page.tsx (thêm thao tác)
          - src/app/api/trades/[id]/payment/route.ts (mới, ghi vào trade_payments)

      - key: INC-04-cot-nguon-tien-ve-va-loc-nhat-ky
        title: "Hiển thị nguồn ngày thanh toán trên danh sách và lọc nhật ký theo thao tác thanh toán"
        labels: [nguon:moi, doi:fe, constraint:kanno-shoreikin]
        lam_sau: [INC-03-man-nhap-tay-tien-ve]
        boi_canh: |
          Khi hai nguồn (kế toán, nhập tay) cùng tồn tại, người đối soát phải nhìn ra ngay ngày nào đến từ đâu và ai ghi.
          Issue nhỏ, là bước hiển thị của INC-02 và INC-03; giữ riêng vì chạm ba màn khác nhau.
        viec: |
          Trên danh sách giao dịch và màn kết quả thưởng, thêm cột "Nguồn ngày thanh toán" bằng chữ (Kế toán / Nhập tay / Chưa có).
          Trong nhật ký thao tác, thêm bộ lọc theo thao tác "ghi ngày thanh toán" và theo nguồn.
        tieu_chi_xong:
          - Cột hiện chữ, không hiện mã thô
          - Lọc nhật ký theo "ghi ngày thanh toán" ra đúng các dòng do INC-02 và INC-03 tạo
          - Bộ lọc giữ nguyên khi bấm Back trên trình duyệt
        file_cham:
          - src/app/(app)/trades/page.tsx
          - src/app/(app)/incentives/page.tsx
          - src/app/(app)/audit/page.tsx

      - key: INC-05-bang-ty-le-cot-loai-ben-mua
        title: "Bảng tỷ lệ thưởng: thêm cột loại bên mua, ép bậc tăng dần, tối đa 4 chữ số thập phân (database và API)"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
        boi_canh: |
          PREMISE D-39: bảng tỷ lệ theo bậc số tiền là giả định có khai; cách đọc bậc chờ khách (X-04). Thêm cột loại bên mua (tuỳ chọn)
          để khi khách đưa bảng thật chỉ cần đổi dữ liệu. B-11: tỷ lệ hiển thị khác tỷ lệ dùng tính vì cột lưu 4 chữ số còn API không chặn.
          Loại bên mua lấy từ cột type của bảng người tham gia (4 giá trị: bán buôn, nhà buôn trung gian, người tham gia mua bán, người mua lẻ).
          Phần màn quản trị tỷ lệ (SCR-21) làm ở issue riêng trong epic T-12; issue này chỉ làm database và API.
        viec: |
          Mở rộng cấu trúc tiers của phiên bản tỷ lệ: mỗi bậc có ngưỡng số tiền, tỷ lệ, và loại bên mua (để trống nghĩa là áp cho mọi loại).
          Quy tắc chọn bậc: bậc có loại bên mua khớp thắng bậc để trống; trong cùng một loại (kể cả nhóm để trống), ngưỡng phải tăng nghiêm ngặt
          và tỷ lệ không giảm. Ràng buộc kiểm ở database cho hình dạng tiers; API tạo phiên bản chặn tỷ lệ quá 4 chữ số thập phân và bậc khai ngược.
        tieu_chi_xong:
          - Tạo phiên bản có bậc khai ngược (ngưỡng cao hơn nhưng tỷ lệ thấp hơn) bị từ chối, lỗi chỉ đúng dòng và nhóm loại
          - Tỷ lệ 0,00655 bị từ chối; 0,0065 được nhận; số lưu bằng số dùng tính
          - Một bên mua là nhà buôn trung gian với số tiền khớp cả bậc có loại và bậc để trống thì lấy bậc có loại
          - Phiên bản cũ không có cột loại bên mua vẫn đọc được, hiểu là áp cho mọi loại
          - Dữ liệu mẫu có một phiên bản khai theo loại bên mua để demo
        file_cham:
          - supabase/schema.sql (ràng buộc kiểm tiers của rule_versions)
          - src/app/api/rules/route.ts

      - key: INC-06-ham-tinh-doc-loai-ben-mua
        title: "Hàm tính thưởng: chọn bậc theo loại bên mua, đọc bảng tiền về, lọc dòng chênh lệch như dòng gốc"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
        lam_sau: [INC-05-bang-ty-le-cot-loai-ben-mua, INC-02-api-nhap-csv-tien-ve]
        boi_canh: |
          Hàm tính hiện chọn bậc chỉ theo số tiền và đọc cột paid_at cũ. B-12: dòng chênh lệch không lọc trạng thái và ngày thanh toán,
          nên giao dịch đã huỷ hoặc chưa trả vẫn sinh thưởng chênh lệch. Dòng chênh lệch giữ tỷ lệ của dòng gốc kỳ gốc, không chọn lại bậc
          (theo thiết kế chi tiết LAB-4 của phần thưởng). Việc đẩy dòng chênh lệch sang kỳ mở làm ở INC-09a, không làm ở đây.
        viec: |
          Sửa hàm tính trong database: đọc ngày thanh toán từ bảng tiền về (ưu tiên dòng kế toán); dòng gốc chọn bậc theo loại bên mua rồi theo số tiền;
          dòng chênh lệch áp cùng bộ lọc với dòng gốc (giao dịch đã xác nhận, thanh toán trước hoặc đúng ngày hạn) và giữ tỷ lệ kỳ gốc.
          Kết quả đấu giá ở trạng thái chờ xác nhận (D-42, epic giao dịch) không tính vào thưởng cho tới khi được xác nhận.
          Giữ nguyên: nhân 110/100, làm tròn xuống yên ở từng dòng, không làm tròn lại ở tổng, dòng chênh lệch làm tròn về 0.
        tieu_chi_xong:
          - Ba ca biên của phụ lục kiểm thử RFP (đúng ngưỡng tối thiểu, điều chỉnh sau chốt kỳ, số lẻ sau nhân thuế) cho kết quả tính tay khớp
          - Trả đúng ngày hạn thì được thưởng; trả trễ một ngày thì thưởng 0, không có ân hạn
          - Giao dịch đã huỷ có điều chỉnh không sinh dòng chênh lệch
          - Dòng chênh lệch của giao dịch mà kỳ gốc dùng tỷ lệ 0,5% vẫn dùng 0,5% dù phiên bản hiện hành đã đổi
          - Hai bên mua cùng số tiền nhưng khác loại được tỷ lệ khác nhau khi phiên bản khai theo loại
          - Giao dịch có ngày thanh toán ở cột paid_at cũ nhưng không có dòng tiền về thì tính là chưa thanh toán
          - Kết quả đấu giá chờ xác nhận có ngày thanh toán vẫn không sinh dòng thưởng; sau khi xác nhận thì sinh
        file_cham:
          - supabase/schema.sql (hàm calculate_incentives, phần dòng gốc và dòng delta)

      - key: INC-07-tao-ky-tu-man-hinh
        title: "Tạo kỳ thưởng mới từ màn hình, kiểm dạng năm-tháng"
        labels: [nguon:chenh-lech, doi:fe, constraint:kanno-shoreikin]
        lam_sau: [INC-08b-ham-chot-ky-mot-giao-dich]
        boi_canh: |
          D-34: kỳ thưởng chỉ sinh bên trong hàm tính, còn màn hình chỉ chọn kỳ đã có, nên tháng mới không bao giờ tính được ngoài hai kỳ mẫu.
          Lớp nặng nhất là màn hình; API đi kèm một đường tạo kỳ.
        viec: |
          Thêm ô nhập kỳ mới dạng YYYY-MM trên màn kết quả thưởng; API kiểm định dạng, kỳ chưa tồn tại, kỳ không xa quá 12 tháng; kỳ mới ở trạng thái mở.
        tieu_chi_xong:
          - Nhập 2026-13 hoặc 202610 bị từ chối ngay tại ô
          - Tạo kỳ 2026-11 rồi tính được; tạo lại 2026-11 báo đã tồn tại
          - Gọi thẳng API với 2026-13 hoặc kỳ xa hơn 12 tháng bị từ chối với mã lỗi rõ
        file_cham:
          - src/app/(app)/incentives/page.tsx
          - src/app/api/incentives/route.ts

      - key: INC-08a-tinh-ky-co-khoa-luu-so-truoc-khi-xoa
        title: "Tính kỳ có khoá theo kỳ; nhật ký lưu số dòng và tổng thưởng trước khi xoá để tính lại"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
        lam_sau: [INC-06-ham-tinh-doc-loai-ben-mua]
        boi_canh: |
          Hàm tính hiện không khoá: hai người bấm tính cùng lúc có thể nhân đôi dòng. Khi tính lại, kết quả cũ bị xoá mà nhật ký không giữ số cũ,
          nên không đối chiếu được. Thiết kế LAB-4 mục "chênh lệch với hiện trạng" dòng 1 và 9.
        viec: |
          Sửa hàm tính: khoá dòng kỳ (FOR UPDATE) trong suốt lần tính; trước khi xoá kết quả cũ, ghi vào nhật ký số dòng và tổng thưởng cũ
          cùng số dòng và tổng thưởng mới. Kỳ đã chốt thì từ chối tính.
        tieu_chi_xong:
          - "Hai yêu cầu tính cùng lúc: một chạy, một chờ rồi tính lại trên kết quả mới; số dòng kết quả không nhân đôi"
          - "Tính lại kỳ đang mở: nhật ký có số dòng và tổng thưởng trước và sau"
          - Gọi tính trên kỳ đã chốt bị từ chối với mã lỗi rõ
        file_cham:
          - supabase/schema.sql (hàm calculate_incentives, phần khoá và nhật ký)
          - src/app/api/incentives/[period]/calculate/route.ts

      - key: INC-08b-ham-chot-ky-mot-giao-dich
        title: "Chốt kỳ bằng một hàm database: chỉ chốt kỳ đang mở, ghi chú bắt buộc, giờ chốt theo database, chặn khi tháng còn ngày mở"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
        lam_sau: [INC-08a-tinh-ky-co-khoa-luu-so-truoc-khi-xoa]
        boi_canh: |
          Chốt kỳ hiện là bốn lệnh rời ở lớp ứng dụng, cập nhật không điều kiện, ghi chú tuỳ chọn (B-13), giờ chốt lấy từ máy ứng dụng.
          Thiết kế LAB-4 còn chỉ ra: chốt kỳ khi tháng đó còn ngày nghiệp vụ chưa khoá sẽ làm mất tiền im lặng.
        viec: |
          Tạo hàm database close_incentive_period chạy trong một giao dịch: kiểm kỳ đang mở, kiểm mọi ngày nghiệp vụ của tháng đã khoá,
          cập nhật trạng thái với điều kiện status = open, ghi chú bắt buộc, giờ chốt lấy now() của database. API chốt chỉ gọi hàm này.
        tieu_chi_xong:
          - "Hai yêu cầu chốt cùng lúc: một thành công, một báo kỳ đã chốt"
          - Chốt không ghi chú bị từ chối ở hàm database, không chỉ ở màn
          - Tháng còn một ngày nghiệp vụ chưa khoá thì chốt bị từ chối, lỗi nêu ngày nào
          - Giờ chốt bằng giờ database, hiện theo giờ Nhật
        file_cham:
          - supabase/schema.sql (hàm close_incentive_period mới)
          - src/app/api/incentives/[period]/close/route.ts

      - key: INC-08c-nhat-ky-trong-cung-giao-dich
        title: "Nhật ký thao tác tính và chốt kỳ ghi trong cùng giao dịch database, hỏng thì huỷ cả"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
        lam_sau: [INC-08b-ham-chot-ky-mot-giao-dich]
        boi_canh: |
          B-20: hàm ghi nhật ký ở lớp ứng dụng nuốt lỗi, nên có thể chốt kỳ mà không có dòng nhật ký. Thiết kế LAB-4 dòng 3.
        viec: |
          Chuyển ghi nhật ký của tính và chốt kỳ vào trong hàm database (cùng giao dịch với INC-08a, INC-08b); lỗi ghi nhật ký làm huỷ cả thao tác.
          Bỏ lời gọi ghi nhật ký ở lớp ứng dụng cho hai thao tác này.
        tieu_chi_xong:
          - "Giả lập lỗi ghi nhật ký (ví dụ bảng nhật ký bị khoá): kỳ vẫn ở trạng thái mở, không có dòng kết quả nửa vời"
          - Chốt thành công thì có đúng một dòng nhật ký, không trùng
          - Không còn lời gọi ghi nhật ký ở hai route tính và chốt
        file_cham:
          - supabase/schema.sql
          - src/app/api/incentives/[period]/calculate/route.ts
          - src/app/api/incentives/[period]/close/route.ts

      - key: INC-09a-day-dong-chenh-lech-sang-ky-mo
        title: "Dòng chênh lệch rơi vào kỳ đã chốt được đẩy sang kỳ mở gần nhất, ghi kỳ gốc và lý do"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
        lam_sau: [INC-08b-ham-chot-ky-mot-giao-dich]
        boi_canh: |
          B-02: điều chỉnh có thể rơi vào kỳ đã chốt nên không bao giờ được tính. PREMISE D-44 (review LAB-4) chốt: đẩy sang kỳ mở gần nhất,
          không sửa kỳ đã chốt. Issue này sở hữu cột kỳ gốc và lý do đẩy trên dòng kết quả.
        viec: |
          Thêm cột kỳ gốc và lý do đẩy vào bảng kết quả thưởng. Khi tính, dòng chênh lệch có kỳ đích đã chốt được ghi vào kỳ mở gần nhất
          sau kỳ đích; kỳ kế tiếp cũng đã chốt thì tìm tiếp. Không có kỳ mở nào thì hàm trả lỗi rõ và không ghi gì, không mất dòng im lặng.
        tieu_chi_xong:
          - Điều chỉnh duyệt sau khi kỳ gốc đã chốt xuất hiện ở kỳ mở gần nhất, có cột kỳ gốc và lý do đẩy; kỳ đã chốt không đổi số
          - "Kỳ kế tiếp đã chốt, kỳ sau nữa mở: dòng nằm ở kỳ sau nữa"
          - "Không còn kỳ mở nào: hàm trả mã lỗi rõ, không có dòng nào bị mất; tạo kỳ mới rồi tính lại thì dòng xuất hiện"
        file_cham:
          - supabase/schema.sql (cột origin_period, shift_reason của incentive_results; hàm calculate_incentives phần dòng delta)

      - key: INC-09b-canh-bao-dong-khong-co-ky-goc
        title: "Cảnh báo trước khi tính nếu có điều chỉnh mà kỳ gốc chưa từng tính"
        labels: [nguon:chenh-lech, doi:fe, constraint:kanno-shoreikin]
        lam_sau: [INC-09a-day-dong-chenh-lech-sang-ky-mo]
        boi_canh: |
          B-03: kỳ gốc chưa từng tính thì dòng chênh lệch biến mất không báo. Lớp nặng nhất là màn hình; API đi kèm một đường kiểm trước.
        viec: |
          Thêm API kiểm trước khi tính: liệt kê điều chỉnh đã duyệt mà kỳ gốc chưa có kết quả. Màn tính hiện cảnh báo với mã điều chỉnh
          và đường dẫn tới màn điều chỉnh; người dùng phải đánh dấu "đã hiểu" mới bấm tính được, và việc đánh dấu ghi vào nhật ký.
        tieu_chi_xong:
          - Có điều chỉnh thiếu kỳ gốc thì nút tính khoá cho tới khi đánh dấu "đã hiểu"; nhật ký có dòng đánh dấu kèm mã điều chỉnh
          - Không có thì không hiện cảnh báo, nút tính mở
          - Danh sách mã trong cảnh báo khớp kết quả API khi gọi trực tiếp
        file_cham:
          - src/app/api/incentives/[period]/preflight/route.ts (mới)
          - src/app/(app)/incentives/page.tsx

      - key: INC-10-hop-thoai-xac-nhan-that
        title: "Hộp thoại xác nhận tính và chốt kỳ hiện số đọc tại lúc mở, bỏ hộp thoại mặc định của trình duyệt"
        labels: [nguon:chenh-lech, doi:fe, constraint:kanno-shoreikin]
        lam_sau: [INC-08c-nhat-ky-trong-cung-giao-dich]
        boi_canh: |
          D-12: prototype dùng hộp thoại mặc định của trình duyệt, không hiện số liệu, không nhập được ghi chú. Quy tắc ghi chú bắt buộc nằm ở INC-08b;
          issue này chỉ lo màn hình. Thiết kế LAB-4 yêu cầu: số trong hộp phải là số đọc lại lúc bấm, không phải số đang hiện trên màn.
        viec: |
          Thay bằng hộp thoại của ứng dụng: khi mở, gọi API đọc lại kỳ, số dòng, tổng tiền thưởng, thời điểm tính gần nhất; ô ghi chú bắt buộc khi chốt;
          nút đổi thành "Đang xử lý" và khoá sau khi bấm; thành công thì thông báo bằng chữ.
        tieu_chi_xong:
          - "Đổi dữ liệu ở tab khác rồi mở hộp thoại ở tab này: số trong hộp là số mới, không phải số cũ trên màn"
          - Ghi chú trống thì nút chốt không bấm được, lỗi hiện tại ô
          - Bấm hai lần chỉ gọi API một lần
          - Thành công thì có thông báo bằng chữ, không chỉ tải lại trang
        file_cham:
          - src/app/(app)/incentives/page.tsx
          - src/components/confirm-dialog.tsx (mới)

      - key: INC-11-man-ket-qua-thuong-gia-co
        title: "Màn kết quả thưởng: nhãn tiếng Nhật, tách dòng gốc và dòng chênh lệch, hiện phiên bản tỷ lệ, dùng được trên điện thoại"
        labels: [nguon:gia-co, doi:fe, constraint:kanno-shoreikin]
        lam_sau: [INC-09a-day-dong-chenh-lech-sang-ky-mo]
        boi_canh: |
          Nhận xét LAB-3 của giảng viên: nhãn chủ yếu tiếng Việt, mã trạng thái thô, hai kiểu ngày. Màn này là màn khách Nhật sẽ tự thử khi xem thưởng.
          Gói T-11 (SCR-20) gộp vào epic này. Cột kỳ gốc do INC-09a tạo, issue này chỉ hiển thị. Xuất CSV của màn này thuộc epic báo cáo (T-14).
        viec: |
          Áp định nghĩa xong chung cho màn hình (script chép vào thân issue): nhãn Nhật cho tên cột và trạng thái theo bảng nhãn chung,
          một kiểu ngày, dòng chênh lệch có nền khác và cột kỳ gốc, hiện mã phiên bản tỷ lệ và hệ số thuế đã dùng, bảng đổi sang dạng thẻ trên điện thoại.
        tieu_chi_xong:
          - Mọi tên cột và trạng thái trên màn có trong bảng nhãn chung docs/nhan-tieng-nhat.md; không còn chuỗi tiếng Việt hay mã thô
          - Mọi ngày trên màn cùng một định dạng YYYY/MM/DD
          - Dòng chênh lệch có nhãn "chênh lệch", cột kỳ gốc, và nền khác (kiểm bằng thuộc tính dữ liệu của phần tử)
          - Màn rộng 390 px không có thanh cuộn ngang, nút tính và chốt nhìn thấy không cần cuộn
        file_cham:
          - src/app/(app)/incentives/page.tsx
          - docs/nhan-tieng-nhat.md (mới, bảng nhãn dùng chung, trong repo này)

      - key: INC-12-ngay-hieu-luc-theo-ky
        title: "Ngày hiệu lực của phiên bản tỷ lệ áp theo kỳ: chọn tháng thay vì ngày, chặn kỳ đã chốt"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
        lam_sau: [INC-05-bang-ty-le-cot-loai-ben-mua]
        boi_canh: |
          PREMISE Q7 chốt áp theo kỳ, ngày hiệu lực luôn là ngày 1 của tháng. B-14: phiên bản có ngày hiệu lực lùi vào kỳ đã chốt vẫn tạo và duyệt được
          nhưng không bao giờ áp dụng. Lớp nặng nhất là API và hàm chọn phiên bản; màn chỉ đổi ô nhập.
        viec: |
          API tạo phiên bản: nhận tháng hiệu lực (YYYY-MM), tự đặt ngày 1, từ chối tháng đã chốt; hàm tính chọn đúng một phiên bản cho cả kỳ
          theo tháng hiệu lực, khi hai phiên bản cùng tháng thì lấy phiên bản duyệt sau theo giờ database. Màn quản trị đổi ô ngày thành ô chọn tháng.
        tieu_chi_xong:
          - Gọi API với ngày 2026-11-15 bị từ chối; với tháng 2026-11 được nhận và lưu ngày 2026-11-01
          - Tháng hiệu lực rơi vào kỳ đã chốt bị từ chối, lỗi nêu kỳ nào
          - Kỳ 2026-11 dùng đúng phiên bản có hiệu lực tháng 11, kỳ 2026-10 vẫn dùng phiên bản cũ
          - "Hai phiên bản cùng tháng hiệu lực: kỳ dùng phiên bản duyệt sau"
        file_cham:
          - src/app/api/rules/route.ts
          - supabase/schema.sql (chọn phiên bản trong hàm tính)
          - src/app/(app)/rules/page.tsx (ô chọn tháng)

      - key: INC-13-bo-test-chuoi-thuong
        title: "Bộ kiểm thử tự động cho chuỗi thưởng: ba ca biên của RFP, đúng hạn, trễ hạn, giao dịch huỷ"
        labels: [nguon:gia-co, doi:qa, constraint:kanno-shoreikin]
        lam_sau: [INC-09a-day-dong-chenh-lech-sang-ky-mo, INC-12-ngay-hieu-luc-theo-ky]
        boi_canh: |
          Nhận xét LAB-3 của giảng viên: có lưới kiểm thử tự động cho chốt chặn quan trọng thì lỗi lộ ra trước khi nộp. Chuỗi thưởng là nơi tiền tính sai
          mà màn hình vẫn trông đúng. INC-06 chỉ thử ca của mình; issue này gom thành bộ chạy lặp lại được.
        viec: |
          Viết kiểm thử chạy trên database Postgres thử do issue X03-00 (epic kiểm thử) dựng bằng một lệnh:
          ba ca biên của phụ lục kiểm thử RFP, ca trả đúng ngày hạn, ca trả trễ một ngày, ca giao dịch huỷ có điều chỉnh, ca đẩy sang kỳ mở.
          Mỗi ca có số kỳ vọng tính tay ghi trong mã kiểm thử. Chạy bằng một lệnh.
        tieu_chi_xong:
          - Một lệnh dựng database thử và chạy toàn bộ; mã thoát 0 khi đúng, khác 0 khi sai
          - Cố ý sửa hệ số thuế thành 1,08 thì kiểm thử báo đỏ
          - Kết quả kiểm thử được ghi vào AI-report khi hoàn thành
        file_cham:
          - tests/incentives.test.ts (mới)
          - package.json (lệnh test)

  - key: E-T12
    title: "Quản trị phiên bản tỷ lệ thưởng: tạo, duyệt, thu hồi, trần 4 lần một năm"
    labels: [constraint:kanno-shoreikin]
    body: |
      Epic gom phần quản trị vòng đời phiên bản tỷ lệ của thưởng thanh toán đủ hạn (完納奨励金): tạo bản nháp, duyệt hoặc từ chối bởi người khác,
      thu hồi, và trần 4 lần thay đổi một năm. Phần cấu trúc bảng tỷ lệ (cột loại bên mua, ép bậc tăng dần, tối đa 4 chữ số thập phân, ngày hiệu lực theo kỳ)
      đã nằm ở epic E-INC (INC-05, INC-12), không lặp lại ở đây; issue màn hình trỏ lam_sau tới INC-12 để dùng chung ô chọn tháng.
      Tiền đề: PREMISE Bảng 3 (Q7 ngày hiệu lực là ngày 1 của tháng), B-08 cách đếm trần có tính bản thu hồi hay không là giả định chờ khách (X-04),
      B-15 hai yêu cầu tạo cùng lúc ở mức 3/4 có thể tạo ra 5 bản một năm.
      Quy tắc đếm đích: bản thu hồi tính vào trần kể từ lần đầu được dùng để tính một kỳ, ghi cố định vào cột "kỳ dùng lần đầu", không nhả khi kỳ tính lại.
      Kiểm thử tự động cho các ca đồng thời nằm ngay trong tiêu chí của T12-01 và T12-02, không tách issue riêng.
      Chú giải mã: SCR-21 màn quản trị phiên bản tỷ lệ; 起票 (khởi tạo) và 承認 (duyệt) phải là hai người khác nhau; 発効日 là ngày hiệu lực.
      Thứ tự làm: T12-01 → T12-02 → T12-03.
    issues:
      - key: T12-01-tao-ban-nhap-khong-vuot-tran-nam
        title: "Tạo bản nháp tỷ lệ không vượt trần 4 lần một năm"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin, lam-ro-voi-khach]
        lam_sau: [INC-12-ngay-hieu-luc-theo-ky, INC-08a-tinh-ky-co-khoa-luu-so-truoc-khi-xoa]
        boi_canh: |
          B-15: prototype đếm số phiên bản trong năm rồi mới chèn, hai lệnh rời không khoá, nên hai người bấm cùng lúc ở mức 3/4 tạo ra 5 bản một năm.
          B-08: prototype tính cả bản đã thu hồi vào trần, nên tạo 4 bản rồi thu hồi cả 4 là hết hạn mức năm đó. Thiết kế LAB-4 chọn: bản thu hồi chỉ tính
          vào trần khi đã từng được dùng để tính một kỳ; là giả định của đội, chưa có xác nhận của khách. Không được suy "đã dùng" từ bảng kết quả thưởng,
          vì kỳ mở tính lại sẽ xoá kết quả cũ (INC-08a) và bản thu hồi bỗng thành "chưa dùng", lách được trần.
          Năm để đếm trần là năm của tháng hiệu lực (INC-12), không phải năm hiện tại của trình duyệt.
        viec: |
          Thêm cột first_used_period (kỳ dùng lần đầu) cho bảng phiên bản; hàm tính thưởng ghi cột này ở lần đầu một kỳ dùng phiên bản, đã có thì không đổi.
          Tạo hàm database create_rule_version chạy trong một giao dịch: giữ khoá theo năm hiệu lực (advisory lock, khoá tên trong database) rồi đếm phiên bản
          của năm đó, loại bản bị từ chối và loại bản thu hồi có kỳ dùng lần đầu trống; đủ 4 thì từ chối với mã lỗi nêu năm và số đã dùng, chưa đủ thì chèn
          và ghi nhật ký. API tạo bản nháp chỉ gọi hàm này, giữ các kiểm tra của INC-05 và INC-12. API đọc danh sách trả thêm số đã dùng và số bản thu hồi
          chưa kỳ nào dùng. Viết kiểm thử tự động cho ca đồng thời, chạy bằng một lệnh.
        tieu_chi_xong:
          - Năm 2027 đã có 3 bản, gửi 10 yêu cầu tạo cùng lúc, đúng 1 thành công; tổng vẫn là 4; kiểm thử tự động cho ca này chạy bằng một lệnh, mã thoát khác 0 khi sai
          - Năm có 4 bản trong đó 1 bản thu hồi chưa kỳ nào dùng thì tạo thêm được 1 bản
          - Bản được kỳ 2026-10 dùng, thu hồi, rồi kỳ 2026-10 tính lại bằng bản khác thì bản thu hồi vẫn tính vào trần, cột kỳ dùng lần đầu vẫn là 2026-10
          - Tạo bản hiệu lực tháng 2027-01 vào tháng 12/2026 được đếm vào năm 2027, không phải 2026
          - Bản bị từ chối không chiếm hạn mức; API danh sách trả đúng hai con số cho các ca trên
        file_cham:
          - supabase/schema.sql (cột rule_versions.first_used_period, hàm create_rule_version mới, ghi cột trong hàm calculate_incentives)
          - src/app/api/rules/route.ts
          - tests/rule-versions.test.ts (mới)

      - key: T12-02-duyet-tu-choi-thu-hoi-an-toan
        title: "Duyệt, từ chối, thu hồi phiên bản tỷ lệ an toàn khi hai người cùng bấm"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
        lam_sau: [T12-01-tao-ban-nhap-khong-vuot-tran-nam]
        boi_canh: |
          Prototype duyệt và thu hồi bằng bốn lệnh rời, không khoá, cập nhật chỉ theo mã nên bản đã thu hồi vẫn duyệt lại được; ghi chú của người duyệt
          ghi đè ghi chú của người khởi tạo; giờ duyệt lấy từ máy ứng dụng; danh sách kỳ đã dùng cắt còn 5 dòng và không kèm trạng thái kỳ nên màn không
          cảnh báo được kỳ đang mở sẽ đổi số; người thu hồi không có email để hiện. Người khởi tạo (起票) và người duyệt (承認) phải khác nhau, giữ như prototype.
        viec: |
          Thêm cột decision_note cho bảng phiên bản, giữ note là ghi chú khởi tạo. Tạo hai hàm database decide_rule_version và rollback_rule_version chạy trong
          một giao dịch: khoá dòng với điều kiện trạng thái đúng (nháp để duyệt hoặc từ chối; đã duyệt để thu hồi), kiểm người duyệt khác người khởi tạo,
          từ chối và thu hồi bắt lý do, giờ lấy now() của database, ghi nhật ký cùng giao dịch. Thu hồi trả đủ mọi kỳ đã dùng kèm trạng thái kỳ (mở hoặc đã chốt).
          API đọc danh sách trả email người thu hồi và người duyệt. Hai API duyệt và thu hồi chỉ gọi hàm; mã sai dạng trả 404. Bổ sung kiểm thử tự động
          vào bộ của T12-01.
        tieu_chi_xong:
          - Người khởi tạo tự duyệt bản của mình bị hàm database từ chối; người khác duyệt thì thành công
          - Hai yêu cầu duyệt cùng lúc, một thành công, một báo bản không còn ở trạng thái nháp; chỉ một dòng nhật ký
          - Duyệt kèm ghi chú thì note của người khởi tạo giữ nguyên và decision_note có ghi chú mới
          - Thu hồi bản đã dùng cho 7 kỳ (2 mở, 5 đã chốt) trả đủ 7 kỳ kèm trạng thái, không cắt còn 5; duyệt lại bản đã thu hồi bị từ chối
          - Từ chối hoặc thu hồi không có lý do bị từ chối ở hàm database; thu hồi bản đang nháp bị từ chối
          - API danh sách có email người thu hồi; giờ duyệt bằng giờ database; bộ kiểm thử một lệnh có ca tự duyệt và ca duyệt lại bản thu hồi
        file_cham:
          - supabase/schema.sql (cột rule_versions.decision_note, hai hàm mới)
          - src/app/api/rules/[id]/decide/route.ts
          - src/app/api/rules/[id]/rollback/route.ts
          - tests/rule-versions.test.ts

      - key: T12-03-man-quan-tri-ty-le-hop-thoai-banner
        title: "Màn quản trị tỷ lệ với hộp thoại xác nhận và banner hạn mức"
        labels: [nguon:chenh-lech, doi:fe, constraint:kanno-shoreikin]
        lam_sau: [T12-02-duyet-tu-choi-thu-hoi-an-toan, INC-10-hop-thoai-xac-nhan-that, INC-12-ngay-hieu-luc-theo-ky]
        boi_canh: |
          Màn SCR-21 dùng hộp thoại trình duyệt cho ba thao tác nhạy cảm (D-12), banner hạn mức đếm theo năm của trình duyệt và tính cả bản thu hồi,
          không hiện người thu hồi, nút Duyệt không có cờ bận theo dòng nên bấm hai lần gọi hai lần. Ô chọn tháng hiệu lực do INC-12 làm; issue này chỉ đọc năm
          từ ô đó để hiện banner. Quy tắc đếm và hai con số do T12-01 cung cấp; danh sách kỳ kèm trạng thái do T12-02 trả.
        viec: |
          Dùng thành phần hộp thoại chung: Duyệt hiện mã bản, tháng hiệu lực, toàn bộ bậc tỷ lệ kèm loại bên mua, hệ số thuế, câu "có hiệu lực cho mọi lần tính từ nay",
          ô ghi chú tuỳ chọn; Từ chối có ô lý do bắt buộc; Thu hồi liệt kê kỳ đã dùng tách hai khối, khối kỳ đang mở màu đỏ với câu "n kỳ đang mở sẽ đổi số ở lần tính
          lại tiếp theo", ô lý do bắt buộc. Banner hạn mức theo năm của tháng hiệu lực đang chọn, hiện "đã dùng n/4" và "m bản thu hồi chưa kỳ nào dùng, không tính".
          Bảng hiện người thu hồi và người duyệt bằng email, cờ bận theo từng dòng.
        tieu_chi_xong:
          - Chọn tháng hiệu lực 2027-01 khi đang ở tháng 12/2026 thì banner hiện hạn mức năm 2027
          - Thu hồi bản đang dùng cho 2 kỳ mở và 5 kỳ đã chốt, hộp thoại hiện hai khối, khối đỏ ghi 2 kỳ đang mở
          - Từ chối hoặc thu hồi bỏ trống lý do thì nút không bấm được, lỗi hiện tại ô
          - Bấm Duyệt hai lần liên tiếp trên một dòng chỉ gọi API một lần; dòng khác vẫn bấm được
          - Bản đã thu hồi hiện email người thu hồi và giờ theo giờ Nhật, không hiện mã tài khoản thô
        file_cham:
          - src/app/(app)/rules/page.tsx
          - src/components/rule-form.tsx (dự kiến)

  - key: E-T13
    title: "Nhật ký thao tác: tra được lịch sử sửa một giao dịch, mã nghiệp vụ hiện đủ, tìm kiếm an toàn"
    labels: []
    body: |
      Epic gom việc của gói T-13 (màn SCR-11 tra lịch sử sửa giao dịch せり và SCR-23 tra cứu nhật ký, cùng đường dẫn /audit).
      Nhận xét LAB-3 của giảng viên: nhật ký thao tác là điểm mạnh của prototype, giữ nguyên nền; epic này chỉ sửa chỗ lệch và gia cố.
      Hai lỗi lõi: D-19 nút "Lịch sử sửa せり" lọc theo thực thể giao dịch trong khi việc sửa được ghi dưới thực thể yêu cầu điều chỉnh, nên không bao giờ khớp;
      B-21 cột entity_id khi là mã định danh UUID, khi là ngày, khi là kỳ thưởng, màn cắt 8 ký tự nên ngày nghiệp vụ hiện thành "2026-08-" mất nghĩa.
      Ngoài ra ô tìm kiếm có lỗ S-01 và từ vựng mã thao tác lệch giữa dữ liệu mẫu và mã nguồn (D-20).
      Bộ lọc theo thao tác ghi ngày thanh toán đã có ở INC-04 của epic thưởng, không lặp. Việc đưa ghi nhật ký vào cùng giao dịch database làm ở từng epic
      nghiệp vụ (INC-08c, T03-01, T04-02); epic này chỉ sửa hàm ghi để không nuốt lỗi, bật bằng cờ cấu hình sau khi các epic kia xong.
      Giả định: không có giả định riêng; epic bám PREMISE.md và thiết kế LAB-4.
      せり (seri) là phiên đấu giá của chợ. Thứ tự làm: T13-01 → T13-02 → T13-03 (ba issue cùng sửa file API và màn, làm tuần tự).
    issues:
      - key: T13-01-cot-ma-nghiep-vu-ten-nguoi-va-tu-vung
        title: "Nhật ký thao tác có cột mã nghiệp vụ, mã giao dịch, tên người thực hiện và bảng từ vựng mã thao tác thống nhất"
        labels: [nguon:chenh-lech, doi:be]
        boi_canh: |
          B-21: cột entity_id là chữ tự do; mã nguồn ghi UUID cho giao dịch và điều chỉnh, nhưng khoá ngày ghi ngày, chốt kỳ thưởng ghi kỳ, xuất báo cáo ghi mã
          báo cáo, dữ liệu mẫu ghi mã nghiệp vụ. Chốt LAB-4: thêm hai cột entity_code (mã nghiệp vụ) và trade_id (UUID giao dịch, có thể trống) thay vì chuẩn hoá
          hết về UUID vì khoá ngày và xuất báo cáo không có UUID. Màn quản trị tài khoản (T03-02) cần tên người thực hiện chụp tại thời điểm thao tác
          (actor_name), prototype chỉ chụp email. D-20: dữ liệu mẫu ghi seri.update còn mã nguồn ghi trade.seri_record. B-20: hàm ghi nhật ký chỉ in lỗi ra
          console rồi bỏ qua, thao tác thành công mà không có vết. Có 9 thao tác bắt buộc lý do: tạm ngưng hồ sơ, sửa thuộc tính lô, huỷ giao dịch, ghi ngoại lệ
          giao hàng, đóng tranh chấp, từ chối hoặc yêu cầu bổ sung điều chỉnh, đổi vai trò, khoá hoặc mở tài khoản, thu hồi phiên bản tỷ lệ.
        viec: |
          Migration: thêm cột entity_code, trade_id, actor_name vào bảng nhật ký, index (trade_id, created_at); chuyển dữ liệu cũ: dòng có entity_id là UUID giao dịch
          thì điền trade_id và entity_code từ bảng giao dịch, dòng của điều chỉnh và giao hàng điền trade_id qua bảng tương ứng, dòng khoá ngày và chốt kỳ chuyển
          giá trị sang entity_code, actor_name điền từ bảng hồ sơ tài khoản. Lập bảng từ vựng mã thao tác tại docs/ma-thao-tac-nhat-ky.md trong repo này, mỗi mã
          có nhãn tiếng Việt và cờ "bắt buộc lý do"; sửa dữ liệu mẫu cho khớp. Hàm ghi nhật ký nhận thêm entity_code, trade_id, tự điền actor_name; khi cờ cấu hình
          AUDIT_STRICT bật thì ném lỗi thay vì nuốt (bật sau khi INC-08c, T03-01, T04-02 xong). Migration có bước quay lại.
        tieu_chi_xong:
          - Sau migration trên dữ liệu mẫu, mọi dòng nhật ký của giao dịch, điều chỉnh, giao hàng có trade_id khác trống; dòng khoá ngày có entity_code là ngày; mọi dòng có actor_name
          - Không còn mã thao tác nào ngoài bảng docs/ma-thao-tac-nhat-ky.md trong dữ liệu mẫu và mã nguồn (lệnh grep ghi trong tài liệu)
          - Bảng từ vựng có đúng 9 mã gắn cờ "bắt buộc lý do"
          - "Cờ AUDIT_STRICT tắt: ghi nhật ký vào bảng bị khoá thì thao tác vẫn qua, có dòng cảnh báo ở log; cờ bật thì hàm ném lỗi"
          - Chạy bước quay lại migration thì ba cột biến mất, số dòng nhật ký không đổi
        file_cham:
          - supabase/schema.sql (cột entity_code, trade_id, actor_name và index của audit_logs)
          - supabase/seed.sql (từ vựng mã thao tác)
          - src/lib/audit.ts
          - docs/ma-thao-tac-nhat-ky.md (mới, trong repo này)

      - key: T13-02-api-nhat-ky-tra-theo-ma-giao-dich-an-toan
        title: "API nhật ký tra được theo mã giao dịch, tìm kiếm không bẻ được bộ lọc, phân trang con trỏ, mỗi lần tra có vết"
        labels: [nguon:chenh-lech, doi:be]
        lam_sau: [T13-01-cot-ma-nghiep-vu-ten-nguoi-va-tu-vung]
        boi_canh: |
          D-19: nút "Lịch sử sửa せり" (せり là phiên đấu giá) đặt bộ lọc thực thể = giao dịch, nhưng giao dịch không bao giờ bị cập nhật (lịch sử bất biến, mọi sửa đổi
          là dòng chênh lệch); việc sửa nằm ở chuỗi yêu cầu điều chỉnh, ghi dưới thực thể điều chỉnh. Kết quả luôn 0 dòng. Chốt: tra theo giao dịch, bốn bước truy vấn,
          sắp theo thời gian tăng dần. S-01 (nghiêm trọng): chuỗi tìm kiếm nhét thẳng vào bộ lọc PostgREST, ở màn này quét cả lý do và email người thực hiện.
          Chốt cho màn này: lọc bỏ các ký tự , ( ) \ * nhưng giữ dấu chấm và @ để tìm được email, giới hạn 100 ký tự. Tham số limit=abc thành NaN. Lỗi database
          trả nguyên văn (S-02). Dropdown hỏng là mất cả màn. Trần 500 dòng là cứng; cần phân trang con trỏ để tra 7 năm dữ liệu (D-27). D-32: tra cứu nhật ký
          là truy cập dữ liệu cá nhân (có email nhân viên) theo luật bảo vệ dữ liệu cá nhân Nhật (APPI), phải ghi vết; ghi vết lỗi thì không trả kết quả.
        viec: |
          API (đường gọi máy chủ) nhận trade_code: kiểm định dạng T-YYMMDD-NNNN (422), tìm giao dịch (không thấy → 404 TRADE_NOT_FOUND), gom id của điều chỉnh
          và giao hàng thuộc giao dịch, trả mọi dòng có trade_id hoặc entity_code khớp bất kể thực thể, sắp created_at tăng dần; bước gom lỗi thì vẫn trả phần tìm được
          kèm cảnh báo. Nhận thêm lot_code: trả mọi dòng của lô (nhận lô, thẩm định, công khai, sửa thuộc tính) và của các giao dịch thuộc lô, cùng thứ tự thời gian. Làm sạch q theo quy tắc trên; limit chỉ nhận số nguyên dương tối đa 500, mặc định 100; thêm cursor và next_cursor. Dropdown hỏng thì vẫn trả
          dòng kèm cờ facets_unavailable. Lỗi database trả câu cố định. Trả X-Query-Ms. Ghi một dòng audit.search với bộ lọc và số dòng (không ghi nội dung) cho mỗi
          lần tra, gọi từ màn sau khi ngừng gõ 500 mili giây; ghi vết lỗi thì trả lỗi, không trả kết quả.
        tieu_chi_xong:
          - "Giao dịch せり trong dữ liệu mẫu đã qua một lần điều chỉnh được duyệt: tra theo mã trả ít nhất 3 dòng (tạo, gửi điều chỉnh, duyệt) theo thời gian tăng dần"
          - Mã sai dạng "T-2026-1" trả 422 nêu đúng định dạng; mã đúng dạng không tồn tại trả 404
          - Tra theo mã một lô đã thẩm định, công khai và có một giao dịch trả đủ các dòng nhận lô, thẩm định, công khai và tạo giao dịch theo thời gian tăng dần
          - "Giả lập lỗi bảng giao hàng: vẫn trả dòng của giao dịch và điều chỉnh, phản hồi có cảnh báo \"Không tra được giao hàng liên quan\""
          - q = "a,action.eq.day.lock" không trả dòng khoá ngày nào; q = "an.nguyen@x" vẫn tìm được dòng có email chứa chuỗi đó
          - q dài 150 ký tự bị cắt còn 100; limit=abc dùng 100; limit=9999 dùng 500; limit=-5 dùng 100
          - Gọi với cursor của dòng thứ 100 trả 100 dòng tiếp không trùng, không sót (script so tổng với số dòng trong bảng)
          - "Giả lập lỗi truy vấn dropdown: 200 có dòng, hai danh sách giá trị rỗng, facets_unavailable = true"
          - Sau một lần tra, nhật ký có dòng audit.search với bộ lọc và số dòng; giả lập lỗi ghi vết thì API trả lỗi và không có kết quả
          - Lỗi database bất kỳ trả "Không tra cứu được, thử lại sau"; mọi phản hồi có header X-Query-Ms là số nguyên
        file_cham:
          - src/app/api/audit/route.ts

      - key: T13-03-man-nhat-ky-gia-co
        title: "Màn nhật ký hiện mã nghiệp vụ đủ và thao tác bằng chữ, cảnh báo khi chạm trần, bộ lọc lên URL"
        labels: [nguon:gia-co, doi:fe]
        lam_sau: [T13-02-api-nhat-ky-tra-theo-ma-giao-dich-an-toan, INC-04-cot-nguon-tien-ve-va-loc-nhat-ky]
        boi_canh: |
          B-21: màn cắt entity_id còn 8 ký tự nên ngày khoá hiện "2026-08-". Nhận xét LAB-3: không lộ mã thô, một kiểu ngày, bộ lọc lên URL để bấm Back còn giữ.
          Chốt LAB-4: chạm trần dòng phải là cảnh báo vàng kèm nút nâng lên 500, không tự nâng; ô lý do trống ở nhóm 9 thao tác bắt buộc lý do phải tô vàng vì là
          tín hiệu kiểm soát; khối JSON trước/sau quá dài đẩy trang; tải lỗi vẫn hiện bộ lọc; cặp thực thể và thao tác không bao giờ giao nhau phải có cảnh báo.
          Huy hiệu mili giây là điểm mạnh, giữ và cộng thêm p95. Bộ lọc thao tác thanh toán do INC-04 làm trên cùng file, không lặp. Nút "Lịch sử sửa せり"
          (せり là phiên đấu giá) chuyển thành ô nhập mã giao dịch gọi API (đường gọi máy chủ) T13-02.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: T13-03.1-ma-nghiep-vu-thao-tac-chu-va-bo-loc-url rồi T13-03.2-trang-sau-to-vang-khoi-truoc-sau-trang-thai-loi.
          Bối cảnh ở trên dùng chung cho hai issue con; tiêu chí xong của từng phần nằm ở issue con.
        tieu_chi_xong:
          - Hai issue con đã đóng, mọi tiêu chí xong của chúng đạt trên cùng một bản deploy
        file_cham:
          - src/app/(app)/audit/page.tsx
        con:
          - key: T13-03.1-ma-nghiep-vu-thao-tac-chu-va-bo-loc-url
            title: "Màn nhật ký hiện mã nghiệp vụ, thao tác bằng chữ, bộ lọc lên URL và ô tìm có trễ"
            labels: [nguon:gia-co, doi:fe]
            boi_canh: |
              Issue con của T13-03-man-nhat-ky-gia-co; đọc bối cảnh ở issue cha.
            viec: |
              Cột thực thể hiện entity_code khi có, chỉ rút gọn khi là UUID (chú thích đầy đủ khi rê chuột). Cột thao tác hiện chữ theo bảng docs/ma-thao-tac-nhat-ky.md. Bộ lọc và ô tìm lên URL; ô tìm trễ 300 mili giây, huỷ yêu cầu cũ, và chỉ gọi ghi vết sau khi ngừng gõ 500 mili giây. Nút "Lịch sử sửa せり" mở ô mã giao dịch.
            tieu_chi_xong:
              - "Dòng khoá ngày hiện \"2026/08/24\" đầy đủ; dòng giao dịch hiện mã T-... thay vì 8 ký tự UUID"
              - "Không còn chuỗi mã thao tác dạng \"profile.role_change\" trên màn; mọi ngày giờ cùng định dạng YYYY/MM/DD HH:mm giờ Nhật"
              - "Chọn thực thể \"tài khoản\", gõ \"admin\", bấm một dòng rồi bấm Back: bộ lọc và ô tìm còn nguyên, URL có tham số"
              - "Gõ nhanh 5 ký tự: nhiều nhất 2 yêu cầu còn sống trong tab Network và chỉ một dòng audit.search được ghi sau khi ngừng gõ"
            file_cham:
              - "src/app/(app)/audit/page.tsx"
          - key: T13-03.2-trang-sau-to-vang-khoi-truoc-sau-trang-thai-loi
            title: "Màn nhật ký: trang sau khi chạm trần, tô vàng lý do trống, khối trước/sau cuộn được, trạng thái lỗi và rỗng"
            labels: [nguon:gia-co, doi:fe]
            lam_sau: [T13-03.1-ma-nghiep-vu-thao-tac-chu-va-bo-loc-url]
            boi_canh: |
              Issue con của T13-03-man-nhat-ky-gia-co; đọc bối cảnh ở issue cha.
            viec: |
              Chạm trần: cảnh báo vàng "Đang hiện N bản ghi đầu, có thể còn nữa" kèm "Nâng lên 500" và "Trang sau" dùng next_cursor. Ô lý do trống ở thao tác có cờ bắt buộc tô vàng. Khối trước/sau giới hạn chiều cao, cuộn trong khối, có "Sao chép", không cắt. Tải lỗi vẫn hiện bộ lọc kèm "Thử lại". Bảng rỗng ghi "Chưa có dòng nhật ký nào". Cạnh huy hiệu mili giây hiện p95 của 50 lần gần nhất từ X-Query-Ms.
            tieu_chi_xong:
              - "Dữ liệu thử có 120 dòng, limit 100: cảnh báo vàng hiện, bấm \"Trang sau\" ra 20 dòng còn lại không trùng dòng nào"
              - "Dòng \"khoá ngày\" có lý do trống được tô vàng; dòng \"tạo giao dịch\" lý do trống không tô"
              - "Khối trước/sau dài 300 dòng JSON không làm trang cao thêm quá 400 px; \"Sao chép\" đưa đủ nội dung vào clipboard"
              - "Tắt API rồi tải màn: cụm bộ lọc vẫn hiện, có \"Thử lại\"; bật lại và bấm thì có dữ liệu mà không tải lại trang"
            file_cham:
              - "src/app/(app)/audit/page.tsx"

  - key: E-T14
    title: "Báo cáo và xuất dữ liệu: đủ 12 báo cáo theo đúng mã của RFP, xuất tệp an toàn, báo cáo ngày xong trước 11:00 giờ Nhật"
    labels: []
    body: |
      Epic gom việc của gói T-14 (màn trung tâm báo cáo SCR-22). Prototype có danh mục 12 báo cáo nhưng chỉ 2 báo cáo xuất tệp thật
      (đối soát ngày, thưởng thanh toán đủ hạn theo kỳ); 10 báo cáo còn lại trả lỗi 501 "chưa làm" (D-05). Mã báo cáo trong danh mục
      không khớp bảng TBL-REPORT-01 của RFP; hai báo cáo đã chạy đúng nội dung nhưng sai mã. Bộ xuất tệp chưa chống công thức (S-05)
      và chưa có tác vụ chạy theo lịch sinh báo cáo ngày trước hạn 11:00 giờ Nhật (D-26).
      Chú giải: CSV là tệp bảng dạng chữ mở được bằng Excel; 完納奨励金 (tiền thưởng thanh toán đủ hạn); 業務日 (ngày nghiệp vụ của chợ, theo giờ Nhật);
      許可 / 承認 (giấy phép / giấy chấp thuận, hai cấp tư cách mua).
      Việc đã có chủ ở nhóm khác, epic này chỉ trỏ lam_sau: che nguyên văn lỗi database (S-02) ở X01-01; chặn vai ở lớp máy chủ và mở menu báo cáo
      cho vai quản trị quy tắc (S-04, D-38) ở X02-01; ngưỡng hồ sơ sắp hết hạn (D-18) ở T02-01; lịch chợ ở T09-01.
      Xuất tệp của màn kết quả thưởng SCR-20 (gói T-11) thuộc epic này (T14-04) để cùng cột, cùng nhãn với báo cáo RPT-07.
      Giả định: hạn xử lý tranh chấp là 2 ngày nghiệp vụ đếm theo lịch chợ (D-47, câu hỏi ở X-04; dùng ở T14-03); RPT-03 chỉ lấy hồ sơ hết hạn trong 90 ngày gần nhất để tệp không phình (T14-05, lựa chọn của đội).
      Thứ tự làm: T14-01 → T14-02 → T14-03 → T14-04 → T14-05 → T14-06 → T14-07 (năm issue đầu cùng sửa một file API nên làm nối tiếp).
    issues:
      - key: T14-01-anh-xa-ma-va-bo-xuat-csv-chung
        title: "Danh mục báo cáo đúng mã RFP và bộ xuất tệp CSV dùng chung an toàn"
        labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
        boi_canh: |
          Hai việc nền cho 10 báo cáo sắp làm, mỗi việc một issue con.
          Một: danh mục báo cáo trong prototype có đủ 12 dòng nhưng mã RPT-01 đến RPT-12 không trùng bảng TBL-REPORT-01 của RFP (D-05).
          Báo cáo "đối soát ngày" đang mang mã RPT-01 nhưng theo RFP phải là RPT-05; báo cáo 完納奨励金 (tiền thưởng thanh toán đủ hạn) theo kỳ đang là RPT-02
          nhưng phải là RPT-07 (vì chạm mã báo cáo thưởng nên gắn nhãn ràng buộc). Prototype có mục "doanh thu theo loài" không nằm trong RFP, trong khi thiếu "báo cáo tháng theo loại giao dịch".
          Hai: mọi báo cáo đi qua một hàm dựng CSV chung (CSV là tệp bảng dạng chữ mở được bằng Excel). Hàm đã làm đúng hai việc: thêm dấu hiệu mã hoá ở đầu tệp (BOM)
          để Excel Nhật đọc đúng tiếng Nhật, và xuống dòng kiểu Windows. Ba việc còn thiếu: S-05, ô chữ bắt đầu bằng = + - @ hoặc ký tự tab không được chặn, mở bằng Excel có thể chạy công thức lạ;
          B-20, hàm ghi nhật ký nuốt lỗi nên tệp vẫn tải được dù nhật ký xuất không ghi; tệp dựng toàn bộ trong bộ nhớ, ngày đỉnh tải (RFP nêu khoảng 1.200 giao dịch) là rủi ro.
          Chống công thức chỉ áp cho cột kiểu chữ; cột số (kể cả số âm như tiền điều chỉnh) giữ nguyên để Excel còn cộng được.
          Việc che nguyên văn lỗi database (S-02) đã có ở X01-01, không làm ở đây. Tệp mô tả kèm báo cáo đối soát ngày làm ở T14-06.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: T14-01.1-danh-muc-12-ma-rfp-va-so-dang-ky-bao-cao rồi T14-01.2-bo-xuat-csv-an-toan-theo-khoi.
          Bối cảnh ở trên dùng chung cho hai issue con; tiêu chí xong của từng phần nằm ở issue con.
        tieu_chi_xong:
          - Hai issue con đã đóng, mọi tiêu chí xong của chúng đạt trên cùng một bản deploy
        file_cham:
          - src/app/api/reports/route.ts (danh mục, tra sổ đăng ký, thứ tự nhật ký và trả tệp)
          - src/app/api/reports/rpt/registry.ts (mới, sổ đăng ký và hướng dẫn)
          - src/lib/csv.ts (chống công thức theo kiểu cột, xuất theo khối)
          - src/lib/audit.ts (không nuốt lỗi cho report.export)
          - src/app/(app)/reports/page.tsx (nhãn và tên tệp theo mã mới)
        con:
          - key: T14-01.1-danh-muc-12-ma-rfp-va-so-dang-ky-bao-cao
            title: "Danh mục 12 báo cáo đúng mã RFP và sổ đăng ký báo cáo"
            labels: [nguon:chenh-lech, doi:be, constraint:kanno-shoreikin]
            boi_canh: |
              Issue con của T14-01-anh-xa-ma-va-bo-xuat-csv-chung; đọc bối cảnh ở issue cha.
            viec: |
              Viết lại danh mục đúng 12 dòng của TBL-REPORT-01, mỗi dòng ghi mã, tên, tham số (ngày nghiệp vụ, kỳ, hoặc không). Chuyển hai báo cáo đang chạy sang mã mới (RPT-05, RPT-07), giữ nguyên nội dung; bỏ mục "doanh thu theo loài"; tên tệp tải về và nhật ký xuất dùng mã mới; ghi chú đối chiếu mã cũ → mã mới ngay trong danh mục. Dựng sổ đăng ký báo cáo: mỗi báo cáo một tệp riêng trong thư mục src/app/api/reports/rpt/, khai cột với kiểu (chữ / số / ngày), đường API chỉ tra sổ. Viết hướng dẫn 10 dòng "cách thêm một báo cáo" ở đầu tệp sổ đăng ký.
            tieu_chi_xong:
              - "Gọi API danh mục trả đúng 12 mã RPT-01..RPT-12 với tên và tham số như trên; không còn mục doanh thu theo loài"
              - "Tải RPT-05 ngày đã khoá ra đúng 17 cột như tệp đối soát ngày cũ, tên tệp RPT-05_YYYY-MM-DD.csv; tải RPT-07 kỳ đã chốt ra đúng 9 cột như tệp thưởng cũ"
            file_cham:
              - "src/app/api/reports/route.ts (danh mục, tra sổ đăng ký, thứ tự nhật ký và trả tệp)"
              - "src/app/api/reports/rpt/registry.ts (mới, sổ đăng ký và hướng dẫn)"
              - "src/app/(app)/reports/page.tsx (nhãn và tên tệp theo mã mới)"
          - key: T14-01.2-bo-xuat-csv-an-toan-theo-khoi
            title: "Bộ xuất CSV chống chèn công thức, xuất theo khối và chỉ trả tệp khi đã ghi nhật ký"
            labels: [nguon:chenh-lech, doi:be]
            lam_sau: [T14-01.1-danh-muc-12-ma-rfp-va-so-dang-ky-bao-cao]
            boi_canh: |
              Issue con của T14-01-anh-xa-ma-va-bo-xuat-csv-chung; đọc bối cảnh ở issue cha.
            viec: |
              Sửa hàm dựng CSV: ô cột kiểu chữ bắt đầu bằng = + - @ tab hoặc xuống dòng thì thêm dấu nháy đơn vào đầu, làm trước bước bọc ngoặc kép theo RFC 4180; cột kiểu số không đụng. Đổi thứ tự trong API thành đọc dữ liệu → ghi nhật ký xuất → trả tệp; nhật ký ghi lỗi thì trả lỗi, không trả tệp. Xuất theo luồng từng khối 500 dòng thay vì nối toàn bộ chuỗi.
            tieu_chi_xong:
              - "Dữ liệu thử có ô chữ \"=1+1\", \"+5\", \"-3\", \"@x\" và ô chứa tab: tệp mở bằng Excel hiện đúng chuỗi, không chạy công thức; ô chữ \"ABC\" không bị thêm dấu nháy"
              - "Cột số có giá trị -3 (tiền điều chỉnh âm) xuất ra vẫn là -3, Excel cộng được; cùng chuỗi \"-3\" ở cột chữ thì thành '-3"
              - "Ô có dấu phẩy, ngoặc kép, xuống dòng vẫn bọc đúng chuẩn; tệp mở bằng Excel trên Windows hiện đúng tiếng Nhật (BOM còn)"
              - "Giả lập nhật ký ghi lỗi (ví dụ khoá bảng nhật ký) thì bấm tải nhận lỗi, không có tệp; nhật ký bình thường thì có đúng một dòng report.export với mã mới và số dòng"
              - "Dựng ngày có 1.500 giao dịch (dữ liệu thử): tệp tải xong, log máy chủ ghi ít nhất 3 khối đã ghi ra; số dòng khớp số dòng trên màn đối soát SCR-17 cùng ngày"
            file_cham:
              - "src/app/api/reports/route.ts (danh mục, tra sổ đăng ký, thứ tự nhật ký và trả tệp)"
              - "src/lib/csv.ts (chống công thức theo kiểu cột, xuất theo khối)"
              - "src/lib/audit.ts (không nuốt lỗi cho report.export)"

      - key: T14-02-nhom-bao-cao-giao-dich-va-lo
        title: "Ba báo cáo theo ngày nghiệp vụ về giao dịch, lô và đối soát kế toán"
        labels: [nguon:moi, doi:be]
        lam_sau: [T14-01-anh-xa-ma-va-bo-xuat-csv-chung, INC-02-api-nhap-csv-tien-ve]
        boi_canh: |
          Ba báo cáo RPT-01, RPT-02, RPT-06 của TBL-REPORT-01 đang trả 501 (D-05). Cả ba lọc theo 業務日 (ngày nghiệp vụ, theo giờ Nhật)
          và đọc từ bảng giao dịch, bảng lô, bảng chênh lệch và nhật ký thao tác đã có trong prototype. RPT-06 cần ngày thanh toán, đọc từ bảng tiền về do INC-02 tạo.
          Cột của ba báo cáo là đề xuất của đội vì RFP chỉ nêu tên báo cáo (chỗ tự quyết); khách đổi cột thì chỉ sửa khai báo cột trong sổ đăng ký.
          Báo cáo không tính lại tiền, chỉ chép số đã chốt trong database. CSV là tệp bảng dạng chữ mở được bằng Excel.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: T14-02.1-rpt-01-va-rpt-02 rồi T14-02.2-rpt-06-doi-soat-ke-toan.
          Bối cảnh ở trên dùng chung cho hai issue con; tiêu chí xong của từng phần nằm ở issue con.
        tieu_chi_xong:
          - Hai issue con đã đóng, mọi tiêu chí xong của chúng đạt trên cùng một bản deploy
        file_cham:
          - src/app/api/reports/rpt/rpt-01.ts (mới)
          - src/app/api/reports/rpt/rpt-02.ts (mới)
          - src/app/api/reports/rpt/rpt-06.ts (mới)
          - src/app/api/reports/rpt/registry.ts (đăng ký ba báo cáo)
          - docs/nhan-tieng-nhat.md (bổ sung nhãn cột)
        con:
          - key: T14-02.1-rpt-01-va-rpt-02
            title: "Báo cáo RPT-01 tổng hợp giao dịch ngày và RPT-02 lịch sử lô"
            labels: [nguon:moi, doi:be]
            boi_canh: |
              Issue con của T14-02-nhom-bao-cao-giao-dich-va-lo; đọc bối cảnh ở issue cha.
            viec: |
              Thêm hai tệp báo cáo vào sổ đăng ký (T14-01), khai kiểu từng cột, nhãn cột tiếng Nhật ghi vào docs/nhan-tieng-nhat.md. RPT-01 tổng hợp giao dịch ngày: một dòng cho mỗi cặp loại giao dịch × loại bên mua, cột và dòng tổng như mô tả ở issue cha. RPT-02 lịch sử lô và trạng thái giao dịch (lọc theo ngày tiếp nhận): một dòng mỗi lô, cột như mô tả ở issue cha.
            tieu_chi_xong:
              - "Tải ba báo cáo với ngày đã khoá trong dữ liệu mẫu: mỗi tệp có đúng các cột nêu trên, nhãn cột tiếng Nhật, ngày dạng YYYY/MM/DD"
              - "RPT-01: tổng số giao dịch của mọi dòng bằng số giao dịch trong ngày trên màn danh sách giao dịch; giao dịch đã huỷ không cộng vào thành tiền"
              - "RPT-02: lô có điều chỉnh số lượng hiện trạng thái đúng; lô chưa công khai có ô thời điểm công khai trống, không hiện mã thô"
              - "Ngày không có giao dịch: tệp chỉ có dòng tiêu đề, số dòng 0, vẫn ghi nhật ký xuất"
            file_cham:
              - "src/app/api/reports/rpt/rpt-01.ts (mới)"
              - "src/app/api/reports/rpt/rpt-02.ts (mới)"
              - "src/app/api/reports/rpt/registry.ts (đăng ký ba báo cáo)"
              - "docs/nhan-tieng-nhat.md (bổ sung nhãn cột)"
          - key: T14-02.2-rpt-06-doi-soat-ke-toan
            title: "Báo cáo RPT-06 xuất đối soát kế toán kèm nguồn ngày thanh toán"
            labels: [nguon:moi, doi:be]
            boi_canh: |
              Issue con của T14-02-nhom-bao-cao-giao-dich-va-lo; đọc bối cảnh ở issue cha.
            viec: |
              Thêm RPT-06 vào sổ đăng ký: một dòng mỗi giao dịch đã xác nhận; cột: mã giao dịch, mã bên mua, tên bên mua, thành tiền gốc, tiền điều chỉnh, thành tiền sau điều chỉnh, hạn thanh toán, ngày thanh toán, nguồn ngày thanh toán (kế toán / nhập tay / chưa có), mã tham chiếu kế toán; đọc bảng tiền về của INC-02, không đọc cột paid_at cũ.
            tieu_chi_xong:
              - "Tải ba báo cáo với ngày đã khoá trong dữ liệu mẫu: mỗi tệp có đúng các cột nêu trên, nhãn cột tiếng Nhật, ngày dạng YYYY/MM/DD"
              - "RPT-06: giao dịch có dòng tiền về nguồn kế toán hiện ngày thanh toán và nguồn Kế toán; giao dịch chưa có dòng tiền về hiện Chưa có, không lấy cột paid_at cũ"
              - "RPT-06: tiền điều chỉnh âm xuất ra là số âm, Excel cộng được (theo quy tắc cột số của T14-01)"
            file_cham:
              - "src/app/api/reports/rpt/rpt-06.ts (mới)"
              - "src/app/api/reports/rpt/registry.ts (đăng ký ba báo cáo)"
              - "docs/nhan-tieng-nhat.md (bổ sung nhãn cột)"

      - key: T14-03-nhom-bao-cao-giao-nhan-tranh-chap-dieu-chinh
        title: "Ba báo cáo vận hành về giao hàng tồn, điều chỉnh sau khoá ngày và tranh chấp"
        labels: [nguon:moi, doi:be, constraint:kanno-shoreikin]
        lam_sau: [T14-02-nhom-bao-cao-giao-dich-va-lo, INC-09a-day-dong-chenh-lech-sang-ky-mo, T09-01-bang-lich-cho-va-man-quan-tri]
        boi_canh: |
          Ba báo cáo RPT-04, RPT-08, RPT-09 của TBL-REPORT-01 đang trả 501 (D-05). Dữ liệu nằm ở bảng đợt giao, bảng điều chỉnh, bảng tranh chấp đã có.
          Theo PREMISE: huỷ một phần và trả lại đều trừ khỏi số đã giao (Q3, D-40), nên "còn lại" đọc từ cùng view số dư mà màn giao nhận dùng, không tự cộng lại.
          RPT-08 hiện kỳ 完納奨励金 (tiền thưởng thanh toán đủ hạn) nhận dòng chênh lệch, cột do INC-09a tạo, nên gắn nhãn ràng buộc.
          SLA (hạn xử lý) tranh chấp: RFP không nêu số; giả định của đội là 2 ngày nghiệp vụ, đếm theo lịch chợ (T09-01, bỏ qua 休市日 tức ngày nghỉ chợ);
          câu hỏi khách ở X04-10. CSV là tệp bảng dạng chữ mở được bằng Excel.
        viec: |
          Thêm ba tệp báo cáo vào sổ đăng ký, khai kiểu cột; nhãn cột tiếng Nhật ghi vào bảng nhãn chung.
          RPT-04 giao hàng tồn và ngoại lệ (lọc theo ngày nghiệp vụ): một dòng mỗi giao dịch còn số lượng chưa giao hoặc có đợt ngoại lệ;
          cột: mã giao dịch, bên mua, mã lô, số lượng hữu hiệu, đã giao, còn lại, số đợt đã giao, loại ngoại lệ (giao vượt / trả lại / huỷ một phần / không), lý do ngoại lệ, trạng thái giao nhận.
          RPT-08 điều chỉnh sau khoá ngày (lọc theo kỳ YYYY-MM của ngày nghiệp vụ gốc): một dòng mỗi yêu cầu điều chỉnh; cột: mã điều chỉnh, mã giao dịch, ngày nghiệp vụ gốc,
          loại điều chỉnh, giá trị trước, giá trị sau, chênh lệch số lượng, chênh lệch tiền, người yêu cầu, người duyệt, thời điểm duyệt, trạng thái (chờ duyệt / đã duyệt / từ chối),
          kỳ thưởng nhận dòng chênh lệch (nếu có).
          RPT-09 tranh chấp và hạn xử lý (lọc theo kỳ YYYY-MM của ngày mở): cột: mã tranh chấp, mã giao dịch, ngày nghiệp vụ, ngày giờ mở, người xử lý, trạng thái, ngày giờ đóng,
          số giờ xử lý (tới lúc đóng hoặc tới lúc xuất nếu còn mở), quá hạn (có / không) theo ngưỡng 2 ngày nghiệp vụ đếm theo lịch chợ.
        tieu_chi_xong:
          - "RPT-04: giao dịch có một đợt trả lại hiện còn lại bằng số hữu hiệu trừ số đã giao đã trừ phần trả lại, khớp màn giao nhận SCR-14 cùng ngày; giao dịch giao đủ không xuất hiện"
          - "RPT-04: đợt giao vượt có lý do hiện loại giao vượt và lý do đúng chữ, không hiện mã thô"
          - "RPT-08: điều chỉnh duyệt sau khi kỳ gốc đã chốt hiện kỳ nhận dòng chênh lệch là kỳ mở gần nhất (cột của INC-09a); điều chỉnh bị từ chối vẫn có dòng với trạng thái từ chối"
          - "RPT-09: tranh chấp mở ngày nghiệp vụ A, đóng trong ngày A+1 hiện quá hạn không; đóng trong ngày A+2 (đúng biên) hiện không; đóng ngày A+3 hiện có"
          - "RPT-09: giữa A và A+2 có một ngày nghỉ chợ thì đóng vào ngày lịch A+3 vẫn là không quá hạn"
          - "RPT-09: tranh chấp còn mở có ô ngày đóng trống và số giờ tính tới thời điểm xuất"
          - "Mỗi lần tải ghi một dòng nhật ký report.export với mã báo cáo và số dòng"
        file_cham:
          - src/app/api/reports/rpt/rpt-04.ts (mới)
          - src/app/api/reports/rpt/rpt-08.ts (mới)
          - src/app/api/reports/rpt/rpt-09.ts (mới)
          - src/app/api/reports/rpt/registry.ts (đăng ký ba báo cáo)
          - docs/nhan-tieng-nhat.md (bổ sung nhãn cột)

      - key: T14-04-nhom-bao-cao-thang-va-quy-tac-thuong
        title: "Ba báo cáo theo kỳ và nút xuất tệp ở màn kết quả thưởng"
        labels: [nguon:moi, doi:be, constraint:kanno-shoreikin]
        lam_sau: [T14-03-nhom-bao-cao-giao-nhan-tranh-chap-dieu-chinh, INC-12-ngay-hieu-luc-theo-ky, INC-11-man-ket-qua-thuong-gia-co]
        boi_canh: |
          Ba báo cáo RPT-10, RPT-11, RPT-12 của TBL-REPORT-01 đang trả 501 (D-05). RPT-10 và RPT-12 chạm tới 完納奨励金 (tiền thưởng thanh toán đủ hạn):
          RPT-10 chép số thưởng đã chốt từ bảng kết quả thưởng, RPT-12 liệt kê phiên bản bảng tỷ lệ có tháng hiệu lực (発効日, theo INC-12).
          Màn kết quả thưởng SCR-20 cần nút xuất tệp; theo INC-11, nút đó thuộc epic này để cùng cột, cùng nhãn với RPT-07. Làm sau INC-11 để dùng nhãn Nhật trong bảng nhãn chung
          và tránh đụng cùng tệp màn hình. Báo cáo không tính lại tiền, chỉ chép số đã chốt. CSV là tệp bảng dạng chữ mở được bằng Excel.
        viec: |
          Thêm ba tệp báo cáo vào sổ đăng ký, khai kiểu cột; nhãn cột tiếng Nhật ghi vào bảng nhãn chung.
          RPT-10 báo cáo tháng theo người tham gia (lọc theo kỳ YYYY-MM): một dòng mỗi người tham gia có phát sinh; cột: mã, tên, loại người tham gia, số giao dịch mua, tổng tiền mua,
          số giao dịch bán, tổng tiền bán, tổng tiền điều chỉnh, số tranh chấp, số tiền thưởng đã chốt trong kỳ (trống nếu kỳ chưa chốt).
          RPT-11 báo cáo tháng theo loại giao dịch (lọc theo kỳ): một dòng mỗi cặp ngày nghiệp vụ × loại giao dịch (thoả thuận, せり tức đấu giá);
          cột: ngày nghiệp vụ, loại giao dịch, số giao dịch, tổng số lượng, tổng thành tiền, số huỷ; dòng tổng tháng cuối tệp.
          RPT-12 thay đổi quy tắc và phiên bản áp dụng (không tham số): một dòng mỗi phiên bản tỷ lệ; cột: mã phiên bản, tháng hiệu lực, trạng thái (nháp / đã duyệt / đã thu hồi),
          người tạo, người duyệt, thời điểm duyệt, lý do, danh sách kỳ đã áp dụng (cách nhau bằng dấu chấm phẩy).
          Thêm nút xuất tệp trên màn kết quả thưởng SCR-20 với nhãn Nhật lấy từ bảng nhãn chung: gọi đúng API RPT-07 với kỳ đang xem, không dựng tệp riêng.
        tieu_chi_xong:
          - "RPT-10 kỳ đã chốt: tổng cột thưởng bằng tổng trên màn kết quả thưởng cùng kỳ; kỳ chưa chốt thì cột thưởng trống cho mọi dòng"
          - "RPT-10: người tham gia có cả mua và bán trong kỳ có đủ hai nhóm cột; người không phát sinh không có dòng"
          - "RPT-11: tổng của dòng tổng tháng bằng tổng của RPT-01 từng ngày trong tháng (so bằng tay với 2 ngày mẫu)"
          - "RPT-12: phiên bản đã thu hồi vẫn có dòng với trạng thái đã thu hồi; tỷ lệ không xuất hiện trong báo cáo này (chỉ ở RPT-07)"
          - "Nút xuất tệp ở SCR-20 có nhãn nằm trong docs/nhan-tieng-nhat.md, tải tệp đúng 9 cột như RPT-07, tên tệp RPT-07_YYYY-MM.csv, ghi một dòng nhật ký report.export như tải từ màn báo cáo"
          - "Vai không được đọc báo cáo (ví dụ vai tiếp nhận) không thấy nút ở SCR-20 và gọi API nhận lỗi quyền"
        file_cham:
          - src/app/api/reports/rpt/rpt-10.ts (mới)
          - src/app/api/reports/rpt/rpt-11.ts (mới)
          - src/app/api/reports/rpt/rpt-12.ts (mới)
          - src/app/api/reports/rpt/registry.ts (đăng ký ba báo cáo)
          - src/app/(app)/incentives/page.tsx (nút xuất tệp)
          - docs/nhan-tieng-nhat.md (bổ sung nhãn cột và nhãn nút)

      - key: T14-05-bao-cao-ho-so-tu-cach-het-han
        title: "Báo cáo hồ sơ tư cách đã hết hạn và sắp hết hạn theo ngưỡng cấu hình"
        labels: [nguon:moi, doi:be]
        lam_sau: [T14-04-nhom-bao-cao-thang-va-quy-tac-thuong, T02-01-bang-cau-hinh-nguong-het-han]
        boi_canh: |
          Báo cáo RPT-03 của TBL-REPORT-01 đang trả 501 (D-05). Tư cách mua có hai cấp riêng: 許可 (giấy phép) và 承認 (giấy chấp thuận), mỗi cấp một ngày hết hạn (D-21), không được gộp.
          Ngưỡng "sắp hết hạn" và hàm tính ngày cuối cửa sổ do T02-01 sở hữu, đọc từ bảng cấu hình chung; issue này chỉ gọi hàm đó, không tự tính.
          Cửa sổ tính theo ngày giờ Nhật, biên đóng hai đầu: hết hạn đúng ngày cuối cửa sổ vẫn nằm trong danh sách, khớp màn SCR-05.
          Con số "đã hết hạn trong 90 ngày gần nhất" là lựa chọn của đội để tệp không phình, không cần hỏi khách. CSV là tệp bảng dạng chữ mở được bằng Excel.
        viec: |
          Thêm RPT-03 vào sổ đăng ký (không tham số ngày): một dòng cho mỗi cặp người tham gia × cấp tư cách còn hiệu lực hoặc đã hết hạn trong 90 ngày gần nhất;
          cột: mã người tham gia, tên, loại người tham gia, cấp tư cách (許可 / 承認), ngày cấp, ngày hết hạn, số ngày còn lại (cột số, âm nếu đã hết),
          tình trạng (đã hết hạn / sắp hết hạn / còn hạn), trạng thái hoạt động của người tham gia. Sắp theo số ngày còn lại tăng dần. Nhãn cột tiếng Nhật ghi vào bảng nhãn chung.
        tieu_chi_xong:
          - "Người tham gia có 許可 còn 10 ngày và 承認 còn 60 ngày có hai dòng riêng, một dòng sắp hết hạn, một dòng còn hạn"
          - "Hồ sơ hết hạn đúng ngày cuối cửa sổ (hôm nay cộng ngưỡng, giờ Nhật) nằm trong nhóm sắp hết hạn; ngày kế tiếp thuộc còn hạn"
          - "Hồ sơ hết hạn cách đây 5 ngày có số ngày còn lại là -5 ở cột số, Excel sắp xếp được; hồ sơ hết hạn cách đây 91 ngày không có dòng"
          - "Máy chủ đặt múi giờ UTC, chạy lúc 17:30 UTC (02:30 giờ Nhật hôm sau): số ngày còn lại tính theo ngày Nhật, không lệch một ngày"
          - "Đổi ngưỡng trong bảng cấu hình chung (T02-01) từ 30 thành 45: danh sách sắp hết hạn của báo cáo khớp số dòng của bộ lọc sắp hết hạn trên màn SCR-05, không sửa mã"
        file_cham:
          - src/app/api/reports/rpt/rpt-03.ts (mới, gọi hàm cửa sổ ngưỡng của T02-01)
          - src/app/api/reports/rpt/registry.ts (đăng ký báo cáo)
          - docs/nhan-tieng-nhat.md (bổ sung nhãn cột)

      - key: T14-06-tac-vu-bao-cao-ngay-va-giam-sat-han-11-gio
        title: "Tác vụ theo lịch sinh sẵn báo cáo đối soát ngày lúc 10:30 giờ Nhật và báo lỗi nếu 11:00 chưa có tệp"
        labels: [nguon:moi, doi:be]
        lam_sau: [T14-05-bao-cao-ho-so-tu-cach-het-han, T15-01-bang-quy-tac-va-ham-sinh-thong-bao]
        boi_canh: |
          RFP đòi báo cáo ngày xong trước 11:00 giờ Nhật (D-26). Prototype không có tác vụ chạy theo lịch nào (job); mọi báo cáo sinh khi có người bấm.
          Thiết kế LAB-4 chốt: job chạy 10:30 giờ Nhật sinh sẵn RPT-05 (đối soát ngày) cho mọi 業務日 (ngày nghiệp vụ) đã khoá trong hôm đó, lưu vào kho tệp;
          11:00 kiểm lại, chưa có tệp thì sinh thông báo loại "lỗi xuất dữ liệu" bằng hàm sinh thông báo chung của T15-01.
          Theo yêu cầu định dạng mở của RFP, tệp đối soát ngày cần kèm tệp mô tả cách khớp số (chuyển từ bộ xuất chung sang đây vì chỉ RPT-05 cần).
          Chỗ tự quyết: lịch đặt bằng pg_cron như T09-02, lịch gọi một đường API nội bộ của ứng dụng kèm khoá đặt trong biến môi trường (không ghi vào repo);
          issue này sở hữu hàm kiểm khoá dùng chung và tài liệu lịch chạy duy nhất docs/job-lich-chay.md; các job khác (T15-02, T15-04) chỉ thêm dòng vào tài liệu đó.
          Kho tệp chứa dữ liệu giao dịch nên là kho riêng tư, chỉ tải qua API có kiểm quyền.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: T14-06.1-sinh-san-rpt-05-luc-10-30 rồi T14-06.2-giam-sat-moc-11-gio-va-lich-job.
          Bối cảnh ở trên dùng chung cho hai issue con; tiêu chí xong của từng phần nằm ở issue con.
        tieu_chi_xong:
          - Hai issue con đã đóng, mọi tiêu chí xong của chúng đạt trên cùng một bản deploy
        file_cham:
          - supabase/schema.sql (bảng report_runs, lịch pg_cron)
          - src/lib/jobs/auth.ts (mới, hàm kiểm khoá dùng chung)
          - src/app/api/jobs/daily-report/route.ts (mới, đường job)
          - src/app/api/reports/route.ts (lần sinh gần nhất, đường tải tệp sinh sẵn)
          - docs/job-lich-chay.md (mới, trong repo này)
        con:
          - key: T14-06.1-sinh-san-rpt-05-luc-10-30
            title: "Tác vụ 10:30 giờ Nhật sinh sẵn RPT-05 kèm tệp mô tả, lưu kho riêng, tải qua API có kiểm quyền"
            labels: [nguon:moi, doi:be]
            boi_canh: |
              Issue con của T14-06-tac-vu-bao-cao-ngay-va-giam-sat-han-11-gio; đọc bối cảnh ở issue cha.
            viec: |
              Tạo migration (có bước quay lại) bảng report_runs: mã báo cáo, ngày nghiệp vụ, thời điểm sinh, đường dẫn tệp, số dòng, trạng thái thành công / lỗi, thông điệp lỗi. Viết hàm kiểm khoá job dùng chung (so khoá trong tiêu đề yêu cầu với biến môi trường). Đường API nội bộ mốc 10:30 giờ Nhật dựng RPT-05 cho mọi ngày đã khoá chưa có bản sinh, kèm tệp RPT-05_YYYY-MM-DD.meta.json ghi phiên bản cấu trúc, danh sách cột và kiểu, hai công thức (số lượng hữu hiệu = số lượng + tổng chênh lệch; còn lại = hữu hiệu − đã giao), thời điểm xuất theo giờ Nhật, số dòng, trạng thái ngày lúc xuất; lưu vào kho tệp riêng tư của Supabase, ghi report_runs. Chạy lại trong cùng ngày không sinh tệp trùng. API danh mục trả thêm "lần sinh gần nhất" cho RPT-05; đường tải tệp sinh sẵn đi qua API có kiểm quyền (ba vai của màn báo cáo). Đặt lịch pg_cron 10:30.
            tieu_chi_xong:
              - "Dữ liệu thử có 2 ngày đã khoá: gọi đường job 10:30 thì report_runs có 2 dòng thành công, kho tệp có 2 cặp csv và meta.json; gọi lại lần hai không thêm dòng, không thêm tệp"
              - "meta.json đọc được bằng trình đọc JSON và có đủ 6 mục nêu ở phần việc"
              - "Gọi đường job không kèm khoá đúng nhận lỗi quyền, không chạy gì; hàm kiểm khoá có kiểm thử đơn vị"
              - "Người chưa đăng nhập hoặc vai tiếp nhận mở đường dẫn tệp trong kho nhận lỗi quyền; vai đối soát tải được qua API"
              - "Tệp sinh sẵn có số dòng bằng tệp tải tay cùng ngày sau khi ngày đã khoá"
            file_cham:
              - "supabase/schema.sql (bảng report_runs, lịch pg_cron)"
              - "src/lib/jobs/auth.ts (mới, hàm kiểm khoá dùng chung)"
              - "src/app/api/jobs/daily-report/route.ts (mới, đường job)"
              - "src/app/api/reports/route.ts (lần sinh gần nhất, đường tải tệp sinh sẵn)"
          - key: T14-06.2-giam-sat-moc-11-gio-va-lich-job
            title: "Tác vụ 11:00 giờ Nhật báo lỗi khi thiếu tệp báo cáo ngày, kèm tài liệu lịch các job"
            labels: [nguon:moi, doi:be]
            lam_sau: [T14-06.1-sinh-san-rpt-05-luc-10-30, T15-01.2-ham-ghi-thong-bao-dung-chung]
            boi_canh: |
              Issue con của T14-06-tac-vu-bao-cao-ngay-va-giam-sat-han-11-gio; đọc bối cảnh ở issue cha.
            viec: |
              Mốc 11:00 quét lại report_runs, ngày nào thiếu tệp thì gọi hàm ghi thông báo loại lỗi xuất dữ liệu (người nhận theo quy tắc T15-01) kèm link tới màn báo cáo. Đặt lịch pg_cron 11:00. Viết docs/job-lich-chay.md liệt kê mọi job (kể cả T09-02), giờ chạy, khoá, cách chạy tay.
            tieu_chi_xong:
              - "Giả lập lỗi dựng (ví dụ khoá view số dư) rồi gọi đường job 11:00: có đúng một thông báo lỗi xuất dữ liệu cho ngày lỗi, người nhận đúng quy tắc mặc định"
              - "Máy chủ đặt múi giờ khác Nhật: mốc 10:30 và 11:00 vẫn hiểu theo giờ Nhật (kiểm bằng thời điểm chạy ghi trong report_runs); hai lịch hiện trong danh sách pg_cron sau migration"
              - "docs/job-lich-chay.md có đủ dòng cho job T09-02, mốc 10:30 và mốc 11:00, mỗi dòng ghi giờ chạy theo giờ Nhật và lệnh chạy tay"
            file_cham:
              - "supabase/schema.sql (bảng report_runs, lịch pg_cron)"
              - "src/app/api/jobs/daily-report/route.ts (mới, đường job)"
              - "docs/job-lich-chay.md (mới, trong repo này)"

      - key: T14-07-man-trung-tam-bao-cao-gia-co
        title: "Màn trung tâm báo cáo hiện trạng thái ngày và kỳ, tải bằng nút có trạng thái đang dựng"
        labels: [nguon:gia-co, doi:fe]
        lam_sau: [T14-06-tac-vu-bao-cao-ngay-va-giam-sat-han-11-gio, X02-01-chan-vai-vao-man-va-duong-dan-cho-phep-sau-dang-nhap]
        boi_canh: |
          Màn SCR-22 dành cho ba vai: đối soát (settlement), quản trị hệ thống (sys_admin), quản trị quy tắc (rule_admin); vai khác không được vào.
          Chỗ hở theo thiết kế LAB-4: ô chọn ngày và kỳ không cho biết ngày nào đã khoá, kỳ nào đã chốt; nút tải là thẻ liên kết nên bấm hai lần tải hai tệp và lỗi 501 hay 422 rơi ra trang JSON thô;
          chưa có cột "lần sinh gần nhất" và cảnh báo quá hạn 11:00. Việc chặn vai ở lớp máy chủ và thêm /reports vào menu của vai quản trị quy tắc đã thuộc X02-01, issue này chỉ dùng lại.
          Lớp nặng nhất là màn hình; API chỉ thêm trạng thái vào danh sách ngày và kỳ. CSV là tệp bảng dạng chữ mở được bằng Excel.
        viec: |
          Ô chọn ngày hiện kèm "(đã khoá)" hoặc "(còn mở)", ô chọn kỳ hiện "(đã chốt)" hoặc "(đang mở)"; chọn ngày còn mở hoặc kỳ chưa chốt thì hiện cảnh báo vàng, không chặn;
          kỳ chưa từng tính thì cảnh báo "tệp sẽ rỗng". Nút tải gọi API rồi nhận tệp qua trình duyệt: trong lúc chờ nút đổi thành "Đang dựng..." và khoá; lỗi hiện bằng chữ trên màn, không mở trang JSON.
          Thiếu ngày hoặc kỳ thì nút mờ kèm chú thích. Thêm cột "Lần sinh gần nhất" cho RPT-05 và cảnh báo vàng nếu sau 11:00 giờ Nhật chưa có tệp của hôm nay (đọc từ T14-06).
          Bỏ dòng "Prototype hiện thực thật 2/12", thay bằng số báo cáo sẵn sàng đếm từ API.
        tieu_chi_xong:
          - "Ô ngày hiện 2026/08/24 (đã khoá) cho ngày đã khoá trong dữ liệu mẫu; chọn ngày còn mở thì cảnh báo vàng xuất hiện và vẫn tải được"
          - "Bấm Tải CSV hai lần nhanh: chỉ một tệp tải về, một dòng nhật ký xuất; trong lúc chờ nút khoá và ghi Đang dựng..."
          - "Giả lập API trả 422 (kỳ rỗng) khi bấm nút: lỗi hiện bằng chữ trên màn, không mở trang JSON thô"
          - "Đăng nhập lần lượt ba vai đối soát, quản trị hệ thống, quản trị quy tắc: cả ba mở được màn và thấy đủ 12 dòng; vai xem gõ /reports thấy trang 403 của X02-01"
          - "Sau 11:00 giờ Nhật, dữ liệu thử không có tệp RPT-05 của hôm nay: cảnh báo vàng hiện; có tệp thì không hiện và cột Lần sinh gần nhất ghi giờ Nhật"
        file_cham:
          - src/app/(app)/reports/page.tsx
          - src/app/api/reports/route.ts (trạng thái ngày và kỳ trong danh sách)

  - key: E-T15
    title: "Quy tắc thông báo và gửi thông báo: bảng quy tắc, sinh thông báo từ sự kiện, gửi email có thử lại, hàng đợi cảnh báo"
    labels: []
    body: |
      Epic làm mới hoàn toàn gói T-15 (màn cài đặt thông báo SCR-24 và màn hàng đợi cảnh báo SCR-25). Prototype không có bảng, không có API, không có tác vụ theo lịch nào
      cho việc này (D-03, D-31): thông báo trong hộp thư toàn là dữ liệu mẫu, kênh email chỉ là nhãn "(mock)", không có thử lại, không có hàng đợi lỗi.
      RFP yêu cầu thông báo trong ứng dụng và email, gửi hỏng thì thử lại tối đa 3 lần rồi đưa vào hàng đợi cảnh báo vận hành (D-31). Đội hiểu "thử lại tối đa 3 lần" là
      3 lần sau lần gửi đầu (tổng tối đa 4 lần gửi), khoảng cách 1, 5, 30 phút.
      Sáu loại thông báo: hồ sơ sắp hết hạn, tranh chấp mở, điều chỉnh chờ duyệt, lỗi xuất dữ liệu, giao hàng tồn đọng (năm loại theo thiết kế LAB-4) và
      "kỳ thưởng đã chốt" (loại thứ sáu, thêm theo yêu cầu bẻ việc; quy tắc mặc định ở T15-01).
      Ngưỡng "hồ sơ sắp hết hạn" (D-18) do T02-01 sở hữu trong bảng cấu hình chung; epic này đọc và cho sửa qua màn, không tạo ngưỡng thứ hai.
      Chú giải: 業務日 (ngày nghiệp vụ, theo giờ Nhật); 休市日 (ngày nghỉ chợ); 許可 / 承認 (giấy phép / giấy chấp thuận); 完納奨励金 (tiền thưởng thanh toán đủ hạn).
      Giả định (lựa chọn của đội, sửa được qua quy tắc): "thử lại tối đa 3 lần" là 3 lần sau lần gửi đầu, khoảng cách 1, 5, 30 phút (T15-02).
      Thứ tự làm: T15-01 (cần T16-01 và T02-01) → T15-02 → T15-03 và T15-04 → T15-05 và T15-06. T14-06 chờ T15-01; T16-03 chờ T15-03.
    issues:
      - key: T15-01-bang-quy-tac-va-ham-sinh-thong-bao
        title: "Bảng quy tắc thông báo có phiên bản, API lưu quy tắc và hàm ghi thông báo dùng chung"
        labels: [nguon:moi, doi:be]
