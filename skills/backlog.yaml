            boi_canh: |
              Issue con của T06-02b-api-va-man-xac-nhan-dau-gia; đọc bối cảnh ở issue cha.
            viec: |
              Hai API POST xác nhận và trả lại gọi hàm của T06-02a, trả thông điệp đọc được. View số dư giao dịch và view đối soát ngày chỉ đọc giao dịch confirmed (đã xác nhận); hàm ghi đợt giao từ chối giao dịch chưa confirmed với mã SERI_RESULT_PENDING; API danh sách giao dịch trả số kết quả chờ xác nhận theo ngày.
            tieu_chi_xong:
              - "Giao dịch chờ xác nhận không có trong bảng đối soát ngày; gọi ghi đợt giao cho nó nhận 409 SERI_RESULT_PENDING"
              - "API danh sách trả đúng số kết quả chờ xác nhận của ngày (đếm tay khớp)"
            file_cham:
              - "src/app/api/trades/[id]/confirm/route.ts (mới)"
              - "src/app/api/trades/[id]/return/route.ts (mới)"
              - "src/app/api/trades/route.ts"
              - "supabase/schema.sql (view v_trade_balance, v_daily_settlement; hàm ghi đợt giao phần kiểm trạng thái)"
          - key: T06-02b.2-nut-va-hop-thoai-xac-nhan-tren-man-giao-dich
            title: "Nút và hộp thoại xác nhận hoặc trả lại kết quả đấu giá trên màn giao dịch"
            labels: [nguon:chenh-lech, doi:fe]
            lam_sau: [T06-02b.1-api-xac-nhan-tra-lai-va-view-chi-doc-da-xac-nhan]
            boi_canh: |
              Issue con của T06-02b-api-va-man-xac-nhan-dau-gia; đọc bối cảnh ở issue cha.
            viec: |
              Nút "Xác nhận" và "Trả lại" trên dòng chờ, chỉ hiện với vai giao dịch không phải người nhập; hộp thoại xác nhận hiện mã, lô, bên mua, số lượng, đơn giá, thành tiền, tồn lô sau khi trừ; hộp trả lại có ô lý do bắt buộc; huy hiệu bằng chữ cho ba trạng thái; bộ lọc trạng thái mặc định "Chờ xác nhận"; tổng tiền đầu trang chỉ cộng confirmed; thông điệp QTY_EXCEEDED của đấu giá có đường dẫn sang SCR-19.
            tieu_chi_xong:
              - "Người vừa nhập không thấy nút xác nhận trên dòng đó; đăng nhập bằng tài khoản vai giao dịch thứ hai thì thấy"
              - "Trả lại với ô lý do trống thì lỗi hiện tại ô, không gọi API"
              - "Hộp xác nhận hiện tồn lô sau khi trừ đúng bằng tồn hiện tại trừ số lượng (một ca số cụ thể trên dữ liệu mẫu)"
              - "Bấm xác nhận hai lần chỉ gọi API một lần; nút đổi thành \"Đang xác nhận\" và khoá"
              - "Tổng tiền đầu trang không đổi khi thêm kết quả chờ xác nhận, chỉ đổi sau khi xác nhận"
