              - "docs/job-lich-chay.md (thêm dòng)"
          - key: T15-02.2-thu-lai-het-luot-va-dong-treo
            title: "Thử lại gửi email theo nhịp 1, 5, 30 phút, chuyển hết lượt, đưa lại dòng treo và báo quản trị"
            labels: [nguon:moi, doi:be]
            lam_sau: [T15-02.1-xep-hang-gui-va-job-gui-lan-dau]
            boi_canh: |
              Issue con của T15-02-gui-email-co-thu-lai-va-hang-doi-het-luot; đọc bối cảnh ở issue cha.
            viec: |
              Gửi hỏng thì tăng số lần thử lại và đặt thời điểm thử tiếp theo khoảng cách 1/5/30 phút; hỏng khi đã dùng hết số lần thử lại của phiên bản quy tắc lúc xếp thì chuyển hết lượt; dòng đang xử lý quá 15 phút không ai kết thúc thì đưa lại hàng đợi. Dòng hết lượt thì gọi hàm ghi thông báo loại "lỗi xuất dữ liệu" cho vai quản trị; thông báo sinh từ lỗi gửi không sinh tiếp thông báo lỗi gửi khác.
            tieu_chi_xong:
              - "Giả lập nhà cung cấp email luôn trả lỗi: dòng email được gửi tổng cộng 4 lần (1 lần đầu + 3 thử lại), thời điểm thử tiếp cách lần hỏng trước lần lượt 1, 5, 30 phút, rồi chuyển hết lượt; dòng trong ứng dụng đã gửi ngay lần đầu"
              - "Nhà cung cấp hỏng lần đầu, thành công ở lần thử lại thứ nhất: dòng là đã gửi, số lần thử lại 1, không thử thêm"
              - "Quy tắc có số lần thử lại tối đa 1: dòng hết lượt sau 2 lần gửi; màn hàng đợi (T15-06) hiện 1/1 theo phiên bản lúc xếp dù quy tắc hiện hành đã đổi thành 3"
              - "Có dòng đang xử lý để 16 phút không ai kết thúc: job đưa lại hàng đợi và gửi được"
              - "Dòng hết lượt sinh đúng một thông báo lỗi xuất dữ liệu cho vai quản trị; giả lập chính thông báo đó cũng hết lượt thì không sinh thêm thông báo nào"
            file_cham:
              - "src/lib/notifications/create.ts (xếp hàng gửi sau khi ghi)"
              - "src/lib/notifications/email-provider.ts (mới, đọc cấu hình từ biến môi trường)"
              - "src/app/api/jobs/send-notifications/route.ts (mới, đường job)"

      - key: T15-03-sinh-thong-bao-tu-ba-su-kien-tuc-thoi
        title: "Sinh thông báo thật khi mở tranh chấp, gửi yêu cầu điều chỉnh và chốt kỳ thưởng"
        labels: [nguon:moi, doi:be, constraint:kanno-shoreikin]
        lam_sau: [T15-01-bang-quy-tac-va-ham-sinh-thong-bao, INC-08b-ham-chot-ky-mot-giao-dich]
        boi_canh: |
          Không một dòng mã nào trong prototype sinh thông báo; mọi thông báo đang thấy là dữ liệu mẫu (D-31, D-06). Issue này nối hàm ghi thông báo của T15-01 vào ba sự kiện tức thời;
          hai sự kiện theo ngưỡng (hồ sơ sắp hết hạn, giao hàng tồn) làm ở T15-04; "lỗi xuất dữ liệu" đã nối ở T14-06 và T15-02.
          Sự kiện "kỳ 完納奨励金 (tiền thưởng thanh toán đủ hạn) đã chốt" là loại thứ sáu (chỗ tự quyết, giữ theo quyết định ngày 19/10): gọi SAU khi hàm chốt kỳ của INC-08b đã cam kết,
          ngoài giao dịch database, cố gắng tốt nhất; lỗi sinh thông báo không bao giờ huỷ việc chốt, chỉ ghi dòng cảnh báo vào log máy chủ và nhật ký thao tác.
          Hai sự kiện còn lại gọi trong API sau khi ghi thành công, cùng cách cố gắng tốt nhất.
        viec: |
          Nối hàm ghi thông báo vào ba chỗ: API tạo tranh chấp (sau khi ghi thành công, tham số ngày nghiệp vụ và mã tranh chấp); API tạo yêu cầu điều chỉnh (sau khi ghi thành công, mã yêu cầu);
          API chốt kỳ thưởng (sau khi hàm database close_incentive_period trả về thành công, tham số kỳ và tổng thưởng). Cả ba bọc trong khối bắt lỗi: lỗi sinh thông báo thì ghi log cảnh báo
          và một dòng nhật ký "không sinh được thông báo" kèm mã đối tượng, phản hồi API vẫn thành công. Viết ba mẫu câu tiếng Nhật vào tệp mẫu câu của T15-01.
        tieu_chi_xong:
          - "Tạo một tranh chấp bằng vai đối soát: mỗi người thuộc vai nhận theo quy tắc có đúng một thông báo tranh chấp mở, link mở đúng màn đối soát ngày đó; vai xem không nhận"
          - "Tạo yêu cầu điều chỉnh: người vai đối soát nhận thông báo điều chỉnh chờ duyệt, bấm link mở màn điều chỉnh đã lọc chờ duyệt"
          - "Chốt kỳ thưởng 2026-09 (dữ liệu mẫu): vai đối soát và vai quản trị quy tắc nhận thông báo kỳ thưởng đã chốt có mã kỳ và tổng thưởng; chốt bị từ chối (kỳ đã chốt) thì không sinh thông báo"
          - "Giả lập hàm ghi thông báo lỗi (ví dụ bỏ quy tắc loại kỳ thưởng đã chốt khỏi bảng) rồi chốt kỳ: kỳ vẫn chốt thành công, có dòng nhật ký không sinh được thông báo, phản hồi API là thành công"
          - "Giả lập lỗi tương tự khi tạo tranh chấp: tranh chấp vẫn tạo, có dòng nhật ký cảnh báo"
        file_cham:
          - src/app/api/disputes/route.ts
          - src/app/api/corrections/route.ts
          - src/app/api/incentives/[period]/close/route.ts (gọi sau khi hàm database trả về)
          - src/lib/notifications/create.ts (ba mẫu câu)

      - key: T15-04-tac-vu-quet-nguong-ho-so-va-giao-hang-ton
        title: "Tác vụ theo lịch quét hồ sơ sắp hết hạn và giao hàng tồn đọng theo giờ gửi của quy tắc"
        labels: [nguon:moi, doi:be]
        lam_sau: [T15-01-bang-quy-tac-va-ham-sinh-thong-bao, T14-06-tac-vu-bao-cao-ngay-va-giam-sat-han-11-gio, T02-01-bang-cau-hinh-nguong-het-han]
        boi_canh: |
          Hai loại thông báo theo ngưỡng không có sự kiện tức thời, phải có tác vụ chạy theo lịch (job) quét: hồ sơ 許可 / 承認 (giấy phép / giấy chấp thuận) sắp hết hạn trong cửa sổ ngưỡng,
          và giao dịch còn số lượng chưa giao sau khung giờ giao hàng. Giờ gửi lấy từ quy tắc hiệu lực (mặc định 08:00 và 09:30 giờ Nhật), không ghi cứng trong job;
          job chạy mỗi 15 phút và chỉ sinh khi đã qua giờ gửi của quy tắc trong ngày Nhật hôm đó và chưa sinh. Cửa sổ ngưỡng dùng hàm của T02-01, biên đóng hai đầu.
          Job dùng hàm kiểm khoá và tài liệu lịch chạy của T14-06; tôn trọng ngày gửi trong tuần của quy tắc (bỏ 休市日 tức ngày nghỉ chợ).
        viec: |
          Tạo đường API nội bộ cho job quét, lịch pg_cron mỗi 15 phút: với mỗi quy tắc đang bật trong hai loại, nếu giờ Nhật hiện tại đã qua giờ gửi và hôm nay là ngày gửi cho phép,
          lấy đối tượng thoả ngưỡng và gọi hàm ghi thông báo của T15-01 cho từng đối tượng, ghi dấu "đã sinh" (loại, đối tượng, ngày Nhật) để chạy lại không sinh trùng.
          Hồ sơ sắp hết hạn: mỗi cặp người tham gia × cấp tư cách một thông báo cho mỗi ngày hết hạn. Giao hàng tồn: mỗi giao dịch còn số lượng chưa giao một thông báo mỗi ngày.
          Thêm dòng lịch job vào docs/job-lich-chay.md.
        tieu_chi_xong:
          - "Dữ liệu mẫu có 2 hồ sơ hết hạn trong cửa sổ ngưỡng: chạy job lúc 07:50 giờ Nhật không sinh; chạy lúc 08:05 sinh 2 thông báo; chạy lại lúc 08:20 và 09:00 không thêm"
          - "Hồ sơ hết hạn đúng ngày cuối cửa sổ có thông báo, ngày kế tiếp không; đổi ngưỡng ở bảng cấu hình chung thành 45 thì tập hồ sơ đổi theo"
          - "Sửa giờ gửi của quy tắc giao hàng tồn thành 09:45: chạy job lúc 09:35 không sinh, lúc 09:50 sinh đúng một thông báo cho mỗi giao dịch còn tồn"
          - "Tắt quy tắc giao hàng tồn rồi chạy job sau giờ gửi: không có thông báo; ngày nghỉ chợ theo lịch cũng không sinh"
          - "Máy chủ đặt múi giờ UTC: mốc giờ gửi và ngày đã sinh vẫn hiểu theo giờ Nhật (ca chạy lúc 17:30 UTC, tức 02:30 giờ Nhật hôm sau)"
          - "Gọi đường job không kèm khoá đúng nhận lỗi quyền; lịch hiện trong danh sách pg_cron"
        file_cham:
          - supabase/schema.sql (bảng dấu đã sinh notification_scan_marks, lịch pg_cron)
          - src/app/api/jobs/scan-notifications/route.ts (mới, đường job)
          - docs/job-lich-chay.md (thêm dòng)

      - key: T15-05-man-cai-dat-quy-tac-thong-bao
        title: "Màn cài đặt thông báo cho vai quản trị hệ thống sửa sáu quy tắc có lý do"
        labels: [nguon:moi, doi:fe]
        lam_sau: [T15-01-bang-quy-tac-va-ham-sinh-thong-bao, T15-02-gui-email-co-thu-lai-va-hang-doi-het-luot, INC-10-hop-thoai-xac-nhan-that]
        boi_canh: |
          Màn SCR-24 chưa có trong prototype (D-03). Chỉ vai quản trị hệ thống được vào; vai quản trị quy tắc không được, vì đây là cấu hình vận hành, gộp quyền sẽ cho một người tự đổi người nhận cảnh báo về mình.
          Lớp nặng nhất là màn hình; API đã có ở T15-01, chỉ thêm đường "gửi thử" ghi dòng log có cờ gửi thử (T15-02). Hộp thoại dùng thành phần chung của INC-10, không dùng hộp thoại trình duyệt (D-12);
          chặn vai ở lớp máy chủ theo cách của X02-01. Ngưỡng hồ sơ sắp hết hạn trên màn này cũng là ngưỡng bộ lọc của màn SCR-05 (T02-01), phải nói rõ cho người sửa.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: T15-05.1-bang-quy-tac-va-bieu-mau-sua rồi T15-05.2-gui-thu-lich-su-va-chan-quyen.
          Bối cảnh ở trên dùng chung cho hai issue con; tiêu chí xong của từng phần nằm ở issue con.
        tieu_chi_xong:
          - Hai issue con đã đóng, mọi tiêu chí xong của chúng đạt trên cùng một bản deploy
        file_cham:
          - src/app/(app)/admin/notification-rules/page.tsx (mới)
          - src/app/api/admin/notification-rules/[id]/test/route.ts (mới)
          - src/lib/roles.ts (mục menu)
        con:
          - key: T15-05.1-bang-quy-tac-va-bieu-mau-sua
            title: "Màn cài đặt thông báo: bảng sáu quy tắc và biểu mẫu sửa có lý do, kiểm ô, bắt xung đột"
            labels: [nguon:moi, doi:fe]
            boi_canh: |
              Issue con của T15-05-man-cai-dat-quy-tac-thong-bao; đọc bối cảnh ở issue cha.
            viec: |
              Tạo trang /admin/notification-rules: bảng 6 dòng, mỗi dòng một loại thông báo với bật/tắt, vai nhận, người nhận chỉ định, kênh, ngưỡng, giờ gửi, ngày gửi, số lần thử lại, hiệu lực từ, lần gửi gần nhất. Bấm sửa mở biểu mẫu trong hộp thoại chung; lưu bắt lý do; biểu mẫu gửi kèm mã dòng cơ sở để API bắt xung đột; lưu xong hiện thông báo thành công bằng chữ. Dòng hồ sơ sắp hết hạn có cảnh báo vàng về bộ lọc sắp hết hạn. Ô vai nhận bỏ vai "xem" với hai loại cần quyền ghi.
            tieu_chi_xong:
              - "Màn hiện đủ 6 dòng sau khi đặt lại dữ liệu mẫu, dòng kỳ thưởng đã chốt có vai đối soát và quản trị quy tắc"
              - "Sửa ngưỡng hồ sơ sắp hết hạn từ 30 thành 45 không ghi lý do: nút lưu không bấm được, lỗi hiện tại ô lý do; có lý do thì lưu được, bảng hiện 45, cảnh báo vàng về bộ lọc SCR-05 có hiện"
              - "Nhập số lần thử lại 4 hoặc ngưỡng 366: lỗi ngay tại ô, không gửi; giờ gửi 11:00 cho loại không phải lỗi xuất dữ liệu: lỗi tại ô nêu khung 02:00–10:00"
              - "Mở biểu mẫu ở hai tab, lưu tab một rồi lưu tab hai: tab hai báo đã có bản mới, tải lại, không ghi đè"
            file_cham:
              - "src/app/(app)/admin/notification-rules/page.tsx (mới)"
          - key: T15-05.2-gui-thu-lich-su-va-chan-quyen
            title: "Màn cài đặt thông báo: gửi thử, lịch sử phiên bản, menu và chặn quyền"
            labels: [nguon:moi, doi:fe]
            lam_sau: [T15-05.1-bang-quy-tac-va-bieu-mau-sua]
            boi_canh: |
              Issue con của T15-05-man-cai-dat-quy-tac-thong-bao; đọc bối cảnh ở issue cha.
            viec: |
              Nút "Gửi thử" gọi API gửi thử tới chính người đang đăng nhập, hiện kết quả từng kênh. Khung "Lịch sử phiên bản" đọc nhật ký thao tác lọc theo loại, 50 dòng gần nhất. Thêm mục menu cho vai quản trị hệ thống; vai khác gõ đường dẫn thấy trang 403.
            tieu_chi_xong:
              - "Bấm Gửi thử cho loại có kênh email khi chưa cấu hình nhà cung cấp: màn hiện kênh trong ứng dụng thành công, kênh email lỗi với lý do bằng chữ; hộp thư của người bấm có thông báo đánh dấu gửi thử"
              - "Vai đối soát không thấy mục menu, gõ /admin/notification-rules thấy trang 403; lịch sử phiên bản hiện dòng vừa lưu với lý do, người sửa, giá trị trước và sau bằng chữ"
            file_cham:
              - "src/app/(app)/admin/notification-rules/page.tsx (mới)"
              - "src/app/api/admin/notification-rules/[id]/test/route.ts (mới)"
              - "src/lib/roles.ts (mục menu)"

      - key: T15-06-man-hang-doi-canh-bao-va-api-xu-ly
        title: "Màn hàng đợi cảnh báo và API gửi lại hoặc đóng thủ công thông báo gửi hỏng"
        labels: [nguon:moi, doi:be]
        lam_sau: [T15-02-gui-email-co-thu-lai-va-hang-doi-het-luot, INC-10-hop-thoai-xac-nhan-that, T04-05-api-danh-sach-tim-kiem-an-toan-va-du-lieu-dong]
        boi_canh: |
          Màn SCR-25 chưa có trong prototype (D-03). Chỉ vai quản trị hệ thống được vào vì hàng đợi chứa email nhân viên và nguyên văn lỗi nhà cung cấp
          (dữ liệu cá nhân và nhật ký kỹ thuật theo APPI, luật bảo vệ thông tin cá nhân của Nhật). Lớp nặng nhất là API: đường đọc có bộ đếm và phân trang bằng con trỏ
          (đánh dấu vị trí trang: nhớ dòng cuối của trang trước), đường gửi lại theo lô xử lý từng dòng trong giao dịch riêng, đường đóng thủ công bắt lý do và ghi nhật ký; màn đi kèm.
          Không hiện nội dung thông báo trên màn này, chỉ tiêu đề. Ô tìm kiếm truyền chuỗi như tham số theo cách của T04-05. Hộp thoại dùng thành phần chung của INC-10.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: T15-06.1-api-doc-bo-dem-va-man-danh-sach-hang-doi rồi T15-06.2-gui-lai-theo-lo-va-dong-thu-cong.
          Bối cảnh ở trên dùng chung cho hai issue con; tiêu chí xong của từng phần nằm ở issue con.
        tieu_chi_xong:
          - Hai issue con đã đóng, mọi tiêu chí xong của chúng đạt trên cùng một bản deploy
        file_cham:
          - src/app/api/admin/notification-queue/route.ts (mới)
          - src/app/api/admin/notification-queue/retry/route.ts (mới)
          - src/app/api/admin/notification-queue/[id]/resolve/route.ts (mới)
          - src/app/(app)/admin/notification-queue/page.tsx (mới)
          - src/lib/roles.ts (mục menu)
        con:
          - key: T15-06.1-api-doc-bo-dem-va-man-danh-sach-hang-doi
            title: "API đọc hàng đợi cảnh báo có bộ đếm và màn danh sách cho quản trị hệ thống"
            labels: [nguon:moi, doi:be]
            boi_canh: |
              Issue con của T15-06-man-hang-doi-canh-bao-va-api-xu-ly; đọc bối cảnh ở issue cha.
            viec: |
              API đọc /api/admin/notification-queue: lọc theo trạng thái (mặc định hết lượt), loại, kênh, ngày, chuỗi tìm (truyền như tham số, cách của T04-05); trả dòng kèm tiêu đề thông báo, email và vai người nhận, số lần thử lại trên trần của phiên bản quy tắc lúc xếp, mã lỗi, nguyên văn lỗi, thời điểm thử cuối và thử tiếp; bộ đếm: hết lượt chưa đóng, đang chờ thử lại, đã gửi hôm nay, tỷ lệ thành công 7 ngày (chỉ tính đã gửi và hết lượt, loại dòng gửi thử); sắp loại lỗi xuất dữ liệu lên đầu, rồi kênh trong ứng dụng hỏng, rồi mới nhất; phân trang con trỏ 100 dòng, trần 500. Trang /admin/notification-queue: bộ lọc, bảng, bộ đếm. Menu cho vai quản trị hệ thống; vai khác thấy trang 403.
            tieu_chi_xong:
              - "Dữ liệu thử có 7 dòng hết lượt, 2 đang chờ thử lại, 3 dòng gửi thử hỏng: mở màn thấy 7 dòng, bộ đếm hết lượt 7, dòng gửi thử không xuất hiện và không vào tỷ lệ"
              - "Tỷ lệ 7 ngày với 97 đã gửi và 3 hết lượt hiện 97,0%; dòng đang chờ thử lại không làm đổi con số"
              - "Gõ chuỗi tìm chứa ký tự lạ (dấu ngoặc, dấu phẩy): API tìm chúng như chữ thường, không lỗi 500; vai đối soát gọi API nhận lỗi quyền và gõ đường dẫn thấy trang 403"
              - "Dòng loại lỗi xuất dữ liệu luôn ở đầu danh sách dù mới hơn hay cũ hơn dòng khác; trang thứ hai (con trỏ) không lặp dòng của trang đầu"
            file_cham:
              - "src/app/api/admin/notification-queue/route.ts (mới)"
              - "src/app/(app)/admin/notification-queue/page.tsx (mới)"
              - "src/lib/roles.ts (mục menu)"
          - key: T15-06.2-gui-lai-theo-lo-va-dong-thu-cong
            title: "Gửi lại theo lô và đóng thủ công thông báo gửi hỏng trên màn hàng đợi"
            labels: [nguon:moi, doi:fe]
            lam_sau: [T15-06.1-api-doc-bo-dem-va-man-danh-sach-hang-doi]
            boi_canh: |
              Issue con của T15-06-man-hang-doi-canh-bao-va-api-xu-ly; đọc bối cảnh ở issue cha.
            viec: |
              API gửi lại: nhận tối đa 50 mã, mỗi dòng một giao dịch database: đặt lại số lần thử lại về 0, thời điểm thử tiếp là bây giờ, trả kết quả từng dòng; người nhận đã bị khoá thì dòng đó báo lỗi, không gửi. API đóng thủ công: lý do bắt buộc, ghi người và thời điểm đóng, ghi nhật ký. Trên màn: chọn nhiều dòng để gửi lại, hộp thoại đóng thủ công (thành phần chung của INC-10), nút khoá khi đang gửi.
            tieu_chi_xong:
              - "Gửi lại 2 dòng, một dòng có người nhận đã khoá: màn hiện một dòng thành công (số lần thử lại về 0, trạng thái chờ gửi), một dòng lỗi kèm lý do bằng chữ; nhật ký có hai dòng"
              - "Chọn 51 dòng rồi bấm gửi lại: bị chặn ngay trên màn với thông điệp nêu trần 50"
              - "Đóng thủ công không ghi lý do: nút không bấm được; có lý do thì dòng biến khỏi danh sách mặc định, bộ đếm giảm 1, nhật ký có dòng kèm lý do"
            file_cham:
              - "src/app/api/admin/notification-queue/retry/route.ts (mới)"
              - "src/app/api/admin/notification-queue/[id]/resolve/route.ts (mới)"
              - "src/app/(app)/admin/notification-queue/page.tsx (mới)"

  - key: E-T16
    title: "Hộp thông báo trong ứng dụng: link mở đúng màn, số chưa đọc đếm ở máy chủ, lọc và phân trang"
    labels: []
    body: |
      Epic gia cố gói T-16 (màn hộp thư thông báo SCR-26). Phần đọc và đánh dấu đã đọc của prototype chạy thật và đúng quyền (chỉ thấy thông báo của chính mình), giữ nguyên.
      Ba chỗ cần sửa: B-22 hai link trong dữ liệu mẫu trỏ đường dẫn không tồn tại nên bấm "Mở" ra trang 404 (nhận xét LAB-3 của giảng viên, nhãn gia cố);
      số chưa đọc đếm trên 100 dòng đã tải nên lệch với bảng điều khiển; "đánh dấu tất cả" nuốt cả thông báo vừa tới mà người dùng chưa thấy (hai chỗ sau là điểm thiết kế LAB-4 sửa, nhãn chênh lệch).
      Thông báo hiện là dữ liệu mẫu, chưa có nguồn sinh thật; nguồn sinh thuộc epic E-T15 (T15-03) và được nối bằng lam_sau ở T16-03.
      Giả định: không có giả định riêng; epic bám PREMISE.md và thiết kế LAB-4.
      Thứ tự làm: T16-01 (T15-01 cần bảng link của issue này) → T16-02 → T16-03.
    issues:
      - key: T16-01-sua-link-thong-bao-404
        title: "Sửa hai link thông báo đang dẫn tới trang 404 bằng bảng link chuẩn theo loại thông báo"
        labels: [nguon:gia-co, doi:fe]
        boi_canh: |
          B-22: dữ liệu mẫu ghi link /participants/expiring và /settlement/disputes, hai đường dẫn này không có trong bản đồ 14 đường dẫn của ứng dụng, bấm "Mở" là trang 404.
          Nhận xét LAB-3 của giảng viên nêu đích danh lỗi này. Thiết kế LAB-4 chốt: link phải là đường dẫn thật kèm tham số lọc, lấy từ một bảng chuẩn, không tự ghép chuỗi;
          T15-01 dùng bảng này khi ghi thông báo thật. Chỗ tự quyết: màn đích chưa đọc tham số lọc (việc "bộ lọc lên URL" thuộc các issue gia cố màn ở epic T-04)
          thì bỏ qua tham số, vẫn mở màn, không 404.
        viec: |
          Tạo bảng link chuẩn trong mã: mỗi loại thông báo một hàm dựng link từ tham số: hồ sơ sắp hết hạn → /participants?filter=expiring; tranh chấp mở → /settlement?day=YYYY-MM-DD;
          điều chỉnh chờ duyệt → /corrections?status=pending; lỗi xuất dữ liệu → /reports; giao hàng tồn → /deliveries?only=pending; kỳ thưởng đã chốt → /incentives?period=YYYY-MM.
          Sửa dữ liệu mẫu theo bảng này. Màn hộp thư chỉ hiện nút "Mở" khi link khớp một đường dẫn trong bảng (danh sách trắng); link lạ thì không hiện nút. Ghi bảng link vào docs/link-thong-bao.md trong repo này.
        tieu_chi_xong:
          - "Đặt lại dữ liệu mẫu rồi đăng nhập lần lượt bằng cả 8 vai, bấm từng nút Mở trong hộp thư: không nút nào ra trang 404, mỗi nút mở đúng màn ghi trong bảng link"
          - "Thêm tay một thông báo có link /khong-ton-tai vào database: màn không hiện nút Mở cho dòng đó, các dòng khác vẫn bình thường"
          - "Hàm dựng link cho loại tranh chấp mở với ngày 2026-08-24 trả đúng /settlement?day=2026-08-24 (kiểm bằng kiểm thử đơn vị một lệnh)"
          - "Bảng link trong docs/link-thong-bao.md khớp với mã (6 loại, 6 dòng)"
        file_cham:
          - supabase/seed.sql (hai dòng link)
          - src/lib/notification-links.ts (mới, bảng link chuẩn)
          - src/app/(app)/notifications/page.tsx (danh sách trắng cho nút Mở)
          - docs/link-thong-bao.md (mới, trong repo này)

      - key: T16-02-dem-chua-doc-o-may-chu-va-danh-dau-co-moc
        title: "Số chưa đọc đếm ở máy chủ và đánh dấu đã đọc không nuốt thông báo vừa tới"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T16-01-sua-link-thong-bao-404]
        boi_canh: |
          Màn đếm số chưa đọc trên 100 dòng đã tải nên người có 150 thông báo chưa đọc thấy "100", trong khi bảng điều khiển đếm ở máy chủ: hai con số lệch nhau.
          "Đánh dấu tất cả" chạy theo điều kiện tại thời điểm máy chủ xử lý nên đánh dấu luôn thông báo vừa tới mà người dùng chưa thấy (mất thông tin thật).
          Bấm "Mở" không tự đánh dấu đã đọc. Nút không khoá khi đang gửi (bấm hai lần là hai yêu cầu). Thông báo "gửi thử" (T15-05) là của chính người bấm nên hiện và đếm như thông báo thường, chỉ gắn nhãn.
          Lớp nặng nhất là màn hình; API đổi hai chỗ nhỏ.
        viec: |
          API đọc trả thêm tổng chưa đọc đếm bằng câu đếm không giới hạn; bảng điều khiển dùng cùng một hàm đếm. API đánh dấu tất cả nhận mốc "trước thời điểm" (thời điểm của dòng mới nhất đang hiển thị), chỉ đánh dấu dòng cũ hơn hoặc bằng mốc.
          Màn hiện "{tổng} chưa đọc" từ máy chủ; bấm "Mở" gọi đánh dấu đã đọc rồi mới chuyển trang; nút "Đã đọc" và "Đánh dấu tất cả" khoá trong lúc chờ; cập nhật trạng thái trên màn ngay khi bấm,
          tải lại chỉ để đồng bộ, tải lại hỏng thì hiện lỗi bằng chữ mà không hoàn tác. Khi tải màn lỗi vẫn hiện khung và nút "Thử lại". Bỏ nhãn "(mock)" trên kênh email; dòng gửi thử có nhãn "gửi thử".
        tieu_chi_xong:
          - "Tạo 150 thông báo chưa đọc cho một người bằng script thử: màn hiện 150 chưa đọc và bảng điều khiển hiện cùng số 150"
          - "Mở màn, thêm một thông báo mới cho người đó từ tab khác, rồi bấm Đánh dấu tất cả: thông báo mới vẫn chưa đọc, các dòng cũ đã đọc"
          - "Bấm Mở trên một dòng chưa đọc: chuyển tới màn đích và khi quay lại dòng đó đã đọc, số chưa đọc giảm 1"
          - "Bấm Đã đọc hai lần nhanh: chỉ một yêu cầu gửi đi (kiểm ở tab mạng), dòng mờ ngay khi bấm"
          - "Ngắt mạng sau khi bấm Đã đọc thành công nhưng trước khi tải lại: dòng vẫn mờ, có thông báo lỗi bằng chữ, không hoàn tác"
          - "Giả lập API đọc lỗi: màn vẫn có khung và nút Thử lại, bấm là tải lại được; thông báo gửi thử hiện với nhãn gửi thử và tính vào số chưa đọc"
        file_cham:
          - src/app/(app)/notifications/page.tsx
          - src/app/api/notifications/route.ts (tổng chưa đọc, mốc trước thời điểm)
          - src/app/api/dashboard/route.ts (dùng chung hàm đếm)

      - key: T16-03-bo-loc-va-phan-trang-hop-thu
        title: "Hộp thư có bộ lọc theo loại và chưa đọc, chia trang thay cho giới hạn cứng 100 dòng"
        labels: [nguon:chenh-lech, doi:fe]
        lam_sau: [T16-02-dem-chua-doc-o-may-chu-va-danh-dau-co-moc, T15-03-sinh-thong-bao-tu-ba-su-kien-tuc-thoi]
        boi_canh: |
          API đọc cắt cứng 100 dòng mới nhất, không tham số, không trang kế; màn không có bộ lọc. Với dữ liệu mẫu (vài dòng) không ai thấy; khi T15-03 sinh thông báo thật,
          một người có thể nhận hàng chục thông báo mỗi ngày và không bao giờ thấy dòng thứ 101. Chia trang bằng con trỏ (đánh dấu vị trí trang: nhớ thời điểm và mã của dòng cuối trang trước).
          Issue này chờ T15-03 để kiểm bằng thông báo thật thay vì dữ liệu mẫu. Lớp nặng nhất là màn hình; API thêm tham số lọc và con trỏ.
        viec: |
          API đọc nhận tham số loại thông báo, chỉ chưa đọc, con trỏ và kích thước trang 50; trả con trỏ tiếp khi còn dòng.
          Màn thêm bộ lọc loại (6 loại bằng chữ) và ô "chỉ chưa đọc"; bộ lọc ghi lên URL để bấm Back còn giữ (cùng cách issue bộ lọc lên URL T04-07); nút "Tải thêm" ở cuối danh sách;
          "Đánh dấu tất cả" chỉ áp cho dòng khớp bộ lọc đang chọn và mốc thời gian (T16-02).
        tieu_chi_xong:
          - "Người có 120 thông báo (sinh bằng sự kiện của T15-03 hoặc script thử): trang đầu 50 dòng, bấm Tải thêm hai lần thấy đủ 120, không dòng trùng, không dòng thiếu"
          - "Lọc tranh chấp mở và chỉ chưa đọc: danh sách chỉ còn dòng khớp, URL chứa hai tham số; bấm Back rồi Forward bộ lọc còn nguyên"
          - "Đang lọc tranh chấp mở bấm Đánh dấu tất cả: thông báo loại khác vẫn chưa đọc"
          - "Gọi API với con trỏ sai định dạng nhận lỗi 422 bằng chữ, không lỗi 500"
          - "Màn rộng 390 px: bộ lọc và nút Tải thêm nhìn thấy không cuộn ngang"
        file_cham:
          - src/app/(app)/notifications/page.tsx
          - src/app/api/notifications/route.ts (lọc, con trỏ)

  - key: E-X01
    title: "X-01 Nền tảng vận hành: bảng mã lỗi, thiết kế dữ liệu đích, biến môi trường, đăng nhập, hàng đợi mất mạng, sao lưu"
    labels: []
    body: |
      Epic gom những việc nền mà mọi epic màn hình đều dựa vào, nên phần lớn làm ở Sprint 1.
      Gói T-01 (màn đăng nhập SCR-01) gộp vào đây. Lỗ S-03 (không giới hạn số lần đăng nhập) và lỗ S-02 (rò lỗi database) xử lý ở đây.
      Lỗ S-06 (chuyển hướng ra ngoài sau đăng nhập) chuyển sang X02-01 vì dùng cùng một danh sách đường dẫn cho phép.
      Hai việc lớn thêm ở bản 2 theo rà soát phủ: D-15 hàng đợi cục bộ khi mất mạng cho màn ghi đợt giao, và D-28b sao lưu và diễn tập khôi phục.
      Script đặt lại dữ liệu mẫu chuyển sang X03-01 (đi cùng kiểm nhanh luồng chính). Phần job mở và đóng ngày nghiệp vụ theo lịch chợ (D-43) ở epic T-09.
      Tiền đề: PREMISE.md Bảng 1 (D-41 mã giao dịch, D-43 lịch chợ, D-45 thiết kế dữ liệu đích).
      Chú giải mã dùng trong epic: S-02, S-03 là hai lỗ bảo mật đã đo ở thiết kế LAB-4; D-15 là yêu cầu hàng đợi cục bộ khi mất mạng ở màn hiện trường;
      D-28b là yêu cầu khôi phục dữ liệu trong 4 giờ, mất tối đa 15 phút dữ liệu; D-45 là quyết định lấy sơ đồ đích làm gốc cho bảng thiết kế dữ liệu;
      業務日 là ngày nghiệp vụ của chợ, tính theo giờ Nhật.
      Giả định: không có giả định riêng; epic bám PREMISE.md và thiết kế LAB-4.
      Thứ tự làm: X01-01 trước mọi issue khác của toàn backlog (Sprint 1); X01-03 ngay sau; X01-02, X01-04, X01-06 song song; X01-05 sau khi epic T-08 xong.
    issues:
      - key: X01-01-bang-ma-loi-chung-va-anh-xa-loi-database
        title: "Bảng mã lỗi chung trong repo này, một nơi khai báo trong mã nguồn, và không trả nguyên văn lỗi database ra trình duyệt"
        labels: [nguon:gia-co, doi:be]
        boi_canh: |
          Thiết kế LAB-4 có một danh mục thông điệp lỗi, mỗi dòng ghi mã, mã HTTP, câu hiện cho người dùng, ô neo lỗi và hành động gợi ý; tài liệu đó
          không công khai nên issue này chép phần cần dùng vào đây. Prototype đang có 13 mã nghiệp vụ do hàm database ném ra (ngày đã khoá, kỳ đã chốt,
          giao dịch đã huỷ, đã có giao hàng, giấy phép không hiệu lực, giấy phép tạm dừng, loại bên mua sai, vượt tồn, thiếu lý do, chưa có phiên bản
          quy tắc, không thấy lô, không thấy bên mua, không thấy giao dịch), 3 mã lỗi Postgres được dịch (23505 trùng khoá, 23514 vi phạm ràng buộc,
          còn lại), 6 tình huống xác thực và phân quyền, và khoảng 20 lỗi kiểm ở ô nhập theo màn.
          Mã mới của LAB-4 chưa có trong prototype: yêu cầu mã xác thực hai lớp (401), quá nhiều lần đăng nhập (429), vi phạm khoá ngoại 23503 đổi từ 500
          sang 422, lỗi database khác trả câu cố định (500) thay vì nguyên văn, ngày nghỉ chợ (409), kỳ đã chốt
          khi tạo phiên bản tỷ lệ (409), vượt trần số đợt giao (422), vượt hạn mức tham gia (422). Review LAB-4 yêu cầu gom về một bảng và làm ở
          Sprint 1 để các issue tạo sau chỉ trỏ tới mã.
          Lỗ S-02 (mức cao, đo ở LAB-4) gộp vào đây vì cùng một file: lớp dịch lỗi thiếu mã 23503 nên lỗi rơi vào nhánh 500 và trả nguyên văn thông điệp
          Postgres kèm tên bảng, tên ràng buộc; nhánh 23505 cũng kèm tên ràng buộc.
          Quy tắc giữ từ LAB-4: lỗi 422 neo vào ô gây lỗi; 409, 404, 403 hiện ở banner; không hiện mã kỹ thuật (23505, P0001) cho người dùng.
        viec: |
          Issue cha, vượt trần 16 giờ một issue nên tách làm hai issue con bên dưới: X01-01.1-bang-ma-loi-va-ham-dich-loi rồi X01-01.2-don-route-tu-viet-cau-loi.
          Bối cảnh ở trên dùng chung cho hai issue con; tiêu chí xong của từng phần nằm ở issue con.
        tieu_chi_xong:
          - Hai issue con đã đóng, mọi tiêu chí xong của chúng đạt trên cùng một bản deploy
        file_cham:
          - docs/ma-loi.md (mới, trong repo này)
          - src/lib/error-codes.ts (mới, một nơi khai báo mã và câu lỗi)
          - src/lib/api.ts (hàm dịch lỗi)
          - tests/error-mapping.test.ts (mới, kiểm thử đơn vị)
        con:
          - key: X01-01.1-bang-ma-loi-va-ham-dich-loi
            title: "Bảng mã lỗi chung và hàm dịch lỗi database một nơi khai báo"
            labels: [nguon:gia-co, doi:be]
            boi_canh: |
              Issue con của X01-01-bang-ma-loi-chung-va-anh-xa-loi-database; đọc bối cảnh ở issue cha.
            viec: |
              Viết docs/ma-loi.md: một dòng cho mỗi mã (mã, mã HTTP, câu hiện cho người dùng, nhãn tiếng Nhật, ô neo lỗi, hành động gợi ý, cột "mới ở LAB-4"); 3 dòng hướng dẫn đầu file. Tạo src/lib/error-codes.ts là nơi duy nhất khai báo mã và câu lỗi; src/lib/api.ts đọc từ đó. Ánh xạ 23503 thành 422; nhánh 23505 bỏ chi tiết ràng buộc; nhánh còn lại trả câu cố định và ghi nguyên văn kèm mã yêu cầu vào log server. Kiểm thử đơn vị cho hàm dịch lỗi.
            tieu_chi_xong:
              - "docs/ma-loi.md có số mã bằng số mã đếm được từ src/lib/error-codes.ts (kiểm thử đọc cả hai và so số); không trùng mã; mọi mã mới ở bối cảnh có đánh dấu \"mới ở LAB-4\""
              - "Kiểm thử đơn vị: lỗi 23503 giả cho ra 422 và thân phản hồi không chứa chữ \"constraint\", \"fkey\" hay tên bảng; lỗi 23505 giả cho ra 409 không có tên ràng buộc; lỗi mã lạ cho ra 500 câu cố định và log có nguyên văn kèm mã yêu cầu"
              - "Mọi issue tạo sau issue này ở Project trỏ tới mã trong bảng khi nhắc tới lỗi; người gộp backlog kiểm bằng cách tìm chữ \"mã lỗi\" trong thân issue và đối chiếu bảng"
            file_cham:
              - "docs/ma-loi.md (mới, trong repo này)"
              - "src/lib/error-codes.ts (mới, một nơi khai báo mã và câu lỗi)"
              - "src/lib/api.ts (hàm dịch lỗi)"
              - "tests/error-mapping.test.ts (mới, kiểm thử đơn vị)"
          - key: X01-01.2-don-route-tu-viet-cau-loi
            title: "Dọn các route đang tự viết câu lỗi, chuyển sang bảng mã chung"
