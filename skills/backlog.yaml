      - key: X02-03-dang-ky-ma-hai-lop-va-bat-tat-o-man-tai-khoan
        title: "Màn đăng ký mã xác thực hai lớp lần đầu, cột bật tắt ở màn tài khoản, và tài khoản thử có mã cố định"
        labels: [nguon:moi, doi:fe]
        boi_canh: |
          Hồ sơ mời thầu yêu cầu xác thực hai lớp (MFA, mật khẩu cộng một mã thứ hai); prototype chưa có. Thiết kế LAB-4 chốt dùng TOTP (mã dùng một
          lần theo thời gian, do ứng dụng xác thực trên điện thoại sinh, 6 chữ số), gắn với tài khoản cá nhân, bắt buộc cho 3 vai nhạy cảm (quản trị hệ
          thống, đối soát, quản trị quy tắc), tuỳ chọn cho 5 vai còn lại bật ở màn SCR-03 (tài khoản và quyền) qua cột mới profiles.mfa_enabled.
          Khách chưa trả lời phương thức cho thiết bị dùng chung (QA-10), nên chọn TOTP là quyết định của đội; nếu khách chọn khác thì sửa bước 2 (X02-04)
          và cột này. Làm trước X02-04 vì bước 2 cần tài khoản đã đăng ký mã để thử.
          Đổi trạng thái MFA là thao tác nhạy cảm, phải có lý do và ghi nhật ký như mọi thao tác ở SCR-03.
        viec: |
          Dùng tính năng MFA của Supabase Auth: trang /account/mfa hiện mã QR và mã chữ dự phòng, ô nhập mã để xác nhận đăng ký. Ở SCR-03 thêm cột
          "Xác thực hai lớp" (Bắt buộc theo vai / Đang bật / Đang tắt) và nút bật tắt cho vai tuỳ chọn, bắt lý do, ghi nhật ký với giá trị trước và sau.
          Migration thêm cột mfa_enabled có bước quay lại. Thêm hàm trong seed-test.sql gắn sẵn một mã gốc TOTP cố định cho 3 tài khoản thử của 3 vai
          bắt buộc (chỉ dùng trong database thử và bộ demo, ghi ở mục riêng của tests/README.md, không phải khoá thật).
        tieu_chi_xong:
          - Vai đối soát mở /account/mfa, quét mã, nhập mã đúng thì trạng thái thành Đang bật; nhập sai thì lỗi hiện tại ô, không đổi trạng thái
          - "Ở SCR-03, 3 vai bắt buộc hiện \"Bắt buộc theo vai\" và không có nút tắt; vai giao hàng bật được, bắt lý do, nhật ký có dòng với trước \"tắt\" sau \"bật\""
          - Vai không phải quản trị hệ thống không thấy nút bật tắt của người khác; gọi thẳng API nhận 403
          - Ba tài khoản thử sinh được mã hợp lệ từ mã gốc cố định bằng thư viện TOTP trong kiểm thử; mã gốc có trong tests/README.md
          - Màn đăng ký dùng được trên màn 390 px, mã QR không bị cắt
        file_cham:
          - src/app/(app)/account/mfa/page.tsx (mới)
          - src/app/(app)/admin/users/page.tsx (cột và nút)
          - src/app/api/admin/users/[id]/route.ts (bật tắt kèm lý do)
          - supabase/schema.sql (cột profiles.mfa_enabled)
          - supabase/seed-test.sql (mã gốc cố định cho 3 tài khoản thử)
          - tests/README.md (bổ sung mục)

