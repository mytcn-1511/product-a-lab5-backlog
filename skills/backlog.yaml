      - key: X01-02-bang-thiet-ke-du-lieu-tu-so-do-dich
        title: "Sinh lại bảng thiết kế dữ liệu từ sơ đồ đích, công bố bảng cột trong repo này, giữ độ chính xác số tiền"
        labels: [nguon:chenh-lech, doi:be]
        boi_canh: |
          Review LAB-4 (PREMISE D-45) chỉ ra bảng cột của thiết kế dữ liệu được sinh từ schema prototype nên lệch sơ đồ đích: bảng lịch sử tư cách thiếu
          cột (sơ đồ có 10 cột, màn hình đang dùng thêm 3), lô hàng thiếu trạng thái công khai (公開, bước công khai lô để bên mua thấy), thiếu ràng buộc
          số lượng lớn hơn 0. Lập trình viên viết migration (tập lệnh đổi cấu trúc database) theo bảng cột, nên bảng cột sai là migration sai.
          LAB-4 có một script đối chiếu bằng máy 406 tham chiếu dạng bảng.cột trong 26 spec màn hình với bảng cột; script trả mã thoát 1 khi có cột bịa.
          Prototype có 15 bảng và 2 view (bảng ảo) trong schema; mọi cột tiền là numeric(12,2), tức 12 chữ số với 2 chữ số lẻ.
          Phần migration cho bảng lịch sử tư cách làm ở T04-01, phần trạng thái công khai và ràng buộc số lượng ở T05-01; issue này chỉ lo bảng thiết kế.
        viec: |
          Sinh lại bảng cột từ sơ đồ đích: mọi bảng, cột, kiểu dữ liệu, cho phép trống hay không, giá trị mặc định, ràng buộc; số tiền giữ numeric(12,2),
          không đổi sang số thực. Công bố bảng cột thành docs/columns.csv và tóm tắt bằng chữ ở docs/thiet-ke-du-lieu.md trong repo này (bảng nào thêm
          cột gì so với prototype, để người viết migration ở T-04, T-05 đọc). Chạy lại script đối chiếu trên bộ thiết kế LAB-4 (nội bộ) với bảng cột
          mới; sửa cho tới khi không báo lệch; ghi số tham chiếu đã kiểm và mã thoát vào cuối docs/thiet-ke-du-lieu.md.
        tieu_chi_xong:
          - docs/columns.csv có đủ 15 bảng và 2 view; bảng lịch sử tư cách đủ 13 cột; bảng lô có cột trạng thái với giá trị công khai; cột số lượng có ràng buộc lớn hơn 0
          - "Mọi cột tiền trong docs/columns.csv là numeric(12,2); grep kiểu float hoặc double ra 0 dòng"
          - Script đối chiếu chạy trên bảng cột mới trả mã thoát 0 với số tham chiếu không nhỏ hơn 406; hai số này ghi ở cuối docs/thiet-ke-du-lieu.md
          - Người viết migration ở T04-01 đọc docs/thiet-ke-du-lieu.md và không phải hỏi lại; nếu hỏi, câu hỏi được bổ sung vào tài liệu
        file_cham:
          - docs/columns.csv (mới, trong repo này)
          - docs/thiet-ke-du-lieu.md (mới, trong repo này)
          - bảng cột và script đối chiếu của bộ thiết kế LAB-4 (tài liệu nội bộ, nhắc bằng chữ, không chép vào repo)

      - key: X01-03-kiem-bien-moi-truong-luc-build-va-khoi-dong
        title: "Kiểm biến môi trường lúc build và lúc khởi động, thiếu hoặc trống thì dừng và báo rõ tên biến"
        labels: [nguon:gia-co, doi:infra]
        boi_canh: |
          Nhận xét LAB-3: bản deploy trên Vercel (dịch vụ chạy ứng dụng) thiếu một biến môi trường (giá trị cấu hình đặt ngoài mã nguồn), build vẫn
          qua nhưng mở trang nào cũng sập, người chấm không vào được. Prototype đọc biến môi trường rải rác ở nhiều file (địa chỉ Supabase, khoá công
          khai, khoá dịch vụ phía server gắn server-only), thiếu biến chỉ lộ ra khi request đầu tiên chạm tới.
        viec: |
          Gom việc đọc biến môi trường về một file src/lib/env.ts: liệt kê tên biến bắt buộc, kiểm có mặt và không trống, kiểm địa chỉ Supabase đúng
          dạng https. Thiếu thì ném lỗi ghi rõ tên biến thiếu (không in giá trị). Gọi kiểm này ở bước prebuild (script scripts/kiem-bien-moi-truong.mjs
          chạy trong lệnh build) để build trên Vercel dừng ngay, và gọi lại lúc khởi động server. Thêm file .env.example chỉ có tên biến và mô tả.
        tieu_chi_xong:
          - "Bỏ một biến bắt buộc rồi chạy lệnh build: build dừng, dòng lỗi nêu đúng tên biến thiếu, mã thoát khác 0"
          - "Đặt biến thành chuỗi rỗng: kết quả như trên (rỗng coi là thiếu)"
          - Đủ biến thì build và chạy bình thường; thời gian build không tăng quá 5 giây
          - Không có giá trị biến nào xuất hiện trong log build hoặc log server (grep giá trị khoá dịch vụ trong log ra 0 dòng)
          - .env.example liệt kê đủ mọi biến mà src/lib/env.ts kiểm; hai danh sách khớp nhau (kiểm bằng script so sánh)
        file_cham:
          - src/lib/env.ts (mới)
          - scripts/kiem-bien-moi-truong.mjs (mới)
          - .env.example (mới)
          - package.json (lệnh prebuild)
          - src/lib/supabase/admin.ts (đọc biến qua env.ts)

      - key: X01-04-gioi-han-toc-do-va-nhat-ky-dang-nhap-that-bai
        title: "Giới hạn số lần đăng nhập sai và ghi nhật ký mọi lần đăng nhập thất bại, kể cả lần bị chặn"
        labels: [nguon:gia-co, doi:be]
        lam_sau: [X01-01-bang-ma-loi-chung-va-anh-xa-loi-database]
        boi_canh: |
          Gói T-01 (SCR-01 đăng nhập) gộp vào X-01. Lỗ S-03 (mức cao, đo ở LAB-4): đường đăng nhập là đường công khai duy nhất nhưng không giới hạn
          số lần thử (rate-limit, giới hạn tốc độ) và không ghi nhật ký lần thất bại, nên dò mật khẩu không để lại vết.
          Thiết kế LAB-4 đã chốt: đếm thất bại theo cặp (email viết thường, địa chỉ IP); 5 lần trong 5 phút thì khoá 15 phút, trả 429 kèm số phút còn chờ;
          riêng theo IP 20 lần trong 5 phút cho mọi email; bộ đếm lưu ở bảng Postgres vì server không chia sẻ bộ nhớ giữa các máy. Mỗi lần thất bại ghi
          một dòng nhật ký với lý do: sai thông tin, tài khoản bị khoá, hoặc bị giới hạn. Mã 429 lấy từ bảng mã lỗi X01-01.
          Phần chuyển hướng sau đăng nhập (S-06) làm ở X02-01, không ở đây.
        viec: |
          Tạo bảng login_attempts (email, IP, thời điểm, kết quả) bằng migration có bước quay lại; ở route đăng nhập, trước khi gọi xác thực, đếm số
          lần thất bại theo hai ngưỡng trên; vượt thì trả 429 kèm số phút. Mỗi lần thất bại (kể cả lần bị chặn) ghi một dòng nhật ký thao tác với lý do
          và email đã gõ, không ghi mật khẩu. Dọn dòng đếm cũ hơn 1 ngày bằng một câu xoá chạy ngay trong lúc ghi dòng mới (không cần job riêng).
        tieu_chi_xong:
          - "Gõ sai mật khẩu 5 lần trong 5 phút cho cùng email từ cùng IP: lần thứ 6 nhận 429 kèm số phút; đúng mật khẩu cũng vẫn 429 cho tới hết 15 phút"
          - "Cùng email, IP khác: không bị khoá chung; cùng IP, 20 email khác nhau sai liên tiếp: email thứ 21 nhận 429"
          - "Sau 6 lần thử ở ca đầu, nhật ký có 5 dòng lý do \"sai thông tin\" và 1 dòng lý do \"bị giới hạn\", mỗi dòng có email, không có mật khẩu; màn tra cứu nhật ký lọc được theo thao tác đăng nhập thất bại"
          - Đăng nhập đúng sau khi hết khoá thì bộ đếm cho cặp đó về 0; bảng login_attempts không còn dòng cũ hơn 1 ngày sau lần ghi mới
        file_cham:
          - src/app/api/auth/login/route.ts (đếm, 429, ghi nhật ký)
          - supabase/schema.sql (bảng login_attempts mới)

      - key: X01-05-hang-doi-cuc-bo-khi-mat-mang-man-ghi-dot-giao
        title: "Hàng đợi cục bộ khi mất mạng cho màn ghi đợt giao, gửi lại khi có mạng, không tạo trùng"
        labels: [nguon:moi, doi:fe]
        lam_sau: [T08-02-ghi-dot-giao-an-toan-khi-dong-thoi, T08-06-hop-thoai-va-khoa-nut-man-giao-hang]
        boi_canh: |
          Hồ sơ mời thầu yêu cầu màn hiện trường vẫn ghi được khi mất mạng rồi tự gửi lại (D-15); prototype gọi thẳng server, mất mạng là báo lỗi và
          mất dữ liệu vừa nhập. LAB-4 liệt kê 6 màn hiện trường; issue này làm cho màn ghi đợt giao (SCR-15), là màn dùng ngoài trời nhiều nhất,
          và dựng khung dùng chung; nối thêm các màn nhận lô, thẩm định, giao dịch để giai đoạn sau vì hiện trường mất mạng chủ yếu ở bước ghi đợt giao.
          Hàm ghi đợt giao ở T08-02 phải nhận một khoá chống trùng (idempotency key, mã do trình duyệt sinh cho mỗi lần bấm) để gửi lại không tạo
          đợt thứ hai; nếu T08-02 chưa có, bổ sung ở đây.
        viec: |
          Thêm service worker (đoạn mã chạy nền trong trình duyệt) và hàng đợi trong IndexedDB (kho lưu cục bộ của trình duyệt): khi gửi đợt giao mà
          mất mạng, lưu yêu cầu vào hàng đợi kèm khoá chống trùng và thời điểm, hiện huy hiệu "Chờ gửi: n"; khi có mạng, gửi lại theo thứ tự, xoá khỏi
          hàng đợi khi server trả thành công hoặc trả "đã nhận trước đó"; lỗi nghiệp vụ (ngày đã khoá, vượt số lượng) thì giữ lại và hiện cho người
          dùng xử lý tay. Hàm ghi đợt giao từ chối khoá chống trùng đã dùng bằng cách trả lại kết quả cũ.
        tieu_chi_xong:
          - Tắt mạng (chế độ offline của trình duyệt), ghi 3 đợt giao, bật mạng lại; server có đúng 3 đợt, không trùng; huy hiệu về 0
          - Gửi lại cùng khoá chống trùng hai lần thì server chỉ có một đợt và lần hai nhận "đã nhận trước đó"
          - Đợt nằm trong hàng đợi gặp ngày đã khoá khi gửi lại thì không mất, hiện trong danh sách chờ với lý do, người dùng xoá được kèm ghi nhật ký
          - Đóng trình duyệt khi còn 2 yêu cầu chờ, mở lại thì vẫn còn 2 và gửi được
          - Màn 390 px vẫn hiện huy hiệu chờ gửi, không cuộn ngang
        file_cham:
          - src/sw.ts (mới, service worker)
          - src/lib/offline-queue.ts (mới)
          - src/components/delivery-form.tsx (gắn hàng đợi)
          - supabase/schema.sql (cột khoá chống trùng của đợt giao, nếu T08-02 chưa có)

      - key: X01-06-sao-luu-va-dien-tap-khoi-phuc
        title: "Sao lưu theo thời điểm và diễn tập khôi phục database, đo được thời gian khôi phục dưới 4 giờ và mất dữ liệu dưới 15 phút"
        labels: [nguon:moi, doi:infra]
        boi_canh: |
          Hồ sơ mời thầu đặt chỉ tiêu khôi phục sau sự cố: hệ thống chạy lại trong 4 giờ (RTO) và mất tối đa 15 phút dữ liệu (RPO) (D-28b).
          Prototype không có chiến lược sao lưu; mất database là mất hết. Supabase có sao lưu theo thời điểm (PITR, khôi phục về bất kỳ phút nào)
          ở gói trả phí; nếu gói hiện tại không có, phải sao lưu bằng lệnh định kỳ.
        viec: |
          Bật sao lưu theo thời điểm nếu gói cho phép; nếu không, viết script scripts/sao-luu.sh chạy định kỳ 15 phút bằng pg_dump (lệnh xuất toàn bộ
          database) lên kho lưu riêng, giữ 7 ngày. Viết quy trình khôi phục ở docs/sao-luu-khoi-phuc.md trong repo này: từng bước, ai làm, lệnh nào.
          Diễn tập một lần trên project thử: xoá bảng giao dịch, khôi phục về mốc 10 phút trước, đo thời gian và số dòng mất; ghi kết quả vào tài liệu.
        tieu_chi_xong:
          - docs/sao-luu-khoi-phuc.md có bảng kết quả diễn tập với ngày, thời gian khôi phục (phút), số dòng mất; thời gian dưới 240 phút, dữ liệu mất dưới 15 phút
          - Script hoặc cấu hình sao lưu chạy được ít nhất 24 giờ liên tục, có 96 bản (mỗi 15 phút) hoặc nhật ký PITR xác nhận
          - Không khoá hay địa chỉ bí mật nào trong script và tài liệu (grep ra 0)
          - Người chưa từng làm, đọc tài liệu và khôi phục được trên project thử trong một buổi (ghi tên vai người thử, không ghi tên thật)
        file_cham:
          - docs/sao-luu-khoi-phuc.md (mới, trong repo này)
          - scripts/sao-luu.sh (mới, nếu gói không có PITR)

  - key: E-X02
    title: "X-02 Bảo mật và phân quyền: chặn vai ở màn, danh sách đường dẫn cho phép, rà quyền ghi, xác thực hai lớp"
    labels: []
    body: |
      Epic gom các lỗ phân quyền và bảo mật đã đo ở thiết kế LAB-4 ngoài giới hạn đăng nhập (ở X-01).
      Năm tầng chặn của prototype (middleware, layout, route, hàm database, RLS) giữ nguyên; prototype được khen vì mọi route trả 401 khi chưa đăng
      nhập và quy tắc nghiệp vụ nằm trong database. Việc ở đây là vá tầng layout không chặn vai (S-04), chuyển hướng ra ngoài sau đăng nhập (S-06),
      rà quyền ghi, rồi thêm xác thực hai lớp theo yêu cầu bảo mật của hồ sơ mời thầu.
      Lỗ S-01 (chèn bộ lọc qua tham số tìm kiếm) đã được phủ ở T04-05 (màn người tham gia) và T13-02 (nhật ký) với quy tắc một đường:
      chuỗi tìm truyền vào hàm database như tham số, ký tự đặc biệt được tìm như chữ thường, không bỏ và không báo lỗi. Không lặp ở đây. S-05 ở T14-01, S-07 ở T03-01.
      Chú giải mã: ma trận menu là bảng vai trò và đường dẫn ở src/lib/roles.ts, nguồn duy nhất cho menu, quyền vào màn và tham số next;
      D-11, D-37, D-38 là ba chỗ menu và quyền API lệch nhau; MFA là xác thực hai lớp (mật khẩu cộng một mã thứ hai); TOTP là mã dùng một lần
      theo thời gian do ứng dụng trên điện thoại sinh.
      Quyết định D-11: vai không có trong ma trận menu không mở được màn, kể cả gõ thẳng đường dẫn; vai quản trị hệ thống chỉ thấy các màn mà
      vai đó có quyền ghi hoặc đọc theo ma trận, không còn "thấy toàn bộ".
      Giả định: không có giả định riêng; epic bám PREMISE.md và thiết kế LAB-4.
      Thứ tự làm: X02-01 trước (Sprint 1), X02-02 sau X02-01; X02-03 rồi X02-04 (cần X01-04 xong).
    issues:
