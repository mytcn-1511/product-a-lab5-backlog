              - "Gọi đường job không kèm khoá đúng nhận lỗi quyền; email thử gửi tới địa chỉ mẫu trong dữ liệu thử, không có địa chỉ thật trong repo; lịch hiện trong danh sách pg_cron"
            file_cham:
              - "supabase/schema.sql (bảng notification_deliveries, ràng buộc, chỉ mục, lịch pg_cron)"
