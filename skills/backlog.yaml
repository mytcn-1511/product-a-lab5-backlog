      - key: X02-02-ra-quyen-ghi-moi-route
        title: "Rà quyền ghi: mọi route tạo, sửa, xoá đều kiểm vai ở server, bảng kết quả ghi vào tests"
        labels: [nguon:gia-co, doi:be]
        lam_sau: [X02-01-chan-vai-vao-man-va-duong-dan-cho-phep-sau-dang-nhap, X03-00-dung-database-thu-mot-lenh]
        boi_canh: |
          Prototype có hàm requireUser kiểm vai ở từng route, nhưng không có bảng tổng nào chứng minh mọi route ghi đều gọi hàm này với đúng danh
          sách vai. Thiết kế LAB-4 đếm được 37 đường API, LAB-4 ghi nhận lệch giữa menu và quyền API (D-11, D-37, D-38). Backlog LAB-5 thêm nhiều
          route mới (tiền về, lịch chợ, xác thực hai lớp, xác nhận kết quả đấu giá), cần một kiểm thử tự động bắt route mới thiếu kiểm vai.
          Kiểm thử chạy trên database thử của X03-00.
        viec: |
          Viết script quét thư mục src/app/api lấy mọi route có POST, PATCH, DELETE (số thật in ra lúc chạy); với mỗi route ghi vai được phép theo ma
          trận. Viết kiểm thử tự động: gọi khi chưa đăng nhập phải nhận 401, gọi bằng một vai không được phép phải nhận 403, gọi bằng vai được phép không
          nhận 401 hay 403. Route ghi nào chưa có trong bảng thì kiểm thử đỏ nêu tên.
        tieu_chi_xong:
          - Bảng route × vai ở mục riêng của tests/README.md; số route trong bảng bằng số route ghi quét được (kiểm thử in cả hai số)
          - "Mọi route ghi: chưa đăng nhập nhận 401; vai sai nhận 403; có kiểm thử cho từng route"
          - "Thêm một route ghi giả không có kiểm vai: kiểm thử báo đỏ nêu tên route"
          - Chỗ lệch tìm được khi rà sửa ngay nếu chỉ là danh sách vai; nếu đổi nghiệp vụ thì mở issue ở epic màn hình tương ứng, link ghi trong bình luận
        file_cham:
          - tests/write-routes-access.test.ts (mới)
